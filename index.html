/* ============================ cálculos ============================ */
function calcular(){
  const mes = S.mes, mesAnt = sumaMes(mes,-1);
  const delMes = S.movimientos.filter(m=>enPeriodo(m.fecha,mes));
  const gastos = delMes.filter(m=>m.tipo==="gasto");
  const ingresos = delMes.filter(m=>m.tipo==="ingreso");
  const gastosAnt = S.movimientos.filter(m=>enPeriodo(m.fecha,mesAnt) && m.tipo==="gasto");

  const totalGasto = gastos.reduce((a,b)=>a+b.monto,0);
  const totalIngreso = ingresos.reduce((a,b)=>a+b.monto,0);
  const presupuestoTotal = Object.values(S.presupuestos).reduce((a,b)=>a+(b||0),0);

  const dias = diasPeriodo(mes);
  const esMesActual = mes===periodoDe(hoyISO());
  const diaHoy = esMesActual? diaDelPeriodo(mes) : dias;
  const restantes = Math.max(0,dias-diaHoy);
  const ritmoDiario = totalGasto/Math.max(1,diaHoy);

  /* Base de ingresos del mes.
     El ingreso estimado es lo que la familia espera recibir; los registrados son
     los que ya entraron. A mitad de mes suele faltar parte del sueldo, así que
     por omisión se toma el mayor de los dos y se muestran ambos, para que se vea
     de dónde sale la cifra. La base se puede fijar a mano en Ajustes. */
  const ingresoRegistrado = totalIngreso;
  const ingresoEstimado = S.config.ingresoMensual||0;
  const base = S.config.baseIngreso||"auto";
  const ingresoBase =
      base==="registrado" ? ingresoRegistrado
    : base==="estimado"   ? (ingresoEstimado || ingresoRegistrado)
    : esMesActual         ? Math.max(ingresoRegistrado, ingresoEstimado)
    : (ingresoRegistrado>0 ? ingresoRegistrado : ingresoEstimado);
  const baseUsada = ingresoBase===ingresoEstimado && ingresoEstimado!==ingresoRegistrado
    ? "estimado" : "registrado";

  /* Aportes y retiros de las cuentas de ahorro.
     Un aporte no es un gasto —el dinero sigue siendo tuyo— pero sí sale del
     disponible del mes de quien lo transfiere: ya no puede gastarlo. Los
     marcados como "solo cuenta" (intereses, comisiones, traspasos internos)
     mueven el saldo de la cuenta sin tocar el presupuesto del mes. */
  const aportes = delMes.filter(m=>m.tipo==="ahorro" && !m.soloCuenta);
  const retiros = delMes.filter(m=>m.tipo==="retiro" && !m.soloCuenta);
  const totalAporte = aportes.reduce((a,b)=>a+b.monto,0);
  const totalRetiro = retiros.reduce((a,b)=>a+b.monto,0);
  const disponible = ingresoBase - totalGasto - totalAporte + totalRetiro;

  /* Saldo de cada cuenta: el inicial más todo lo aportado menos lo retirado,
     desde siempre y no solo de este mes. */
  const cuentasCalc = S.cuentas.map(c=>{
    const dentro = S.movimientos.filter(m=>m.cuentaId===c.id);
    const entradas = dentro.filter(m=>m.tipo==="ahorro").reduce((a,b)=>a+b.monto,0);
    const salidas  = dentro.filter(m=>m.tipo==="retiro").reduce((a,b)=>a+b.monto,0);
    const delMesC  = dentro.filter(m=>enPeriodo(m.fecha,mes));
    return {...c,
      saldo:(c.saldoInicial||0)+entradas-salidas, entradas, salidas,
      aporteMes: delMesC.filter(m=>m.tipo==="ahorro").reduce((a,b)=>a+b.monto,0),
      retiroMes: delMesC.filter(m=>m.tipo==="retiro").reduce((a,b)=>a+b.monto,0),
      movimientos: dentro.length,
    };
  }).sort((a,b)=>b.saldo-a.saldo);
  const saldoAhorros = cuentasCalc.reduce((a,c)=>a+c.saldo,0);

  /* Proyección de cierre de mes.
     Los cargos fijos (renta, servicios, colegiatura, suscripciones, cuotas de deuda)
     ocurren una vez al mes: promediarlos por día y multiplicarlos por 31 los
     multiplicaría varias veces. Se separan del gasto variable, se proyecta solo
     este último, y se suman aparte los fijos que aún no se han pagado este mes. */
  const gastoFijo = gastos.filter(g=>esFijaCat(g.categoria)).reduce((a,b)=>a+b.monto,0);
  const gastoVariable = totalGasto-gastoFijo;
  const ritmoVariable = gastoVariable/Math.max(1,diaHoy);
  const conceptosMes = new Set(gastos.map(g=>(g.nota||"").trim().toLowerCase()).filter(Boolean));
  const fijosPendientes = gastosAnt
    .filter(g=>esFijaCat(g.categoria))
    .filter(g=>{const k=(g.nota||"").trim().toLowerCase(); return k && !conceptosMes.has(k);})
    .reduce((a,b)=>a+b.monto,0);
  const proyectado = esMesActual
    ? totalGasto + ritmoVariable*restantes + fijosPendientes
    : totalGasto;
  const margenRestante = presupuestoTotal - totalGasto - fijosPendientes;
  const disponibleDiario = restantes>0? margenRestante/restantes : 0;

  /* Ahorro real del hogar: lo que entra menos lo que sale, sumando a las dos
     personas. Distinto del "ahorro potencial", que son oportunidades de recorte. */
  const ahorroReal = ingresoBase - totalGasto;
  const tasaAhorro = ingresoBase>0? ahorroReal/ingresoBase : 0;
  const ahorroProyectado = ingresoBase - proyectado;
  const tasaProyectada = ingresoBase>0? ahorroProyectado/ingresoBase : 0;

  const porCat = CATEGORIAS.map(c=>{
    const l = gastos.filter(g=>g.categoria===c.cod);
    const total = l.reduce((a,b)=>a+b.monto,0);
    const totalAnt = gastosAnt.filter(g=>g.categoria===c.cod).reduce((a,b)=>a+b.monto,0);
    const pres = S.presupuestos[c.cod]||0;
    /* Reparto interno: primero los sub-sobres declarados, después lo que
       quedó sin clasificar, para que la suma cuadre siempre con el total. */
    const mapa = {};
    l.forEach(g=>{ const k=(g.sub||"").trim()||SIN_SUB; mapa[k]=(mapa[k]||0)+g.monto; });
    const subs = Object.entries(mapa)
      .map(([nombre,monto])=>({nombre, monto, n:l.filter(g=>((g.sub||"").trim()||SIN_SUB)===nombre).length}))
      .sort((a,b)=> a.nombre===SIN_SUB? 1 : b.nombre===SIN_SUB? -1 : b.monto-a.monto);
    const porQuien = {};
    l.forEach(g=>{ const k=g.miembro||"—"; porQuien[k]=(porQuien[k]||0)+g.monto; });
    const personas = Object.entries(porQuien).map(([nombre,monto])=>({nombre,monto}))
      .sort((a,b)=>b.monto-a.monto);
    return {...c,total,totalAnt,pres,n:l.length,subs,personas,
      ticket:l.length?total/l.length:0,
      uso:pres>0?total/pres:null, variacion: totalAnt>0? (total-totalAnt)/totalAnt : null, delta: total-totalAnt};
  }).sort((a,b)=>b.total-a.total);

  const esenciales = gastos.filter(g=>g.esencial).reduce((a,b)=>a+b.monto,0);
  const prescindibles = totalGasto-esenciales;

  const acumulado=[]; let acc=0;
  fechasPeriodo(mes).forEach((dd,i)=>{
    const d = i+1;                       // día número i dentro del ciclo
    acc += gastos.filter(g=>g.fecha===dd).reduce((a,b)=>a+b.monto,0);
    acumulado.push({dia:Number(dd.slice(8)),      // se rotula con el día del calendario
                    gasto:(esMesActual&&d>diaHoy)?null:acc,
                    limite:presupuestoTotal*d/dias});
  });
  const historico=[];
  for(let k=5;k>=0;k--){
    const mm=sumaMes(mes,-k);
    const g=S.movimientos.filter(m=>enPeriodo(m.fecha,mm)&&m.tipo==="gasto").reduce((a,b)=>a+b.monto,0);
    const i=S.movimientos.filter(m=>enPeriodo(m.fecha,mm)&&m.tipo==="ingreso").reduce((a,b)=>a+b.monto,0);
    historico.push({mes:mesCorto(mm),gasto:g,ingreso:i});
  }
  const porDia = DIAS.map((d,i)=>{
    const l=gastos.filter(g=>aDate(g.fecha).getDay()===i);
    return {dia:d,total:l.reduce((a,b)=>a+b.monto,0),n:l.length};
  });
  const agrupar = campo=>{
    const m={}; gastos.forEach(g=>{const k=g[campo]||"—"; m[k]=(m[k]||0)+g.monto});
    return Object.entries(m).map(([nombre,total])=>({nombre,total})).sort((a,b)=>b.total-a.total);
  };
  const conceptos={};
  gastos.forEach(g=>{
    const k=(g.nota||"Sin concepto").trim().toLowerCase();
    if(!conceptos[k]) conceptos[k]={nombre:g.nota||"Sin concepto",total:0,n:0,cod:g.categoria};
    conceptos[k].total+=g.monto; conceptos[k].n++;
  });
  const topConceptos=Object.values(conceptos).sort((a,b)=>b.total-a.total).slice(0,8);

  const ticketGeneral = gastos.length? totalGasto/gastos.length : 0;
  const umbralMicro = Math.max(ticketGeneral*0.3,1);
  const micro = gastos.filter(g=>g.monto<=umbralMicro && !g.esencial);
  const microTotal = micro.reduce((a,b)=>a+b.monto,0);

  const rec={};
  S.movimientos.filter(m=>m.tipo==="gasto").forEach(g=>{
    const k=(g.nota||"").trim().toLowerCase(); if(!k) return;
    if(!rec[k]) rec[k]={nombre:g.nota,meses:new Set(),montos:[],cod:g.categoria};
    rec[k].meses.add(periodoDe(g.fecha)); rec[k].montos.push(g.monto);
  });
  const recurrentes = Object.values(rec).filter(r=>r.meses.size>=3)
    .map(r=>({nombre:r.nombre,cod:r.cod,meses:r.meses.size,promedio:r.montos.reduce((a,b)=>a+b,0)/r.montos.length}))
    .sort((a,b)=>b.promedio-a.promedio);

  const deudaTotal = S.deudas.reduce((a,d)=>a+(d.saldo||0),0);
  const pagoMinTotal = S.deudas.reduce((a,d)=>a+(d.pagoMensual||0),0);
  const deudasCalc = S.deudas.map(d=>({...d,...amortizar(d)})).sort((a,b)=>(b.tasaAnual||0)-(a.tasaAnual||0));
  const metasCalc = S.metas.map(m=>{
    const faltan = Math.max(0,(m.objetivo||0)-(m.ahorrado||0));
    const meses = m.fechaLimite? mesesHasta(m.fechaLimite) : null;
    return {...m, faltan, meses, requerido: meses&&meses>0? faltan/meses : null,
      progreso: m.objetivo>0? clamp((m.ahorrado||0)/m.objetivo,0,1) : 0};
  });

  /* Desglose por persona: en un hogar de dos, saber quién aporta y quién gasta
     en qué es la estadística más útil. Se agrupa por el nombre atribuido, y se
     cuenta aparte quién registró cada movimiento (por uid). */
  const porPersona = personasHogar().map(nombre=>{
    const g = gastos.filter(x=>x.miembro===nombre);
    const i = ingresos.filter(x=>x.miembro===nombre);
    const gasto = g.reduce((a,b)=>a+b.monto,0);
    const ingreso = i.reduce((a,b)=>a+b.monto,0);
    const aporte = aportes.filter(x=>x.miembro===nombre).reduce((a,b)=>a+b.monto,0);
    const retiro = retiros.filter(x=>x.miembro===nombre).reduce((a,b)=>a+b.monto,0);
    /* Base de ingreso de esta persona: lo suyo registrado frente a lo suyo
       estimado, con el mismo criterio que se aplica al hogar. */
    const estP = (S.config.ingresosPersona||{})[nombre] || 0;
    const baseP = base==="registrado" ? ingreso
                : base==="estimado"   ? (estP||ingreso)
                : esMesActual         ? Math.max(ingreso,estP)
                : (ingreso>0? ingreso : estP);
    const porCatP = {};
    g.forEach(x=>{ porCatP[x.categoria]=(porCatP[x.categoria]||0)+x.monto; });
    const top = Object.entries(porCatP).sort((a,b)=>b[1]-a[1])[0];
    const registrados = S.movimientos.filter(x=>enPeriodo(x.fecha,mes) && nombreDe(x.uid)===nombre).length;
    return {
      nombre, gasto, ingreso, aporte, retiro, baseP,
      neto:ingreso-gasto,
      disponible: baseP - gasto - aporte + retiro,
      n:g.length, registrados,
      ticket: g.length? gasto/g.length : 0,
      pct: totalGasto>0? gasto/totalGasto : 0,
      prescindible: g.filter(x=>!x.esencial).reduce((a,b)=>a+b.monto,0),
      topCat: top? {cod:top[0], monto:top[1]} : null,
      color: colorPersona(nombre),
    };
  }).filter(p=>p.gasto>0||p.ingreso>0||p.aporte>0||p.baseP>0).sort((a,b)=>b.gasto-a.gasto);
  const sinAsignar = gastos.filter(x=>!personasHogar().includes(x.miembro)).reduce((a,b)=>a+b.monto,0);
  const restoDisponible = disponible - porPersona.reduce((a,p)=>a+p.disponible,0);

  return {mes,mesAnt,delMes,gastos,ingresos,gastosAnt,totalGasto,totalIngreso,ingresoBase,presupuestoTotal,disponible,
    dias,diaHoy,restantes,esMesActual,ritmoDiario,proyectado,porCat,esenciales,prescindibles,acumulado,historico,porDia,
    gastoFijo,gastoVariable,ritmoVariable,fijosPendientes,margenRestante,disponibleDiario,
    ingresoRegistrado,ingresoEstimado,baseUsada,porPersona,sinAsignar,restoDisponible,
    aportes,retiros,totalAporte,totalRetiro,cuentasCalc,saldoAhorros,
    ahorroReal,tasaAhorro,ahorroProyectado,tasaProyectada,
    porMetodo:agrupar("metodo"),porMiembro:agrupar("miembro"),topConceptos,ticketGeneral,umbralMicro,micro,microTotal,
    recurrentes,recurrentesNoEsenciales:recurrentes.filter(r=>!CAT[r.cod]?.esencial),
    deudaTotal,pagoMinTotal,deudasCalc,metasCalc};
}

function amortizar(d,extra=0){
  const tasa=(d.tasaAnual||0)/100/12, pago=(d.pagoMensual||0)+extra;
  let saldo=d.saldo||0, interes=0, meses=0;
  if(saldo<=0) return {meses:0,interes:0,viable:true};
  if(pago<=saldo*tasa) return {meses:Infinity,interes:Infinity,viable:false};
  while(saldo>0 && meses<600){ const i=saldo*tasa; interes+=i; saldo=saldo+i-pago; meses++; }
  return {meses,interes,viable:true};
}
const mesesHasta = f=>{
  const [y,m]=f.split("-").map(Number); const hoy=new Date();
  return (y-hoy.getFullYear())*12 + (m-1-hoy.getMonth());
};

/* ==================== motor de recomendaciones ====================
   Cada recomendación lleva un `grupo`, porque varias describen el mismo
   dinero desde ángulos distintos y no se pueden sumar entre sí:
     · presupuesto → excesos por categoría; son dinero distinto: se suman.
     · habitos     → prescindible, compras hormiga, patrón semanal,
                     suscripciones; unas están contenidas en otras: se toma
                     la mayor, nunca la suma.
     · alza        → aumentos contra el mes anterior: se suman.
     · exceso      → avisos de desvío (ritmo, tarjeta que crece). NO son
                     ahorro conseguible: quedan fuera del total.
     · deuda       → intereses, que son cifra anual: quedan fuera del total.
   ================================================================== */
const MODO_GRUPO = {presupuesto:"suma", habitos:"max", alza:"suma"};

function ahorroPotencial(rec,R){
  const acum={};
  rec.filter(r=>r.ahorro>0 && MODO_GRUPO[r.grupo]).forEach(r=>{
    acum[r.grupo] = MODO_GRUPO[r.grupo]==="max"
      ? Math.max(acum[r.grupo]||0, r.ahorro)
      : (acum[r.grupo]||0) + r.ahorro;
  });
  const total = Object.values(acum).reduce((a,b)=>a+b,0);
  // Techo lógico: no se puede ahorrar más que lo prescindible más los excesos.
  const excesos = R.porCat.filter(c=>c.pres>0&&c.total>c.pres).reduce((a,c)=>a+(c.total-c.pres),0);
  return Math.min(total, R.prescindibles + excesos);
}
const cuenta = (n,sing,plur)=>`${n} ${n===1?sing:plur}`;

function recomendar(R){
  const out=[]; const push=o=>out.push({id:uid(),nivel:"info",ahorro:0,...o});
  if(R.gastos.length<3 && S.deudas.length===0 && S.metas.length===0) return out;

  R.porCat.filter(c=>c.pres>0&&c.total>c.pres).sort((a,b)=>(b.total-b.pres)-(a.total-a.pres)).slice(0,3).forEach(c=>{
    const ex=c.total-c.pres;
    const n=Math.ceil(ex/Math.max(c.ticket,1));
    push({nivel:"alto",grupo:"presupuesto",etiqueta:`${c.cod} · presupuesto excedido`,ahorro:ex,
      titulo:`${c.nombre} superó su sobre en ${fmt(ex)}`,
      detalle:`El hogar lleva ${fmt(c.total)} contra un presupuesto de ${fmt(c.pres)} (${Math.round(c.uso*100)}%). Con ${cuenta(c.n,"compra","compras")}, el ticket promedio es ${fmt(c.ticket)}.`,
      accion:`Recortar ${cuenta(n,"compra","compras")} de este tipo al mes devuelve el sobre a su límite.`});
  });

  if(R.esMesActual && R.presupuestoTotal>0 && R.proyectado>R.presupuestoTotal*1.02){
    const ex=R.proyectado-R.presupuestoTotal;
    push({nivel:"alto",grupo:"exceso",etiqueta:"Ritmo de gasto",ahorro:ex,cifra:"exceso proyectado",
      titulo:`Vas camino a cerrar el mes en ${fmt(R.proyectado)}`,
      detalle:`El hogar lleva ${fmt(R.totalGasto)} en ${R.diaHoy} días. Al ritmo variable de ${fmt(R.ritmoVariable)} al día`+
        (R.fijosPendientes>0?`, más ${fmt(R.fijosPendientes)} de cargos fijos que aún faltan por pagar,`:"")+
        ` cerrarías ${fmt(ex)} por encima del presupuesto de ${fmt(R.presupuestoTotal)}.`,
      accion: R.margenRestante>0
        ? `Te quedan ${fmt(R.margenRestante)} de margen: son ${fmt(R.disponibleDiario)} por día durante los ${R.restantes} días que faltan.`
        : `Ya no queda margen: el presupuesto está superado en ${fmt(-R.margenRestante)}. A partir de aquí lo realista es contener el exceso, no cumplir el mes; revisa si los sobres están bien dimensionados en Ajustes.`});
  }

  if(R.totalGasto>0){
    const pct=R.prescindibles/R.totalGasto;
    if(pct>0.3){
      const ah=R.prescindibles*0.25;
      push({nivel:"medio",grupo:"habitos",etiqueta:"Composición del gasto",ahorro:ah,
        titulo:`El ${Math.round(pct*100)}% del gasto del hogar es prescindible`,
        detalle:`${fmt(R.prescindibles)} del gasto conjunto fueron a restaurantes, ocio, compras o suscripciones. Por encima del 30% el margen de ahorro está aquí, no en lo esencial.`,
        accion:`Bajar esa bolsa un 25% libera ${fmt(ah)} al mes sin tocar comida, vivienda ni salud.`});
    }
  }

  if(R.micro.length>=6){
    const ah=R.microTotal*0.4;
    push({nivel:"medio",grupo:"habitos",etiqueta:"Compras hormiga",ahorro:ah,
      titulo:`${R.micro.length} compras pequeñas suman ${fmt(R.microTotal)}`,
      detalle:`Gastos no esenciales de menos de ${fmt(R.umbralMicro)} cada uno. Juntos equivalen al ${Math.round(R.microTotal/R.totalGasto*100)}% del gasto del mes.`,
      accion:`Fija un tope semanal en efectivo: recortarlas 40% deja ${fmt(ah)} al mes.`});
  }

  const crecio = R.porCat.filter(c=>c.totalAnt>0&&c.delta>0&&c.variacion>0.25&&c.delta>R.totalGasto*0.03).sort((a,b)=>b.delta-a.delta)[0];
  if(crecio) push({nivel:"medio",grupo:"alza",etiqueta:`${crecio.cod} · en alza`,ahorro:crecio.delta,
    titulo:`${crecio.nombre} subió ${Math.round(crecio.variacion*100)}% respecto al mes pasado`,
    detalle:`Pasó de ${fmt(crecio.totalAnt)} a ${fmt(crecio.total)}, ${fmt(crecio.delta)} más. Es el aumento más grande del presupuesto.`,
    accion:`Volver al nivel del mes anterior recupera ${fmt(crecio.delta)}.`});

  const pres = R.gastos.filter(g=>!g.esencial);
  if(pres.length>=5){
    const totalPres = pres.reduce((a,b)=>a+b.monto,0);
    const top = DIAS.map((d,i)=>({dia:d,total:pres.filter(g=>aDate(g.fecha).getDay()===i).reduce((a,b)=>a+b.monto,0)}))
      .sort((a,b)=>b.total-a.total)[0];
    if(top.total>totalPres*0.28) push({grupo:"habitos",etiqueta:"Patrón semanal",ahorro:top.total*0.3,
      titulo:`Los ${top.dia.toLowerCase()} concentran ${Math.round(top.total/totalPres*100)}% del gasto prescindible`,
      detalle:`Ese día suma ${fmt(top.total)} en salidas, restaurantes y compras. El hábito, no el precio, mueve la cifra.`,
      accion:`Planea ese día con presupuesto cerrado: reducirlo 30% ahorra ${fmt(top.total*0.3)} al mes.`});
  }

  const sus = R.porCat.find(c=>c.cod==="SUS");
  if(sus&&sus.total>0) push({grupo:"habitos",etiqueta:"SUS · suscripciones",ahorro:sus.total*0.3,
    titulo:`El hogar paga ${fmt(sus.total)} al mes en suscripciones`,
    detalle:`Son ${fmt(sus.total*12)} al año en ${cuenta(sus.n,"cargo recurrente","cargos recurrentes")}. Es el gasto que más fácil se olvida y el más rápido de cancelar.`,
    accion:"Revisa cuáles usaste en las últimas dos semanas y cancela el resto; suele sobrar un tercio."});

  /* tarjetas: gastar más de lo que se abona */
  tarjetas().forEach(t=>{
    const compras = comprasDelMes(t.id,R.mes);
    if(compras>0 && compras > (t.pagoMensual||0)*1.05){
      push({nivel:"alto",grupo:"exceso",cifra:"aumenta la deuda",ahorro:compras-(t.pagoMensual||0),
        etiqueta:"Tarjeta en aumento",
        titulo:`${t.nombre} crece: cargas ${fmt(compras)} y pagas ${fmt(t.pagoMensual||0)}`,
        detalle:`Este mes le sumaste ${fmt(compras)} en compras y el pago mensual es de ${fmt(t.pagoMensual||0)}. La diferencia se queda como deuda y empieza a generar intereses al ${t.tasaAnual||0}% anual.`,
        accion:`Para no crecer el saldo tendrías que pagar al menos ${fmt(compras)} este mes, o bajar las compras a crédito en ${fmt(compras-(t.pagoMensual||0))}.`});
    }
  });

  /* deudas */
  if(R.deudasCalc.length){
    const cara = R.deudasCalc[0];
    const otras = R.deudasCalc.slice(1).reduce((a,d)=>a+(d.pagoMensual||0),0);
    if(cara.tasaAnual>0){
      const conExtra = amortizar(cara, Math.max(200, cara.pagoMensual*0.2));
      const ahorroInt = isFinite(cara.interes)&&isFinite(conExtra.interes)? cara.interes-conExtra.interes : 0;
      push({nivel:"alto",etiqueta:"Deudas · avalancha",ahorro:0,
        titulo:`Ataca primero ${cara.nombre}: ${cara.tasaAnual}% anual`,
        detalle: cara.viable
          ? `Al ritmo actual la liquidas en ${cara.meses} meses y pagarás ${fmt(cara.interes)} de intereses. Es la tasa más alta de tus ${R.deudasCalc.length} deudas.`
          : `Tu pago mensual no alcanza a cubrir los intereses: el saldo crecerá cada mes. Sube el pago por encima de ${fmt(cara.saldo*cara.tasaAnual/100/12)}.`,
        accion: ahorroInt>0? `Abonar un 20% extra cada mes te ahorra ${fmt(ahorroInt)} en intereses y adelanta ${cara.meses-conExtra.meses} meses la liquidación.` : "Prioriza cualquier peso extra en esta deuda antes que en las demás."});
    }
    if(R.ingresoBase>0 && R.pagoMinTotal/R.ingresoBase>0.35){
      push({nivel:"alto",etiqueta:"Carga de deuda",
        titulo:`Tus pagos de deuda son el ${Math.round(R.pagoMinTotal/R.ingresoBase*100)}% del ingreso`,
        detalle:`${fmt(R.pagoMinTotal)} al mes sobre un ingreso de ${fmt(R.ingresoBase)}. Por encima del 35% el presupuesto queda sin margen ante cualquier imprevisto.`,
        accion:"Antes de recortar gastos esenciales, consulta reestructurar o consolidar la deuda de tasa más alta."});
    }
  }

  /* metas */
  R.metasCalc.filter(m=>m.requerido>0).sort((a,b)=>b.requerido-a.requerido).slice(0,2).forEach(m=>{
    push({nivel:"info",etiqueta:"Meta de ahorro",
      titulo:`${m.nombre} necesita ${fmt(m.requerido)} al mes`,
      detalle:`Faltan ${fmt(m.faltan)} de ${fmt(m.objetivo)} y quedan ${m.meses} meses. Llevas ${Math.round(m.progreso*100)}% acumulado.`,
      accion:"Programa una transferencia automática el día que entra el ingreso, no al final del mes."});
  });

  const ahorroReal = R.ingresoBase-R.totalGasto;
  if(S.config.metaAhorro>0){
    if(ahorroReal<S.config.metaAhorro){
      push({nivel:"alto",etiqueta:"Meta mensual",
        titulo:`Te faltan ${fmt(S.config.metaAhorro-ahorroReal)} para tu meta de ${fmt(S.config.metaAhorro)}`,
        detalle:`Este mes el saldo es ${fmt(ahorroReal)}. Las acciones de esta lista cubren buena parte de la diferencia.`,
        accion:"Aparta la meta el día que entra el ingreso, no con lo que sobre al final."});
    }else{
      push({nivel:"bien",etiqueta:"Meta cumplida",
        titulo:`Meta alcanzada: ${fmt(ahorroReal)} ahorrados`,
        detalle:`Superaste tu meta de ${fmt(S.config.metaAhorro)} en ${fmt(ahorroReal-S.config.metaAhorro)}.`,
        accion:"Mueve el excedente a una cuenta separada el mismo día para que no se reabsorba."});
    }
  }
  const orden={alto:0,medio:1,info:2,bien:3};
  return out.sort((a,b)=>(orden[a.nivel]-orden[b.nivel])||(b.ahorro-a.ahorro));
}

/* ============================ gráficas SVG ======================== */
function grLinea(datos,{alto=150,ancho=320}={}){
  const max = Math.max(1,...datos.map(d=>Math.max(d.gasto||0,d.limite||0)));
  const px = (i)=> 24+ i*(ancho-30)/Math.max(1,datos.length-1);
  const py = (v)=> alto-18-(v/max)*(alto-30);
  const linea = (campo,extra)=>{
    const pts = datos.filter(d=>d[campo]!=null).map((d,i)=>`${px(datos.indexOf(d))},${py(d[campo])}`);
    return pts.length? `<polyline fill="none" points="${pts.join(" ")}" ${extra}/>`:"";
  };
  const ejes = [0,.5,1].map(f=>`<line x1="24" x2="${ancho}" y1="${py(max*f)}" y2="${py(max*f)}" stroke="currentColor" stroke-dasharray="2 4" opacity=".35"/>
    <text x="0" y="${py(max*f)+3}" font-size="8">${corto(max*f)}</text>`).join("");
  const etiquetas = datos.filter((d,i)=>i%5===0).map(d=>`<text x="${px(datos.indexOf(d))}" y="${alto-4}" font-size="8" text-anchor="middle">${d.dia}</text>`).join("");
  return `<svg class="gr" viewBox="0 0 ${ancho} ${alto}">${ejes}
    ${linea("limite",'stroke="var(--margen)" stroke-width="1.4" stroke-dasharray="4 4"')}
    ${linea("gasto",'stroke="var(--tinta)" stroke-width="2.2"')}${etiquetas}</svg>
    <div class="gr-leyenda"><span><i style="background:var(--tinta)"></i>Gasto real</span><span><i style="background:var(--margen)"></i>Presupuesto</span></div>`;
}
function grBarras(items,{alto=150,ancho=320,color="var(--azul, #2E6E8E)",series=null}={}){
  const max = Math.max(1,...items.map(i=>series? Math.max(...series.map(s=>i[s.k])) : i.total));
  const n = items.length, w = (ancho-28)/n;
  const py = v=> alto-18-(v/max)*(alto-30);
  const barras = items.map((it,i)=>{
    const x0 = 26+i*w;
    if(series){
      const bw = (w-8)/series.length;
      return series.map((s,j)=>`<rect x="${x0+4+j*bw}" y="${py(it[s.k])}" width="${bw-2}" height="${Math.max(0,alto-18-py(it[s.k]))}" fill="${s.c}"/>`).join("");
    }
    return `<rect x="${x0+4}" y="${py(it.total)}" width="${w-8}" height="${Math.max(0,alto-18-py(it.total))}" fill="${color}"/>`;
  }).join("");
  const ejes=[0,.5,1].map(f=>`<line x1="26" x2="${ancho}" y1="${py(max*f)}" y2="${py(max*f)}" stroke="currentColor" stroke-dasharray="2 4" opacity=".35"/>
    <text x="0" y="${py(max*f)+3}" font-size="8">${corto(max*f)}</text>`).join("");
  const et = items.map((it,i)=>`<text x="${26+i*w+w/2}" y="${alto-4}" font-size="8" text-anchor="middle">${esc(it.mes||it.dia||it.nombre||"")}</text>`).join("");
  const leyenda = series? `<div class="gr-leyenda">${series.map(s=>`<span><i style="background:${s.c};height:9px"></i>${s.n}</span>`).join("")}</div>`:"";
  return `<svg class="gr" viewBox="0 0 ${ancho} ${alto}">${ejes}${barras}${et}</svg>${leyenda}`;
}
function grDona(items){
  const total = items.reduce((a,b)=>a+b.total,0)||1;
  const R0=42,R1=68,cx=90,cy=80; let ang=-Math.PI/2;
  const arcos = items.map(it=>{
    const a = it.total/total*Math.PI*2, fin=ang+a;
    const p = (r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];
    const [x1,y1]=p(R1,ang),[x2,y2]=p(R1,fin),[x3,y3]=p(R0,fin),[x4,y4]=p(R0,ang);
    const big = a>Math.PI?1:0; ang=fin;
    return `<path d="M${x1},${y1} A${R1},${R1} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${R0},${R0} 0 ${big} 0 ${x4},${y4} Z" fill="${col(it.color)}" stroke="var(--hoja)" stroke-width="1.5"${it.cod?` data-detalle-cat="${it.cod}" class="sector" tabindex="0" role="button"><title>${esc(it.nombre)}</title></path>`:"/>"}`;
  }).join("");
  return `<svg class="gr" viewBox="0 0 180 160" style="max-width:230px;margin:0 auto">${arcos}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="9" letter-spacing="1">TOTAL</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12" fill="#16241C">${corto(total)}</text></svg>`;
}
const corto = v=>{ const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(1)+"M"; if(a>=1e3) return Math.round(v/1e3)+"k"; return Math.round(v); };

function desgloseSobre(c){
  const declarados = subsDe(c.cod);
  const max = Math.max(1, ...c.subs.map(s=>s.monto));
  return `<div class="desglose-sobre">
    <div class="sub-cab"><span>Sub-sobres</span>
      <button class="enlace" data-subs="${c.cod}">Gestionar</button></div>

function simularAvalancha(deudas,extra){
  let ds = deudas.map(d=>({saldo:d.saldo||0,tasa:(d.tasaAnual||0)/100/12,pago:d.pagoMensual||0}))
    .sort((a,b)=>b.tasa-a.tasa);
  let meses=0,interes=0;
  while(ds.some(d=>d.saldo>0) && meses<600){
    let libre = extra;
    ds.forEach(d=>{ if(d.saldo<=0){libre+=d.pago; return;}
      const i=d.saldo*d.tasa; interes+=i; d.saldo+=i-d.pago; if(d.saldo<0){libre+=-d.saldo; d.saldo=0;} });
    for(const d of ds){ if(d.saldo>0 && libre>0){ const p=Math.min(libre,d.saldo); d.saldo-=p; libre-=p; } }
    meses++;
    if(meses>=600) return {meses:Infinity,interes:Infinity};
  }
  return {meses,interes};
}

function conectar(R){
  document.querySelectorAll("[data-vista]").forEach(b=>b.onclick=()=>irAVista(b.dataset.vista));
  document.querySelectorAll("[data-borrar]").forEach(b=>b.onclick=()=>DB.borrar(b.dataset.borrar,b.dataset.id));

const esTarjeta = d=>(d?.tipo||"")==="Tarjeta de crédito";
const tarjetas = ()=>S.deudas.filter(esTarjeta);
const cargoDe = mov => (mov && mov.tipo==="gasto" && mov.tarjetaId)
  ? {tarjetaId:mov.tarjetaId, monto:mov.monto} : null;

/* Aplica la diferencia entre el cargo anterior y el nuevo.
   Sirve igual para crear (antes=null), editar y eliminar (despues=null). */
async function ajustarTarjeta(antes,despues){
  const cambios={};
  if(antes?.tarjetaId)   cambios[antes.tarjetaId]   = (cambios[antes.tarjetaId]||0)   - antes.monto;
  if(despues?.tarjetaId) cambios[despues.tarjetaId] = (cambios[despues.tarjetaId]||0) + despues.monto;
  for(const [idT,delta] of Object.entries(cambios)){
    if(!delta) continue;
    const d = S.deudas.find(x=>x.id===idT); if(!d) continue;
    const saldo = Math.max(0,(d.saldo||0)+delta);
    await DB.actualizar("deudas",idT,{saldo, original:Math.max(d.original||0,saldo)});
  }
}

function listaDetalle(movs){
  if(!movs.length) return `<p class="nota">No hay movimientos en este grupo durante ${etiquetaPeriodo(S.mes)}.</p>`;
  return `<div class="detalle-lista">${movs.map(m=>{
    const autor = nombreDe(m.uid)||m.autor||"";
    const tarjeta = S.deudas.find(d=>d.id===m.tarjetaId)?.nombre || nombreCuenta(m.cuentaId);
    return `<div class="detalle-fila" data-editar-mov="${m.id}" role="button" tabindex="0" title="Editar este movimiento">
      <div class="detalle-fecha"><b>${fechaCorta(m.fecha).split(" ")[0]}</b><em>${fechaCorta(m.fecha).split(" ")[1]||""}</em></div>
      <div class="detalle-txt">
        <b>${esc(m.nota||PSEUDO[m.tipo]?.nombre||CAT[m.categoria]?.nombre||"Movimiento")}</b>
        <small>
          <span class="quien" style="color:${col(colorPersona(m.miembro))}">${esc(m.miembro||"—")}</span>
          · ${esc(m.metodo||"—")}${tarjeta?` · ${esc(tarjeta)}`:""}
          ${autor&&autor!==m.miembro?` · reg. ${esc(autor)}`:""}
        </small>
      </div>
      <span class="detalle-monto ${["ingreso","retiro"].includes(m.tipo)?"verde":""}">${["ingreso","retiro"].includes(m.tipo)?"+":"−"}${fmt(m.monto)}</span>
    </div>`;
  }).join("")}</div>`;
}

function resumenDetalle(movs,totalMes){
  const total = movs.reduce((a,b)=>a+b.monto,0);
  const porP = {};
  movs.forEach(m=>{ porP[m.miembro||"—"]=(porP[m.miembro||"—"]||0)+m.monto; });
  const personas = Object.entries(porP).sort((a,b)=>b[1]-a[1]);
  return `<div class="metricas" style="margin-top:0;border-top:none;padding-top:0">
      <div><em>Total</em><b>${fmt(total)}</b></div>
      <div><em>Movimientos</em><b>${movs.length}</b></div>
      <div><em>Ticket promedio</em><b>${fmt(movs.length?total/movs.length:0)}</b></div>
      <div><em>Del gasto del mes</em><b>${totalMes>0?Math.round(total/totalMes*100):0}%</b></div>
    </div>
    ${personas.length>1?`<div class="reparto-personas">
      ${personas.map(([n,v])=>`<span><i style="background:${col(colorPersona(n))}"></i>${esc(n)}
        <b>${fmt(v)}</b><em>${total>0?Math.round(v/total*100):0}%</em></span>`).join("")}
    </div>`:""}`;
}

function detalleCategoria(cod){
  const c = CAT[cod];
  const movs = S.movimientos
    .filter(m=>enPeriodo(m.fecha,S.mes) && m.tipo==="gasto" && m.categoria===cod)
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const R = calcular();
  const datos = R.porCat.find(x=>x.cod===cod);
  const porSub = datos && datos.subs.length>1
    ? `<div class="reparto-personas">${datos.subs.map(s=>`<span><i style="background:${col(c?.color||"#8A9099")};opacity:${s.nombre===SIN_SUB?.35:.85}"></i>${esc(s.nombre)}<b>${fmt(s.monto)}</b></span>`).join("")}</div>`
    : "";
  modalInfo(c?.nombre||cod,
    `<span class="cod" style="color:${col(c?.color||"#8A9099")}">${esc(cod)}</span> · ${etiquetaPeriodo(S.mes)}`,
    resumenDetalle(movs,R.totalGasto) + porSub + listaDetalle(movs));
}

function detallePersona(nombre){
  const movs = S.movimientos
    .filter(m=>enPeriodo(m.fecha,S.mes) && m.miembro===nombre)
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const R = calcular();
  const gastos = movs.filter(m=>m.tipo==="gasto");
  modalInfo(nombre, `Movimientos de ${etiquetaPeriodo(S.mes)}`,
    resumenDetalle(gastos,R.totalGasto) + listaDetalle(movs));
}

/* ============ botón atrás del móvil ===============================
   Android manda el botón atrás al historial del navegador. Sin hacer nada,
   la primera pulsación cierra la app aunque tengas una ventana abierta.
   Aquí se lleva una pila propia: atrás cierra la ventana, y si no hay
   ventana vuelve a la pestaña anterior. Cuando ya no queda nada dentro de
   la app, se avisa antes de dejar que se cierre. */
let pilaApp = [];
let salidaAvisada = false;

function apilar(estado){
  // Una ventana que reemplaza a otra no añade un paso nuevo
  if(estado.tipo==="modal" && pilaApp.at(-1)?.tipo==="modal") return;
  pilaApp.push(estado);
  try{ history.pushState({pf:pilaApp.length}, ""); }catch{}
}

function irAVista(v){
  if(S.vista===v) return;
  apilar({tipo:"vista", vista:S.vista});
  S.vista = v;
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

addEventListener("popstate", ()=>{
  const est = pilaApp.pop();
  if(est){
    salidaAvisada = false;
    if(est.tipo==="modal"){ cerrarModalDOM(); return; }
    if(est.tipo==="vista"){ S.vista = est.vista; render(); return; }
    return;
  }
  // Ya no queda nada que deshacer dentro de la app
  if(!salidaAvisada){
    salidaAvisada = true;
    avisar("Estás al principio · pulsa atrás otra vez para cerrar la app");
    try{ history.pushState({pf:0}, ""); }catch{}   // reponemos el paso para no salir todavía
    setTimeout(()=>{ salidaAvisada = false; }, 4000);
  }else{
    salidaAvisada = false;
    history.back();                                // ahora sí, que se cierre
  }
});

/* Los campos de importe se formatean mientras se escriben. El cursor se
   mide desde la derecha, que es lo único estable cuando se insertan o
   quitan separadores de miles al teclear. */
document.addEventListener("input", e=>{
  const el = e.target;
  if(!el.classList || !el.classList.contains("importe")) return;
  const desdeDerecha = el.value.length - (el.selectionStart ?? el.value.length);
  const crudo = el.value.replace(/[^\d-]/g,"");
  el.value = crudo===""||crudo==="-" ? crudo : miles(num(crudo));
  const pos = Math.max(0, el.value.length - desdeDerecha);
  try{ el.setSelectionRange(pos,pos); }catch{}
});

function iniciarHistorial(){
  try{
    history.replaceState({pf:"base"}, "");
    history.pushState({pf:0}, "");   // colchón: la primera pulsación no cierra la app
  }catch{}
}

  const h=$("#modal-host");
  h.innerHTML=`<div class="modal"><div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">

      <button class="btn primario" id="m-ok">${esc(textoBoton)}</button></div>
  </div></div>`;
  // La ventana NO se cierra al hacer clic fuera ni al pasar el cursor:
  // así no se pierde lo que llevas escrito por un roce accidental.

  $("#m-ok").onclick=async()=>{
    const err = await onGuardar();
    if(err){const e=$("#m-error");e.textContent=err;e.classList.remove("oculto")}

    ${registrador?`<p class="nota firma">Registrado por <b>${esc(registrador)}</b>${m&&m.creado?` · ${new Date(m.creado).toLocaleDateString("es")}`:""}</p>`:""}
  `, async()=>{
    const monto = num($("#m-monto").value);
    if(monto<=0) return "Escribe un monto mayor que cero.";
    const modo = $("#t-gasto").classList.contains("activo") ? "gasto"
               : $("#t-ingreso").classList.contains("activo") ? "ingreso" : "ahorro";
    let tipo = modo, cuentaId = "", soloCuenta = false;
    if(modo==="ahorro"){
      if(!S.cuentas.length) return "Crea primero una cuenta de ahorro en Ahorro → Cuentas de ahorro.";
      cuentaId = $("#m-cuenta").value;
      if(!cuentaId) return "Elige la cuenta de ahorro.";
      tipo = document.querySelector("#m-flujo .activo")?.dataset.flujo || "ahorro";
      soloCuenta = $("#m-solocuenta").checked;
    }
    const cat = document.querySelector("#m-cats .activo")?.dataset.cat||"OTR";
    const metodo = $("#m-metodo").value;
    const tarjetaId = (tipo==="gasto" && metodo==="Crédito") ? ($("#m-tarjeta")?.value||"") : "";
    const sub = tipo==="gasto"? ($("#m-sub")?.value||"") : "";
    const datos = { tipo, monto, categoria: tipo==="gasto"?cat:"OTR", sub, fecha:$("#m-fecha").value,
      metodo, tarjetaId, cuentaId, soloCuenta, miembro:$("#m-miembro").value,
      nota:$("#m-nota").value.trim(), esencial: tipo==="gasto"? $("#m-esencial").checked : true };
    if(m){
      await DB.actualizar("movimientos",id,datos);
      await ajustarTarjeta(cargoDe(m), cargoDe({...m,...datos}));
      avisar("Movimiento actualizado");
    }else{
      // Se estampa quién lo registra: el uid es el dato fiable, el nombre solo la etiqueta.
      await DB.agregar("movimientos",{...datos, uid:S.uid||"", autor:miNombre(), creado:Date.now()});
      await ajustarTarjeta(null, cargoDe(datos));
      avisar(tarjetaId? "Compra cargada a la tarjeta" : (tipo==="gasto"?"Gasto registrado":"Ingreso registrado"));
    }
  }, m? "Guardar cambios":"Guardar movimiento",
     m? {texto:"Eliminar", accion:async()=>{
          await DB.borrar("movimientos",id);
          await ajustarTarjeta(cargoDe(m), null);
          avisar("Movimiento eliminado");
        }} : null);

  const g=$("#t-gasto"), ing=$("#t-ingreso"), aho=$("#t-ahorro");
  const verTarjeta = ()=>{
    const esGasto = g.classList.contains("activo");
    $("#bloque-tarjeta").classList.toggle("oculto", !(esGasto && $("#m-metodo").value==="Crédito"));
  };
  const cambiarModo = (activo)=>{
    [g,ing,aho].forEach(b=>b.classList.remove("activo"));
    activo.classList.add("activo");
    const modo = activo===g? "gasto" : activo===ing? "ingreso" : "ahorro";
    $("#bloque-cat").classList.toggle("oculto", modo!=="gasto");
    $("#bloque-ahorro").classList.toggle("oculto", modo!=="ahorro");
    const etq=$("#etq-miembro");
    if(etq) etq.textContent = modo==="ahorro"? "¿Quién transfiere?"
                            : modo==="ingreso"? "¿Quién lo recibe?" : "¿De quién es el gasto?";
    const nota=$("#m-nota");
    if(nota) nota.placeholder = modo==="ahorro"? "Abono mensual, aguinaldo…"
                              : modo==="ingreso"? "Sueldo, venta, devolución…" : "Supermercado, gasolina…";
    if(modo==="ahorro" && !m) $("#m-metodo").value = "Transferencia";
    verTarjeta();
  };
  $("#m-metodo").onchange = verTarjeta;
  g.onclick=()=>cambiarModo(g); ing.onclick=()=>cambiarModo(ing); aho.onclick=()=>cambiarModo(aho);
  document.querySelectorAll("#m-flujo [data-flujo]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#m-flujo [data-flujo]").forEach(x=>x.classList.remove("activo"));
    b.classList.add("activo");
    const nota=$("#nota-ahorro");
    if(nota) nota.textContent = b.dataset.flujo==="ahorro"
      ? "Un aporte no es un gasto: el dinero sigue siendo tuyo, pero sale del disponible del mes de quien lo transfiere."
      : "Un retiro devuelve el dinero al disponible del mes de quien lo saca.";
  });
  document.querySelectorAll("#m-cats [data-cat]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#m-cats [data-cat]").forEach(x=>{x.classList.remove("activo");x.style.borderColor="";x.style.color=""});
    b.classList.add("activo"); const c=CAT[b.dataset.cat];
    b.style.borderColor=col(c.color); b.style.color=col(c.color); $("#m-esencial").checked=c.esencial;
    const sel=$("#m-sub"); if(sel) sel.innerHTML = opcionesSub(b.dataset.cat, "");
  });
}

/* =============== sobres propios (categorías de la familia) ======== */
function codigoLibre(nombre){
  const limpio = nombre.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z]/g,"");
  const base = (limpio.slice(0,3)||"XXX").padEnd(3,"X");
  if(!CAT[base]) return base;
  for(let i=1;i<100;i++){ const alt=base.slice(0,2)+i; if(!CAT[alt]) return alt; }
  return base.slice(0,2)+Math.floor(Math.random()*90+10);
}

function modalSubsobres(cod){
  const c = CAT[cod]; if(!c) return;

  const usados = {};
  S.movimientos.filter(m=>m.categoria===cod && (m.sub||"").trim())
    .forEach(m=>{ const k=m.sub.trim(); usados[k]=(usados[k]||0)+1; });

  modal(`Sub-sobres de ${c.nombre}`,`
    <p class="nota">Divide el sobre en partes para saber en qué se va por dentro. Al registrar un gasto de <b>${esc(c.nombre)}</b> podrás elegir una.</p>
    ${lista.length? `<ul class="pres">${lista.map(s=>`<li>
      <span class="pres-nom">${esc(s)}</span>
      <span class="cod">${usados[s]? cuenta(usados[s],"gasto","gastos") : "sin uso"}</span>
      <button class="borrar" data-quitar-sub="${esc(s)}" aria-label="Quitar ${esc(s)}">×</button></li>`).join("")}</ul>`
    : `<p class="nota ayuda">Todavía no hay ninguno.</p>`}
    <div class="fila-btns">
      <input id="sub-nuevo" placeholder="Supermercado, feria, farmacia…">
      <button class="btn" id="sub-add">Añadir</button>
    </div>
    <p class="error oculto" id="sub-error"></p>
  `, async()=>{ /* los cambios se guardan al vuelo */ }, "Listo");

  const guardar = async(nuevos)=>{
    await DB.guardarHogar({config:{...S.config, subsobres:{...(S.config.subsobres||{}), [cod]:nuevos}}});
    cerrarModal(); setTimeout(()=>modalSubsobres(cod),120);
  };
  $("#sub-add").onclick = async()=>{
    const v = $("#sub-nuevo").value.trim();
    const e = $("#sub-error");
    if(!v){ e.textContent="Escribe un nombre."; e.classList.remove("oculto"); return; }
    if(lista.some(x=>x.toLowerCase()===v.toLowerCase())){
      e.textContent="Ya existe un sub-sobre con ese nombre."; e.classList.remove("oculto"); return; }
    await guardar([...lista, v]);
  };
  document.querySelectorAll("[data-quitar-sub]").forEach(b=>b.onclick=async()=>{
    const s = b.dataset.quitarSub;
    // Los gastos que lo usaban conservan la etiqueta; solo deja de ofrecerse
    await guardar(lista.filter(x=>x!==s));
  });
}

function sugerirPresupuestos(){
  const nuevos={...S.presupuestos};
  CATEGORIAS.forEach(c=>{
    let suma=0,meses=0;
    for(let k=1;k<=3;k++){
      const mm=sumaMes(periodoDe(hoyISO()),-k);
      const t=S.movimientos.filter(m=>m.tipo==="gasto"&&m.categoria===c.cod&&enPeriodo(m.fecha,mm)).reduce((a,b)=>a+b.monto,0);
      if(t>0){suma+=t;meses++}
    }
    if(meses) nuevos[c.cod]=Math.round(suma/meses*0.9/10)*10;
  });
  DB.guardarHogar({presupuestos:nuevos});
  avisar("Presupuestos sugeridos");
}

/* ==================== reporte en Excel ============================
   Se genera con SheetJS, que se carga solo cuando se pide el reporte.
   Si no hay conexión para traer la librería, se cae a un CSV. */
let XLSX = null;
async function cargarXLSX(){
  if(XLSX) return XLSX;
  XLSX = await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs");
  return XLSX;
}

function hojaDesde(X,filas,anchos,formatos){
  const ws = X.utils.aoa_to_sheet(filas);
  if(anchos) ws["!cols"] = anchos.map(w=>({wch:w}));
  if(formatos){
    const rango = X.utils.decode_range(ws["!ref"]);
    for(let f=1; f<=rango.e.r; f++){
      for(const [colStr,fmt] of Object.entries(formatos)){
        const c = Number(colStr);
        const cel = ws[X.utils.encode_cell({r:f,c})];
        if(cel && typeof cel.v==="number") cel.z = fmt;
      }
    }
  }
  return ws;
}

function exportarCSV(){
  const filas=[["fecha","tipo","categoria","concepto","monto","metodo","tarjeta","persona","registrado_por","esencial"]];
  [...S.movimientos].sort((a,b)=>a.fecha<b.fecha?-1:1).forEach(m=>filas.push(
    [m.fecha,m.tipo,m.categoria,(m.nota||"").replace(/;/g," "),m.monto,m.metodo,
     (S.deudas.find(d=>d.id===m.tarjetaId)?.nombre||"").replace(/;/g," "),m.miembro,
     (nombreDe(m.uid)||m.autor||""),m.esencial?"si":"no"]));
  S.csv = filas.map(f=>f.join(";")).join("\n");
  try{
    const url=URL.createObjectURL(new Blob(["\uFEFF"+S.csv],{type:"text/csv;charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download=`presupuesto-${S.mes}.csv`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch{}
  render();
}

      metodo:"Transferencia",miembro:"Ana",nota:f.nota,esencial:CAT[f.cod].esencial}); });
    for(let d=1;d<=tope;d++){
      const finde=[0,6].includes(new Date(base.getFullYear(),base.getMonth(),d).getDay());
      plantillas.forEach(p=>{
        if(rnd()>p.prob*(finde?1.7:1)) return;
        nuevos.push({tipo:"gasto",monto:Math.round((p.min+rnd()*(p.max-p.min))/5)*5,categoria:p.cod,
          fecha:`${mes}-${pad(d)}`,metodo:pick(METODOS),miembro:pick(miembros),nota:pick(p.notas),esencial:CAT[p.cod].esencial});
      });
    }
  }
  if(S.modo==="local"){
    const idTarjeta = uid();
    S.deudas=[{id:idTarjeta,nombre:"Tarjeta banco",saldo:18500,original:22000,tasaAnual:42,pagoMensual:1800,tipo:"Tarjeta de crédito"},
              {id:uid(),nombre:"Crédito auto",saldo:64000,original:90000,tasaAnual:14,pagoMensual:3200,tipo:"Crédito automotriz"}];
    S.movimientos=[...S.movimientos,...nuevos.map(m=>({...m,id:uid(),
      tarjetaId: m.metodo==="Crédito"&&m.tipo==="gasto"? idTarjeta : ""}))];
    S.metas=[{id:uid(),nombre:"Fondo de emergencia",objetivo:60000,ahorrado:18000,fechaLimite:sumaMes(mesDe(hoyISO()),10)},
             {id:uid(),nombre:"Vacaciones",objetivo:25000,ahorrado:7500,fechaLimite:sumaMes(mesDe(hoyISO()),7)}];
    render();
  }else{
    avisar("Cargando ejemplo…");
    const tarjeta = await DB.agregar("deudas",{nombre:"Tarjeta banco",saldo:18500,original:22000,tasaAnual:42,pagoMensual:1800,tipo:"Tarjeta de crédito"});
    await DB.agregar("deudas",{nombre:"Crédito auto",saldo:64000,original:90000,tasaAnual:14,pagoMensual:3200,tipo:"Crédito automotriz"});
    const idTarjeta = tarjeta.id;
    for(const m of nuevos) await DB.agregar("movimientos",{...m,
      tarjetaId: m.metodo==="Crédito"&&m.tipo==="gasto"? idTarjeta : ""});
    await DB.agregar("metas",{nombre:"Fondo de emergencia",objetivo:60000,ahorrado:18000,fechaLimite:sumaMes(mesDe(hoyISO()),10)});
    await DB.agregar("metas",{nombre:"Vacaciones",objetivo:25000,ahorrado:7500,fechaLimite:sumaMes(mesDe(hoyISO()),7)});
  }
  avisar("Datos de ejemplo cargados");
}

/* ====================== tema claro / papel ======================== */
const guardarLocal=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const leerLocal=k=>{try{return localStorage.getItem(k)}catch{return null}};

const TEMAS = ["papel","claro","oscuro","fiori","femenino"];
const COLOR_BARRA = {papel:"#16241C", claro:"#101A14", oscuro:"#161B22", fiori:"#354A5F", femenino:"#3B2230"};
const NOMBRE_TEMA = {papel:"papel", claro:"claro", oscuro:"oscuro", fiori:"fiori", femenino:"femenino"};

/* ================= marca de agua personal ========================= 
   La foto es de cada persona, no del hogar: se guarda en su perfil
   (usuarios/{uid}) y en este dispositivo, para que aparezca al instante
   y le siga si entra desde otro teléfono. */
const claveFondo = ()=>`pf-fondo:${S.uid||"local"}`;

async function comprimirImagen(file,maxLado=900,calidad=.72){
  const dibujar = (ancho,alto,fuente)=>{
    const c=document.createElement("canvas"); c.width=ancho; c.height=alto;
    c.getContext("2d").drawImage(fuente,0,0,ancho,alto);
    return c.toDataURL("image/jpeg",calidad);
  };
  const medidas = (w,h)=>{ const e=Math.min(1,maxLado/Math.max(w,h)); return [Math.round(w*e),Math.round(h*e)]; };
  if(window.createImageBitmap){
    const bmp = await createImageBitmap(file);
    return dibujar(...medidas(bmp.width,bmp.height),bmp);
  }
  return new Promise((ok,fallo)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const r=dibujar(...medidas(img.width,img.height),img); URL.revokeObjectURL(url); ok(r); };
    img.onerror=()=>{ URL.revokeObjectURL(url); fallo(new Error("imagen ilegible")); };
    img.src=url;
  });
}

function pintarFondo(){
  const el=$("#fondo"); if(!el) return;
  if(S.fondo){ el.style.backgroundImage=`url(${S.fondo})`; el.style.opacity=S.fondoOpacidad??0.14; }
  else { el.style.backgroundImage="none"; el.style.opacity=0; }
}

async function guardarFondo(dataUrl,opacidad){
  S.fondo=dataUrl||""; S.fondoOpacidad=opacidad??S.fondoOpacidad??0.14;
  pintarFondo();
  guardarLocal(claveFondo(), S.fondo);
  guardarLocal(claveFondo()+":op", String(S.fondoOpacidad));
  if(S.modo==="nube" && FB?.guardarPerfil){
    try{ await FB.guardarPerfil({fondo:S.fondo, fondoOpacidad:S.fondoOpacidad}); }
    catch(e){ console.warn("fondo:",e); avisar("Guardada solo en este dispositivo"); }
  }
}

function cargarFondoLocal(){
  S.fondo = leerLocal(claveFondo())||"";
  const op = parseFloat(leerLocal(claveFondo()+":op"));
  S.fondoOpacidad = isFinite(op)? op : 0.14;
  pintarFondo();
}

async function elegirFondo(){
  const input=$("#fondo-archivo");
  input.value="";
  input.onchange=async()=>{
    const f=input.files?.[0]; if(!f) return;
    if(!f.type.startsWith("image/")){ avisar("Elige un archivo de imagen"); return; }
    avisar("Procesando la foto…");
    try{
      let url = await comprimirImagen(f);
      if(url.length>800000) url = await comprimirImagen(f,700,.6);
      if(url.length>900000){ avisar("La foto es demasiado pesada, prueba con otra"); return; }
      await guardarFondo(url);
      render(); avisar("Fondo actualizado");
    }catch(e){ console.error(e); avisar("No se pudo leer la imagen"); }
  };
  input.click();
}

const TIPOS = ["inter","roboto","original"];
const NOMBRE_TIPO = {inter:"Inter", roboto:"Roboto", original:"Bricolage + Karla"};
function aplicarTipo(t){
  S.tipo = TIPOS.includes(t)? t : "inter";
  document.documentElement.dataset.tipo = S.tipo;
  guardarLocal("pf-tipo",S.tipo);
}

function aplicarTema(t){
  S.tema = TEMAS.includes(t)? t : "papel";
  document.documentElement.dataset.tema = S.tema;
  guardarLocal("pf-tema",S.tema);
  const meta=$("#meta-tema"); if(meta) meta.setAttribute("content", COLOR_BARRA[S.tema]);
}
const alternarTema = ()=>{
  aplicarTema(TEMAS[(TEMAS.indexOf(S.tema)+1)%TEMAS.length]);
  render(); avisar(`Tema ${NOMBRE_TEMA[S.tema]}`);
};

/* ================= alertas cuando un sobre llega al 90% =========== */
const alertadas = new Set((leerLocal("pf-alertas-vistas")||"").split(",").filter(Boolean));
function recordarAlerta(clave){
  alertadas.add(clave);
  const arr=[...alertadas].slice(-200);
  guardarLocal("pf-alertas-vistas",arr.join(","));
}
async function notificar(titulo,cuerpo,vista="panel"){
  if(!("Notification" in window) || Notification.permission!=="granted") return false;
  const opciones={ body:cuerpo, icon:"./iconos/icono-192.png", badge:"./iconos/icono-192.png",
    tag:"pf-sobre", lang:"es", data:{vista} };
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(titulo,opciones); return true;
    }
    new Notification(titulo,opciones); return true;
  }catch{ return false; }
}
function revisarAlertas(R){
  if(S.config.alertas===false) return;
  if(!R.esMesActual) return;
  const base = `${S.hogarId||"local"}:${R.mes}`;
  R.porCat.filter(c=>c.pres>0).forEach(c=>{
    const nivel = c.uso>=1 ? 100 : c.uso>=0.9 ? 90 : 0;
    if(!nivel) return;
    const clave = `${base}:${c.cod}:${nivel}`;
    if(alertadas.has(clave)) return;
    recordarAlerta(clave);
    if(nivel===100)
      notificar(`${c.nombre}: sobre agotado`,
        `Excedido en ${fmt(c.total-c.pres)}. Llevas ${fmt(c.total)} de ${fmt(c.pres)}.`,"panel");
    else
      notificar(`${c.nombre} al ${Math.round(c.uso*100)}%`,
        `Quedan ${fmt(c.pres-c.total)} del sobre y faltan ${R.restantes} días de mes.`,"panel");
  });
  // aviso global de ritmo, una vez por mes
  if(R.presupuestoTotal>0 && R.proyectado>R.presupuestoTotal*1.15){
    const clave=`${base}:RITMO`;
    if(!alertadas.has(clave)){
      recordarAlerta(clave);
      notificar("Vas por encima del presupuesto",
        `Al ritmo actual cerrarías el mes en ${fmt(R.proyectado)}, ${fmt(R.proyectado-R.presupuestoTotal)} de más.`,"ahorro");
    }
  }
}
async function pedirPermisoAlertas(){
  if(!("Notification" in window)) { avisar("Este navegador no admite alertas"); return; }
  const p = await Notification.requestPermission();
  if(p==="granted"){
    DB.guardarHogar({config:{...S.config,alertas:true}});
    notificar("Alertas activadas","Te avisaré cuando un sobre llegue al 90% de su presupuesto.");
    avisar("Alertas activadas");
  }else{
    avisar(p==="denied"?"Alertas bloqueadas en el navegador":"Permiso no concedido");
  }
  render();
}
const estadoAlertas = ()=>{
  if(!("Notification" in window)) return "no disponibles en este navegador";
  if(Notification.permission==="denied") return "bloqueadas · actívalas en los ajustes del navegador";
  if(Notification.permission!=="granted") return "sin activar";
  return S.config.alertas===false? "activas en el navegador, apagadas en la app" : "activas";
};

/* ==================== service worker / instalación ================ */
let promptInstalar = null;
function registrarSW(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:" && location.hostname!=="localhost") return;
  navigator.serviceWorker.register("./sw.js").catch(e=>console.warn("SW:",e));
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data?.tipo==="abrir-vista"){ S.vista=e.data.vista; render(); }
  });
}
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); promptInstalar=e; render(); });
window.addEventListener("appinstalled",()=>{ promptInstalar=null; avisar("App instalada"); render(); });
async function instalarApp(){
  if(!promptInstalar){
    avisar("Usa el menú del navegador → Añadir a pantalla de inicio");
    return;
  }
  promptInstalar.prompt();
  await promptInstalar.userChoice;
  promptInstalar=null; render();
}

/* ============================== arranque ========================== */
iniciarHistorial();
aplicarTema(leerLocal("pf-tema")||"papel");
aplicarTipo(leerLocal("pf-tipo")||"inter");
cargarFondoLocal();
registrarSW();
$("#btn-tema").onclick=alternarTema;
$("#mes-ant").onclick=()=>{S.mes=sumaMes(S.mes,-1);render()};
$("#mes-sig").onclick=()=>{S.mes=sumaMes(S.mes,1);render()};
$("#fab").onclick=()=>modalMovimiento();
/* El botón flotante se aparta mientras se desplaza la pantalla, para no tapar
   cifras, y vuelve al detenerse. */
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  let tFab;
  addEventListener("scroll",()=>{
    const f=$("#fab"); if(!f) return;
    f.classList.add("recogido");
    clearTimeout(tFab);
    tFab=setTimeout(()=>f.classList.remove("recogido"),520);
  },{passive:true});
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarModal()});

/* Accesos directos del icono: ?vista=estadisticas o ?accion=nuevo */
const params = new URLSearchParams(location.search);
if(params.get("vista")) S.vista = params.get("vista");
if(params.get("accion")==="nuevo") setTimeout(()=>{ if(!$("#app").classList.contains("oculto")) modalMovimiento(); },600);

if(HAY_FIREBASE){
  iniciarFirebase().catch(e=>{
    console.error(e);
    S.modo="local"; mostrarApp(); avisar("Firebase no disponible: modo local");
  });
}else{
  mostrarApp();
}
</script>
