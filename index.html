/* Lo que se despliega al tocar un sobre: cómo se reparte por dentro.
   Se muestra solo bajo demanda para que el panel siga siendo un resumen. */
function desgloseSobre(c){
  const declarados = subsDe(c.cod);
  const max = Math.max(1, ...c.subs.map(s=>s.monto));
  return `<div class="desglose-sobre">
    <div class="sub-cab"><span>Sub-sobres</span>
      <button class="enlace" data-subs="${c.cod}">${declarados.length? "Gestionar" : "+ Añadir sub-sobre"}</button></div>
    ${c.subs.length? `<ul class="subs">${c.subs.map(s=>`
      <li>
        <div class="sub-fila"><span class="sub-nom ${s.nombre===SIN_SUB?"tenue":""}">${esc(s.nombre)} <em class="marca-fija">${s.tipo}</em></span>
          <span class="sub-monto">${fmt(s.monto)}<em>${c.total>0?Math.round(s.monto/c.total*100):0}%</em></span></div>
        <div class="barra fina"><div class="fill" style="width:${s.monto/max*100}%;background:${col(c.color)};opacity:${s.nombre===SIN_SUB?.35:.85}"></div></div>
      </li>`).join("")}</ul>`
    : `<p class="nota">Sin gastos todavía en este sobre.</p>`}
    ${declarados.length===0 && c.n>0
      ? `<p class="nota ayuda">Divide este sobre en partes —supermercado, feria, farmacia— para ver dónde se va de verdad.</p>`:""}
    ${c.personas.length>1?`<div class="reparto-personas">
      ${c.personas.map(p=>`<span><i style="background:${col(colorPersona(p.nombre))}"></i>${esc(p.nombre)}
        <b>${fmt(p.monto)}</b></span>`).join("")}
    </div>`:""}
    <div class="fila-btns">
      <button class="btn mini" data-detalle-cat="${c.cod}">Ver los ${cuenta(c.n,"movimiento","movimientos")}</button>
    </div>
  </div>`;
}

/* El cierre se ofrece cuando el periodo termina, o en sus últimos días.
   Si ya se cerró, la tarjeta pasa a resumir cómo cuadró. */
function avisoCierre(R){
  const c = cierreDe(R.mes);
  const toca = !R.esMesActual || R.restantes<=2;
  if(!toca && !c) return "";
  if(c){
    const difs = Object.entries(c.diferencias||{});
    const total = difs.reduce((a,[,v])=>a+Math.min(0,v),0);
    return `<section class="tarjeta" data-acento="lila">
      <div class="cab"><h2>Periodo cerrado</h2><span class="cod">${esc(c.fecha)}</span></div>
      ${c.soloRegistro
        ? `<p class="nota">Se registraron los saldos de partida. Desde el próximo cierre ya se calculan las diferencias.</p>`
        : total<0
          ? `<p class="nota">Al cuadrar aparecieron <b>${fmt(-total)}</b> de gasto que no estaba registrado.</p>`
          : `<p class="nota">Cuadró sin diferencias apreciables.</p>`}
      <ul class="cierre-resumen">${Object.entries(c.saldos||{}).map(([n,v])=>`
        <li><span class="punto-p" style="background:${col(colorPersona(n))}"></span>${esc(n)}
          <b>${fmt(v)}</b>
          <em class="${(c.diferencias?.[n]||0)<0?"rojo":"verde"}">${
            Math.abs(c.diferencias?.[n]||0)<1? "cuadra"
            : `${c.diferencias[n]<0?"−":"+"}${fmt(Math.abs(c.diferencias[n]))}`}</em></li>`).join("")}</ul>
      <p class="nota">Los movimientos de este periodo están bloqueados para conservar la cuadratura.</p>
      ${esAdmin()?`<div class="fila-btns"><button class="btn mini peligro" data-reabrir-mes="${R.mes}">Reabrir periodo</button></div>`:""}
    </section>`;
  }
  return `<section class="tarjeta" data-acento="ambar">
    <div class="cab"><h2>${R.esMesActual? "El periodo está por terminar" : "Este periodo no se ha cerrado"}</h2></div>
    <p class="nota">Anota el saldo real de cada uno y la app calcula qué se gastó sin registrar. Es la única forma de ver las compras hormiga que nunca se anotan.</p>
    <div class="fila-btns"><button class="btn primario" data-cerrar-mes="${R.mes}">Cerrar el periodo</button></div>
  </section>`;
}

/* Al empezar un periodo, recordar lo que sobró del anterior y ofrecer
   apartarlo antes de que se confunda con el dinero del mes en curso. */
function avisoRemanente(R){
  if(!R.esMesActual || R.remanente<=0) return "";
  if(leerLocal(`pf-remanente:${R.mes}`)==="visto") return "";
  const anterior = saldoDePeriodo(R.mesAnt);
  return `<section class="tarjeta" data-acento="ambar">
    <div class="cab"><h2>Sobró dinero del periodo anterior</h2>
      <button class="enlace" data-accion="ocultar-remanente">Ocultar</button></div>
    <p class="nota">Arrastras <b>${fmt(R.remanente)}</b> de periodos ya cerrados${
      anterior>0?`, de los cuales ${fmt(anterior)} son del último`:""}. Ese dinero ya está sumado a tu disponible de ${etiquetaPeriodo(R.mes)}.</p>
    <p class="nota">Si no lo apartas, se mezcla con el gasto corriente y acaba gastándose sin haberlo decidido.</p>
    <div class="fila-btns">
      <button class="btn primario" data-accion="guardar-remanente">Apartarlo en una cuenta</button>
    </div>
  </section>`;
}

/* ============ cerrar el periodo ==================================== */
/* ============ pagos de deuda: rebajar la entidad correcta ==========
   Un gasto de la categoría DEU, o un pago de tarjeta, baja el saldo de la
   deuda a la que apunta. DB.mutarMovimiento confirma ambos cambios en una
   sola transacción para que nunca queden separados. */
const opcionesDeuda = (actual="")=>
  `<option value="">Sin asignar</option>` +
  S.deudas.map(d=>`<option value="${d.id}" ${actual===d.id?"selected":""}>${esc(d.nombre)} · saldo ${fmt(d.saldo)}</option>`).join("");

/* ============ conciliar caja en cualquier momento =================
   El cierre cuadra un periodo entero; esto cuadra un día suelto. Misma
   mecánica: se declara el saldo real y la diferencia se anota como gasto
   hormiga. No cierra nada ni ancla el arrastre, es solo un punto de control. */
function modalConciliar(fechaInicial){
  const personas = personasHogar();
  if(!personas.length){ avisar("Añade primero a los integrantes del hogar"); return; }
  const corte = fechaInicial || hoyISO();

  const pintar = (fecha)=>{
    const datos = personas.map(n=>({nombre:n, ...saldoAFecha(n,fecha)}));
    return datos.map((d,i)=>`
      <li>
        <div class="cierre-cab">
          <span class="punto-p" style="background:${col(colorPersona(d.nombre))}"></span>
          <span class="cierre-nom">${esc(d.nombre)}</span>
        </div>
        <div class="cierre-linea"><span>Viene del periodo anterior</span><b>${fmt(d.base)}</b></div>
        <div class="cierre-linea"><span>Movimientos del periodo hasta la fecha</span>
          <b class="${d.flujo<0?"rojo":"verde"}">${d.flujo>=0?"+":""}${fmt(d.flujo)}</b></div>
        <div class="cierre-linea total"><span>Debería tener</span><b data-teo="${i}">${fmt(d.teorico)}</b></div>
        ${d.porLlegar>0?`<p class="nota ayuda" style="margin:2px 0 0">El panel le suma ${fmt(d.porLlegar)} de ingreso estimado que todavía no ha entrado; aquí se cuenta solo lo recibido.</p>`:""}
        <label class="campo" style="margin:10px 0 6px"><span>Saldo real de ${esc(d.nombre)}</span>
          <input class="importe" type="text" inputmode="numeric" data-real="${i}" placeholder="0"></label>
        <p class="cierre-dif" data-dif="${i}">Escribe el saldo real para ver la diferencia.</p>
      </li>`).join("");
  };

  modal("Conciliar caja",`
    <p class="nota">Anota lo que hay <b>de verdad</b> en las cuentas de uso diario. Se compara con el <b>disponible por persona</b> que muestra el panel, y la diferencia se registra como <b>gasto no registrado</b>. No cierra el periodo: puedes hacerlo cuando quieras.</p>
    <label class="campo"><span>Fecha del corte</span>
      <input id="co-fecha" type="date" value="${corte}" max="${hoyISO()}"></label>
    <ul class="cierre" id="co-lista">${pintar(corte)}</ul>
  `, async()=>{
    const fecha = $("#co-fecha").value || hoyISO();
    const datos = personas.map(n=>({nombre:n, ...saldoAFecha(n,fecha)}));
    const saldos={}, teoricos={}, diferencias={};
    const declarados = datos.filter((d,i)=>document.querySelector(`[data-real="${i}"]`)?.value.trim()!=="");
    if(!declarados.length) return "Escribe al menos un saldo real.";

    datos.forEach((d,i)=>{
      const campo = document.querySelector(`[data-real="${i}"]`);
      if(!campo || campo.value.trim()==="") return;
      const teo = d.teorico;
      const real = num(campo.value);
      saldos[d.nombre]=real; teoricos[d.nombre]=teo; diferencias[d.nombre]=real-teo;
    });

    for(const d of declarados){
      const dif = diferencias[d.nombre];
      if(Math.abs(dif)<1) continue;
      await DB.agregar("movimientos", dif<0
        ? { tipo:"gasto", monto:-dif, categoria:"NRG", sub:"", fecha, metodo:"Efectivo",
            tarjetaId:"", cuentaId:"", deudaId:"", soloCuenta:false, miembro:d.nombre,
            nota:`Gastos no registrados · ${fechaCorta(fecha)}`, esencial:false,
            ajusteCierre:true, uid:S.uid||"", autor:miNombre(), creado:Date.now() }
        : { tipo:"ingreso", monto:dif, categoria:"OTR", sub:"", fecha, metodo:"Efectivo",
            tarjetaId:"", cuentaId:"", deudaId:"", soloCuenta:false, miembro:d.nombre,
            nota:`Ingreso no registrado · ${fechaCorta(fecha)}`, esencial:true,
            ajusteCierre:true, uid:S.uid||"", autor:miNombre(), creado:Date.now() });
    }
    await DB.agregar("conciliaciones",{fecha, saldos, teoricos, diferencias,
      creado:Date.now(), uid:S.uid||"", autor:miNombre()});
    render();
    avisar("Caja conciliada");
  }, "Registrar la conciliación");

  /* Al cambiar la fecha se recalcula todo, y la diferencia se ve en vivo */
  const refrescar = ()=>{
    const fecha = $("#co-fecha").value || hoyISO();
    personas.forEach((n,i)=>{
      const d = saldoAFecha(n,fecha);
      const teo = d.teorico;
      const celda = document.querySelector(`[data-teo="${i}"]`);
      if(celda) celda.textContent = fmt(teo);
      const campo = document.querySelector(`[data-real="${i}"]`);
      const nota = document.querySelector(`[data-dif="${i}"]`);
      if(!campo || !nota) return;
      if(!campo.value.trim()){ nota.className="cierre-dif"; nota.textContent="Escribe el saldo real para ver la diferencia."; return; }
      const dif = num(campo.value) - teo;
      if(Math.abs(dif)<1){ nota.className="cierre-dif ok"; nota.textContent="Cuadra exactamente."; }
      else if(dif<0){ nota.className="cierre-dif menos";
        nota.textContent=`Faltan ${fmt(-dif)}: irán a gasto hormiga.`; }
      else { nota.className="cierre-dif mas";
        nota.textContent=`Sobran ${fmt(dif)}: se registrarán como ingreso no registrado.`; }
    });
  };
  const relistar = ()=>{
    $("#co-lista").innerHTML = pintar($("#co-fecha").value || hoyISO());
    $("#modal-host").querySelectorAll("[data-real],[data-inicio]").forEach(c=>c.addEventListener("input",refrescar));
    refrescar();
  };
  $("#co-fecha").onchange = relistar;
  relistar();
}

function modalCierre(mes){
  const personas = personasHogar();
  if(!personas.length){ avisar("Añade primero a los integrantes del hogar"); return; }
  /* La declaración se fecha en el día que cierra el periodo, no en el de hoy:
     si se cierra agosto en septiembre, el saldo declarado es el de agosto y
     los movimientos posteriores deben contarse en el periodo siguiente. */
  const corte = mes===periodoDe(hoyISO())? hoyISO() : finPeriodo(mes);
  const previo = cierreDe(mes);
  if(previo){ avisar(esAdmin()?"Reabre primero el periodo para modificar su cierre":"Este periodo está cerrado"); return; }
  const datos = personas.map(n=>({nombre:n, ...saldoTeorico(n,mes)}));
  const primero = !datos.some(d=>d.hayPrevio);

  modal(`Cerrar ${etiquetaPeriodo(mes)}`,`
    <p class="nota">Anota el saldo <b>real</b> que tenía cada persona al ${corte===hoyISO()? "día de hoy" : "cierre del "+corte} en sus cuentas de uso diario. La diferencia con lo que la app calcula se registra como <b>gasto no registrado</b>, que es donde acaban las compras hormiga que nunca se anotan.</p>

    <ul class="cierre">${datos.map((d,i)=>`
      <li>
        <div class="cierre-cab">
          <span class="punto-p" style="background:${col(colorPersona(d.nombre))}"></span>
          <span class="cierre-nom">${esc(d.nombre)}</span>
        </div>
        ${d.hayPrevio
          ? `<div class="cierre-linea"><span>Saldo declarado al cierre anterior</span><b>${fmt(d.base)}</b></div>`
          : `<label class="cierre-linea"><span>Saldo con el que empezó el periodo</span>
               <input class="importe mini" type="text" inputmode="numeric" data-inicio="${i}" placeholder="0"></label>`}
        <div class="cierre-linea"><span>Movimientos registrados del periodo</span>
          <b class="${d.flujo<0?"rojo":"verde"}">${d.flujo>=0?"+":""}${fmt(d.flujo)}</b></div>
        <div class="cierre-linea total"><span>Saldo teórico</span><b data-teo="${i}">${fmt(d.teorico)}</b></div>
        <label class="campo" style="margin:10px 0 6px"><span>Saldo real de ${esc(d.nombre)}</span>
          <input class="importe" type="text" inputmode="numeric" data-real="${i}"
                 data-teorico="${d.teorico}" value="${vf(previo?.saldos?.[d.nombre])}" placeholder="0"></label>
        <p class="cierre-dif" data-dif="${i}">Escribe el saldo real para ver la diferencia.</p>
      </li>`).join("")}</ul>

    <label class="check"><input type="checkbox" id="ci-primero">
      <span>Solo registrar saldos, sin generar ajustes</span></label>
    <p class="nota ayuda">${primero
      ? "Es el primer cierre: si no indicas con cuánto empezó cada persona, el saldo teórico da por hecho que partieron de cero y la diferencia saldrá inflada. Con el saldo de partida puesto, la diferencia ya es real."
      : "La diferencia entre el saldo real y el teórico se registra como gasto o ingreso no registrado, y así el gasto del periodo refleja lo que de verdad salió."}</p>
  `, async()=>{
    const soloRegistrar = $("#ci-primero").checked;
    /* Un campo en blanco significa "no lo sé", no "cero": esa persona
       queda fuera del cierre en vez de generar un ajuste inventado. */
    const saldos={}, teoricos={}, diferencias={}, iniciales={};
    const declarados = datos.filter((d,i)=>document.querySelector(`[data-real="${i}"]`).value.trim()!=="");
    if(!declarados.length) return "Escribe al menos un saldo real.";
    datos.forEach((d,i)=>{
      const campo = document.querySelector(`[data-real="${i}"]`);
      if(campo.value.trim()==="") return;
      const real = num(campo.value);
      const teo = teoricoDe(d,i);
      saldos[d.nombre]=real; teoricos[d.nombre]=teo; diferencias[d.nombre]=real-teo;
      if(!d.hayPrevio){
        const ini = document.querySelector(`[data-inicio="${i}"]`);
        if(ini && ini.value.trim()!=="") iniciales[d.nombre] = num(ini.value);
      }
    });

    // Un recierre reemplaza los ajustes que generó el anterior
    for(const m of S.movimientos.filter(m=>m.ajusteCierre && enPeriodo(m.fecha,mes)))
      await DB.borrar("movimientos", m.id);

    if(!soloRegistrar){
      const fecha = corte;
      for(const d of declarados){
        const dif = diferencias[d.nombre];
        if(Math.abs(dif) < 1) continue;
        await DB.agregar("movimientos", dif<0
          ? { tipo:"gasto", monto:-dif, categoria:"NRG", sub:"", fecha, metodo:"Efectivo",
              tarjetaId:"", cuentaId:"", soloCuenta:false, miembro:d.nombre,
              nota:`Gastos no registrados · ${mesCorto(mes)}`, esencial:false,
              ajusteCierre:true, uid:S.uid||"", autor:miNombre(), creado:Date.now() }
          : { tipo:"ingreso", monto:dif, categoria:"OTR", sub:"", fecha, metodo:"Efectivo",
              tarjetaId:"", cuentaId:"", soloCuenta:false, miembro:d.nombre,
              nota:`Ingreso no registrado · ${mesCorto(mes)}`, esencial:true,
              ajusteCierre:true, uid:S.uid||"", autor:miNombre(), creado:Date.now() });
      }
    }

    const registro = {mes, fecha:corte, saldos, teoricos, diferencias, iniciales,
                      creado:Date.now(), soloRegistro:soloRegistrar, uid:S.uid||"", autor:miNombre()};
    if(previo) await DB.actualizar("cierres", previo.id, registro);
    else await DB.agregar("cierres", registro);
    render();
    avisar(soloRegistrar? "Saldos registrados" : "Periodo cerrado y cuadrado");
  }, "Cerrar el periodo");

  /* El saldo teórico depende del punto de partida: el declarado en el cierre
     anterior o, si es el primero, el que la persona indique aquí. */
  const teoricoDe = (d,i)=>{
    if(d.hayPrevio) return d.teorico;
    const campo = document.querySelector(`[data-inicio="${i}"]`);
    return num(campo?.value||0) + d.flujo;
  };

  /* Diferencia en vivo mientras se escribe */
  const refrescar = ()=>datos.forEach((d,i)=>{
    const campo = document.querySelector(`[data-real="${i}"]`);
    const teo = teoricoDe(d,i);
    const celda = document.querySelector(`[data-teo="${i}"]`);
    if(celda) celda.textContent = fmt(teo);
    const nota = document.querySelector(`[data-dif="${i}"]`);
    if(!campo.value.trim()){ nota.className="cierre-dif"; nota.textContent="Escribe el saldo real para ver la diferencia."; return; }
    const dif = num(campo.value) - teo;
    if(Math.abs(dif)<1){ nota.className="cierre-dif ok"; nota.textContent="Cuadra exactamente."; }
    else if(dif<0){ nota.className="cierre-dif menos";
      nota.textContent=`Faltan ${fmt(-dif)}: se sumarán al gasto del periodo como no registrados.`; }
    else { nota.className="cierre-dif mas";
      nota.textContent=`Sobran ${fmt(dif)}: se registrarán como ingreso no registrado.`; }
  });
  document.querySelectorAll("[data-real],[data-inicio]").forEach(c=>c.addEventListener("input",refrescar));
  refrescar();
}

/* Varias series en un mismo gráfico: la evolución de las categorías que
   más pesan, para ver cuál se está desbocando y cuál va bajando. */
function grLineas(series,etiquetas,{alto=170,ancho=320}={}){
  const max = Math.max(1,...series.flatMap(s=>s.valores));
  const n = etiquetas.length;
  const px = i=> 30 + i*(ancho-38)/Math.max(1,n-1);
  const py = v=> alto-20-(v/max)*(alto-34);
  const ejes = [0,.5,1].map(f=>`<line x1="30" x2="${ancho}" y1="${py(max*f)}" y2="${py(max*f)}"
      stroke="currentColor" stroke-dasharray="2 4" opacity=".35"/>
    <text x="0" y="${py(max*f)+3}" font-size="8">${corto(max*f)}</text>`).join("");
  const marcar = n<=12;      // con muchos días los puntos ensucian
  const lineas = series.map(s=>{
    const pts = s.valores.map((v,i)=>`${px(i)},${py(v)}`);
    const puntos = marcar
      ? s.valores.map((v,i)=>`<circle cx="${px(i)}" cy="${py(v)}" r="2.1" fill="${col(s.color)}"/>`).join("")
      : `<circle cx="${px(n-1)}" cy="${py(s.valores[n-1])}" r="2.6" fill="${col(s.color)}"/>`;
    return `<polyline fill="none" points="${pts.join(" ")}" stroke="${col(s.color)}" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"/>${puntos}`;
  }).join("");
  const et = etiquetas.map((e,i)=> e===""? ""
    : `<text x="${px(i)}" y="${alto-5}" font-size="8" text-anchor="middle">${esc(e)}</text>`).join("");
  return `<svg class="gr" viewBox="0 0 ${ancho} ${alto}">${ejes}${lineas}${et}</svg>
    <div class="gr-leyenda">${series.map(s=>`<span><i style="background:${col(s.color)}"></i>${esc(s.nombre)}</span>`).join("")}</div>`;
}

/* Acumulado día a día de las categorías con más peso, dentro del periodo
   en curso: muestra cuál se dispara y cuándo, no cómo fueron otros meses. */
function seriesTopCategorias(R,cuantas=6){
  const top = R.porCat.filter(c=>c.total>0).slice(0,cuantas);
  const todas = fechasPeriodo(R.mes);
  const dias = R.esMesActual? todas.slice(0,R.diaHoy) : todas;
  const paso = Math.max(1, Math.ceil(dias.length/6));
  return {
    // Solo se rotulan algunos días: con treinta puntos las etiquetas se pisan
    etiquetas: dias.map((f,i)=> (i%paso===0 || i===dias.length-1) ? f.slice(8).replace(/^0/,"") : ""),
    series: top.map(c=>{
      let acc = 0;
      return {nombre:c.cod, color:c.color, valores: dias.map(f=>{
        acc += R.gastos.filter(g=>g.categoria===c.cod && g.fecha===f).reduce((a,b)=>a+b.monto,0);
        return acc;
      })};
    }),
  };
}

function kpi(etiqueta,valor,pie,{tono="",pct=null}={}){
  return `<div class="kpi ${tono}">
    <em>${etiqueta}</em>
    <b>${valor}</b>
    ${pct!==null?`<div class="kpi-barra"><i style="width:${clamp(pct,0,100)}%"></i></div>`:""}
    <span>${pie}</span>
  </div>`;
}
const variacionTexto=v=>v===null?"—":`${v>0?"+":""}${Math.round(v*100)}%`;
const tonoVariacion=v=>v===null?"":v>0.05?"rojo":v<-.05?"verde":"";

function vResumen(R){
  const ing = R.ingresoBase||0;
  const usoPres = R.presupuestoTotal>0? R.totalGasto/R.presupuestoTotal*100 : 0;
  const avance = R.dias>0? R.diaHoy/R.dias*100 : 0;
  const cargaDeuda = ing>0? R.pagosTarjeta/ing*100 : 0;
  /* Lo que el presupuesto permite gastar cada día, y cómo va el ritmo real
     frente a ese listón: es la lectura que dice si hay que frenar hoy. */
  const permitidoDia = R.dias>0? R.presupuestoTotal/R.dias : 0;
  const ritmoPct = permitidoDia>0? R.ritmoDiario/permitidoDia*100 : 0;
  const pctPresc = R.totalGasto>0? R.prescindibles/R.totalGasto*100 : 0;
  const {series,etiquetas} = seriesTopCategorias(R);
  const personas = R.porPersona.filter(p=>p.gasto>0)
    .map(p=>({mes:p.nombre.split(" ")[0], total:p.gasto, color:p.color}));

  return `
  <section class="tarjeta" data-acento="azul">
    <div class="cab"><h2>Resumen</h2><button class="enlace" data-accion="reporte-pdf">Generar PDF</button></div>
    <p class="nota">${etiquetaPeriodo(R.mes)}</p>
    <div class="kpis">
      ${kpi("Disponible", fmt(R.disponible),
            ing>0? `${Math.round(R.disponible/ing*100)}% de los ingresos` : "sin ingresos registrados",
            {tono:R.disponible<0?"malo":"bueno"})}
      ${kpi("Gastado", fmt(R.totalGasto),
            R.presupuestoTotal>0? `${Math.round(usoPres)}% del presupuesto` : "sin presupuesto asignado",
            {tono: usoPres>100?"malo": usoPres>85?"medio":"", pct:usoPres})}
      ${kpi("Cierre estimado", fmt(R.proyectado),
            R.esMesActual? `${R.metodoProyeccion} · incluye fijos pendientes` : "periodo terminado",
            {tono:R.presupuestoTotal>0&&R.proyectado>R.presupuestoTotal?"malo":"bueno"})}
      ${kpi("Ritmo diario actual", `${fmt(R.ritmoDiario)}`,
            permitidoDia>0
              ? `el presupuesto da para ${fmt(permitidoDia)}/día`
              : `promedio de ${cuenta(R.diaHoy,"día","días")}`,
            {tono: ritmoPct>100?"malo": ritmoPct>85?"medio":"", pct:ritmoPct})}
      ${kpi("Puedes gastar al día", 
            R.presupuestoTotal<=0? "—" : R.margenRestante<=0? "sin margen"
              : R.restantes>0? fmt(R.disponibleDiario) : fmt(R.margenRestante),
            R.presupuestoTotal<=0? "asigna presupuesto a los sobres"
              : R.margenRestante<=0? `excedido en ${fmt(-R.margenRestante)}`
              : R.fijosPendientes>0
                ? `quedan ${fmt(R.margenRestante)} y ${fmt(R.fijosPendientes)} son de fijos por llegar`
              : R.restantes>0
                ? (R.ritmoDiario>0
                    ? `${R.disponibleDiario<R.ritmoDiario?"un "+Math.round((1-R.disponibleDiario/R.ritmoDiario)*100)+"% menos que tu ritmo":"por encima de tu ritmo"} · ${cuenta(R.restantes,"día","días")}`
                    : `durante ${cuenta(R.restantes,"día","días")}`)
                : "último día del periodo",
            {tono: R.presupuestoTotal<=0? ""            // sin listón no hay nada que juzgar
                 : R.margenRestante<=0? "malo"
                 : (R.margenTrasFijos<=0 || (R.restantes>0 && R.disponibleDiario<R.ritmoDiario))? "medio" : "bueno"})}
      ${kpi("Ahorro del periodo", fmt(R.ahorroReal),
            ing>0? `tasa del ${Math.round(R.tasaAhorro*100)}%` : "—",
            {tono:R.ahorroReal<0?"malo":"bueno"})}
      ${kpi("Avance del periodo", `día ${R.diaHoy}`,
            `de ${R.dias} · quedan ${R.restantes}`, {pct:avance})}
      ${kpi("Gasto prescindible", fmt(R.prescindibles),
            `${Math.round(pctPresc)}% del gasto`,
            {tono: pctPresc>30?"medio":"", pct:pctPresc})}
      ${kpi("Deuda pendiente", fmt(R.deudaTotal),
            ing>0? `pagos: ${Math.round(cargaDeuda)}% del ingreso` : "—",
            {tono:R.deudaTotal>0?"medio":""})}
    </div>
  </section>

  <section class="tarjeta" data-acento="ambar">
    <div class="cab"><h2>Comparativo</h2><span class="cod">actual vs historial</span></div>
    <div class="metricas" style="margin-top:0;border-top:none;padding-top:0">
      <div><em>Gasto actual</em><b>${fmt(R.totalGasto)}</b></div>
      <div><em>Anterior al día ${R.diaHoy}</em><b>${fmt(R.gastoAnteriorCorte)}</b><small class="${tonoVariacion(R.variacionAnterior)}">${variacionTexto(R.variacionAnterior)}</small></div>
      <div><em>Promedio al día ${R.diaHoy}</em><b>${R.periodosPromedio?fmt(R.promedioHistorico):"—"}</b><small class="${tonoVariacion(R.variacionPromedio)}">${R.periodosPromedio?variacionTexto(R.variacionPromedio):"sin historial"}</small></div>
      <div><em>Cierre estimado</em><b>${fmt(R.proyectado)}</b><small>${R.metodoProyeccion}</small></div>
    </div>
    <p class="nota">Promedio calculado con ${cuenta(R.periodosPromedio,"ciclo anterior con datos","ciclos anteriores con datos")}.</p>
    <table class="resp"><thead><tr><th>Categoría</th><th class="num">Actual</th><th class="num">Anterior</th><th class="num">Variación</th></tr></thead>
      <tbody>${R.porCat.filter(c=>c.total>0||c.totalAnt>0).slice(0,10).map(c=>`<tr class="clicable" data-detalle-cat="${c.cod}" role="button" tabindex="0">
        <td class="principal"><span class="cod" style="color:${col(c.color)}">${c.cod}</span> ${esc(c.nombre)}</td>
        <td class="num" data-etq="Actual">${fmt(c.total)}</td><td class="num" data-etq="Anterior al mismo día">${fmt(c.totalAntCorte)}</td>
        <td class="num ${tonoVariacion(c.variacionCorte)}" data-etq="Variación">${variacionTexto(c.variacionCorte)}</td></tr>`).join("")}</tbody></table>
  </section>

  <section class="tarjeta" data-acento="lila">
    <div class="cab"><h2>Principales gastos</h2><span class="cod">acumulado del periodo</span></div>
    ${series.length
      ? grLineas(series,etiquetas)
      : `<p class="nota">Aún no hay gastos suficientes para dibujar la evolución.</p>`}
  </section>

  <section class="tarjeta" data-acento="verde">
    <div class="cab"><h2>Gasto por persona</h2><span class="cod">${mesCorto(R.mes)}</span></div>
    ${personas.length
      ? grBarras(personas,{color:"var(--azul)"}) + `<div class="kpis dos-col">
          ${R.porPersona.filter(p=>p.gasto>0).map(p=>kpi(p.nombre,
              fmt(p.gasto), `${Math.round(p.pct*100)}% del gasto · ${cuenta(p.n,"compra","compras")}`,
              {pct:p.pct*100})).join("")}</div>`
      : `<p class="nota">Sin gastos atribuidos a ninguna persona en este periodo.</p>`}
  </section>`;
}

function vPanel(R){

  return `

    <div class="renglon ${R.baseUsada==="registrado"?"":"tenue"}"><span>Ingresos registrados${R.baseUsada==="registrado"?' <i class="marca-base">base</i>':""}</span><i></i><b>+${fmt(R.ingresoRegistrado)}</b></div>
    ${R.ingresoEstimado>0 && R.ingresoEstimado!==R.ingresoRegistrado
      ? `<div class="renglon ${R.baseUsada==="estimado"?"":"tenue"}"><span>Ingreso estimado${R.baseUsada==="estimado"?' <i class="marca-base">base</i>':""}</span><i></i><b>${fmt(R.ingresoEstimado)}</b></div>`

    <div class="renglon ${R.comprasCredito>0?"tenue":""}"><span>Gastos del periodo</span><i></i><b>−${fmt(R.totalGasto)}</b></div>

    ${R.pagosTarjeta>0?`<div class="renglon"><span>Pagos de tarjeta</span><i></i><b>−${fmt(R.pagosTarjeta)}</b></div>`:""}
    ${R.totalAporte>0?`<div class="renglon"><span>Ahorro transferido</span><i></i><b>−${fmt(R.totalAporte)}</b></div>`:""}
    ${R.totalRetiro>0?`<div class="renglon"><span>Retiros de ahorro</span><i></i><b>+${fmt(R.totalRetiro)}</b></div>`:""}
    <div class="renglon tenue"><span>Presupuesto asignado</span><i></i><b>${fmt(R.presupuestoTotal)}</b></div>
    ${R.saldoAhorros>0?`<div class="renglon tenue"><span>Ahorros acumulados</span><i></i><b>${fmt(R.saldoAhorros)}</b></div>`:""}
    ${R.deudaTotal>0?`<div class="renglon tenue"><span>Deuda pendiente</span><i></i><b>${fmt(R.deudaTotal)}</b></div>`:""}
    <div class="cinta-total"><span>${R.cierrePropio? "Saldo cuadrado":"Disponible"}</span>
      <strong class="${(R.cierrePropio? R.declaradoCierre : R.disponible)<0?"rojo":""}">${fmt(R.cierrePropio? R.declaradoCierre : R.disponible)}</strong></div>
    ${R.comprasCredito>0 && !R.cierrePropio?`<p class="nota nota-cuadrado">Las compras a crédito cuentan en sus sobres, pero no bajan el disponible: el dinero sale cuando pagas la tarjeta.</p>`:""}
    ${R.cierrePropio?`<p class="nota nota-cuadrado">Saldos reales declarados el ${esc(R.cierrePropio.fecha)}${
      R.cierrePropio.soloRegistro? ", como punto de partida" : `, con ${fmt(Math.abs(Object.values(R.cierrePropio.diferencias||{}).reduce((a,b)=>a+b,0)))} de diferencia registrada`}. El periodo siguiente parte de esta cifra.</p>`:""}
    ${R.porPersona.length? `<div class="composicion">
      ${R.porPersona.map(p=>`<span class="clicable" data-detalle-persona="${esc(p.nombre)}" role="button" tabindex="0">
        <i style="background:${col(p.color)}"></i>${esc(p.nombre)}
        <b class="${p.disponible<0?"rojo":""}">${fmt(p.disponible)}</b></span>`).join("")}
      ${Math.abs(R.restoDisponible)>=1?`<span title="Movimientos sin persona asignada"><i style="background:#B9C0B6"></i>sin asignar<b>${fmt(R.restoDisponible)}</b></span>`:""}
    </div>`:""}
    ${R.esMesActual?`<div class="cinta-pie">
      <div><em>Ritmo variable</em><b>${fmt(R.ritmoVariable)}/día</b></div>
      <div><em>Cierre estimado</em><b class="${alta?"rojo":"verde"}">${fmt(R.proyectado)}</b></div>
      <div><em>Puedes gastar</em><b class="${R.margenRestante<=0?"rojo":""}">${
        R.presupuestoTotal<=0? "—"
        : R.margenRestante<=0? "sin margen"
        : R.restantes>0? fmt(R.disponibleDiario)+"/día" : fmt(R.margenRestante)}</b>
        ${R.fijosPendientes>0 && R.margenRestante>0
          ? `<i class="reserva">${fmt(R.fijosPendientes)} comprometidos en fijos</i>`:""}</div>
    </div>
    <div class="desglose">
      <span>Ya gastado <b>${fmt(R.totalGasto)}</b></span>
      <span>+ variable restante <b>${fmt(R.variableRestante)}</b></span>
      <span class="clicable ${R.fijosPendientes>0?"":"tenue"}" data-accion="ver-fijos" role="button" tabindex="0"
        title="Ver qué cargos se dan por pendientes">+ fijos por pagar <b>${fmt(R.fijosPendientes)}</b> ›</span>
      <span class="total">= ${fmt(R.proyectado)}</span>
    </div><p class="nota nota-cuadrado">Estimación basada en ${R.metodoProyeccion}; el gasto alto de los días 1–8 no se repite sobre todo el ciclo.</p>`:""}
  </section>

  ${R.esMesActual?`<section class="tarjeta" data-acento="azul">
    <div class="cab"><h2>Conciliar caja</h2>
      <span class="cod">${ultimaConciliacion()? "última: "+esc(ultimaConciliacion().fecha) : "sin conciliar"}</span></div>
    <p class="nota">Anota el saldo real de cada uno a una fecha y la app registra como gasto hormiga lo que no cuadre. No hace falta esperar al cierre del periodo.</p>
    <div class="fila-btns"><button class="btn" data-accion="conciliar">Conciliar ahora</button></div>
  </section>`:""}
  ${avisoCierre(R)}
  ${avisoRemanente(R)}

  <section class="tarjeta" data-acento="verde">
    <div class="cab"><h2>Sobres del mes</h2>
      <button class="enlace" data-accion="nueva-categoria">+ Otro sobre</button></div>
    ${sobres.length?"":`<p class="nota">Aún no hay presupuestos ni gastos. Asígnalos en Ajustes o crea un sobre propio.</p>`}
    <ul class="sobres">${visibles.map(c=>{
      const abierto = S.abiertos.has(c.cod);
      return `
      <li class="${abierto?"abierto":""}">
        <div class="sobre-cab clicable" data-abrir-sobre="${c.cod}" role="button" tabindex="0"
             aria-expanded="${abierto}" title="Ver el desglose de ${esc(c.nombre)}">
          <span class="cod" style="color:${col(c.color)}">${c.cod}</span>
          <span class="sobre-nom">${c.nombre}${c.propia?`<button class="lapiz-cat" data-editar-cat="${c.cod}" aria-label="Editar sobre" title="Editar sobre">✎</button>`:""}</span>
          <span class="sobre-cifra">${fmt(c.total)}</span>
          <span class="flecha">${abierto?"▴":"▾"}</span>
        </div>
        <div class="barra"><div class="fill ${est(c.uso)}" style="width:${Math.min(100,c.pres>0?c.total/c.pres*100:100)}%;${c.pres>0?"":`background:${col(c.color)}`}"></div></div>
        <div class="sobre-pie"><span>${c.pres>0?`de ${fmt(c.pres)}`:"sin presupuesto"}${c.fija?" · fijo":""}</span>
          <span>${c.pres>0?(c.total>c.pres?`excedido en ${fmt(c.total-c.pres)}`:`quedan ${fmt(c.pres-c.total)}`):`${cuenta(c.n,"compra","compras")}`}</span></div>
        ${abierto? desgloseSobre(c) : ""}
      </li>`;}).join("")}</ul>
    ${sobres.length>LIMITE_SOBRES?`<button class="enlace ver-mas" data-accion="mas-sobres">${
      S.verTodosSobres? "Ver solo los principales" : `Ver los ${sobres.length-LIMITE_SOBRES} sobres restantes`}</button>`:""}
  </section>

  ${R.totalGasto>0?`<section class="tarjeta" data-acento="ambar">
    <div class="cab"><h2>En qué se va el dinero</h2></div>
    <div class="split" aria-label="Distribución del gasto"><span class="e" style="width:${R.esenciales/R.totalGasto*100}%" data-detalle-naturaleza="esencial" role="button" tabindex="0" title="Ver gastos esenciales"></span><span class="p" style="width:${R.prescindibles/R.totalGasto*100}%" data-detalle-naturaleza="prescindible" role="button" tabindex="0" title="Ver gastos prescindibles"></span></div>
    <div class="leyenda">
      <div data-detalle-naturaleza="esencial" role="button" tabindex="0" title="Ver gastos esenciales"><i style="background:var(--verde)"></i>Esencial · ${fmt(R.esenciales)} <b>${Math.round(R.esenciales/R.totalGasto*100)}% ›</b></div>
      <div data-detalle-naturaleza="prescindible" role="button" tabindex="0" title="Ver gastos prescindibles"><i style="background:var(--ambar)"></i>Prescindible · ${fmt(R.prescindibles)} <b>${Math.round(R.prescindibles/R.totalGasto*100)}% ›</b></div>
    </div></section>`:""}

  ${rec.length?`<section class="tarjeta">
    <div class="cab"><h2>Recomendación principal</h2><button class="enlace" data-vista="ahorro">Ver todas (${rec.length})</button></div>
    ${consejoHTML(rec[0])}</section>`:""}`;
}

const consejoHTML = r=>`<div class="consejo ${r.nivel}">
  <div class="consejo-cab"><span class="etiqueta">${esc(r.etiqueta)}</span>
    ${r.ahorro>0?`<span class="chip-ahorro ${r.grupo==="exceso"?"alerta":""}">${r.cifra?esc(r.cifra):"ahorro"} ≈ ${fmt(r.ahorro)}/mes</span>`:""}</div>
  <h3>${esc(r.titulo)}</h3><p>${esc(r.detalle)}</p>${r.accion?`<p class="accion">${esc(r.accion)}</p>`:""}</div>`;

function vMovimientos(R){
  const lista = R.delMes
    .filter(m=>S.filtroCat==="TODAS"||m.categoria===S.filtroCat)
    .filter(m=>S.filtroPersona==="TODAS"||m.miembro===S.filtroPersona)
    .filter(m=>!S.filtroTexto||(m.nota||"").toLowerCase().includes(S.filtroTexto.toLowerCase()))
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const porFecha = {};
  lista.forEach(m=>{(porFecha[m.fecha]=porFecha[m.fecha]||[]).push(m)});
  const suma = lista.filter(m=>m.tipo==="gasto").reduce((a,b)=>a+b.monto,0);
  return `<section class="tarjeta" data-acento="azul">
    <div class="cab"><h2>Movimientos</h2><span class="cod">${cuenta(lista.length,"registro","registros")} · ${fmt(suma)}</span></div>
    <div class="fila-btns" style="margin-bottom:12px">
      <button class="btn primario" data-accion="importar-cartola">Importar cartola</button>
    </div>
    <div class="filtros">
      <input id="f-texto" placeholder="Buscar concepto" value="${esc(S.filtroTexto)}">
      <select id="f-cat"><option value="TODAS">Todas</option>
        ${CATEGORIAS.map(c=>`<option value="${c.cod}" ${S.filtroCat===c.cod?"selected":""}>${c.cod} · ${c.nombre}</option>`).join("")}</select>
    </div>
    ${personasHogar().length>1?`<div class="chips filtro-personas">
      <button class="chip ${S.filtroPersona==="TODAS"?"activo":""}" data-persona="TODAS">Todos</button>
      ${personasHogar().map(p=>`<button class="chip ${S.filtroPersona===p?"activo":""}" data-persona="${esc(p)}"
        style="${S.filtroPersona===p?`border-color:${col(colorPersona(p))};color:${col(colorPersona(p))}`:""}">${esc(p)}</button>`).join("")}
    </div>`:""}
    ${lista.length?"":`<p class="nota">No hay movimientos con estos filtros.</p>`}
    <div class="libro">${Object.entries(porFecha).map(([f,ms])=>`
      <div class="dia">
        <div class="dia-cab"><span>${DIAS[aDate(f).getDay()]} ${f.slice(8)}</span>
          <span>${fmt(ms.filter(m=>m.tipo==="gasto").reduce((a,b)=>a+b.monto,0))}</span></div>
        ${ms.map(m=>{
          const autor = nombreDe(m.uid)||m.autor||"";
          return `<div class="mov" data-editar-mov="${m.id}" role="button" tabindex="0" title="Editar movimiento">
          <span class="cod" style="color:${col(colorDe(m))}">${esc(codDe(m))}</span>
          <div class="mov-txt"><b>${esc(m.nota||PSEUDO[m.tipo]?.nombre||CAT[m.categoria]?.nombre||"Movimiento")}${m.sub?`<em class="etq-sub">${esc(nombreSub(m.categoria,m.sub))}</em>`:""}</b>
            <small><span class="quien" style="color:${col(colorPersona(m.miembro))}">${esc(m.miembro||"—")}</span> · ${esc(m.metodo)}${m.tarjetaId?` · ${esc(S.deudas.find(d=>d.id===m.tarjetaId)?.nombre||"tarjeta")}`:m.cuentaId?` · ${esc(nombreCuenta(m.cuentaId))}`:m.deudaId?` · ${esc(S.deudas.find(d=>d.id===m.deudaId)?.nombre||"deuda")}`:""}${autor&&autor!==m.miembro?` · reg. ${esc(autor)}`:""}${m.esencial?"":" · prescindible"}</small></div>
          <span class="mov-monto ${["ingreso","retiro"].includes(m.tipo)?"verde":""}">${["ingreso","retiro"].includes(m.tipo)?"+":"−"}${fmt(m.monto)}</span>
          <span class="lapiz" aria-hidden="true">✎</span>
        </div>`;}).join("")}
      </div>`).join("")}</div>
  </section>`;
}

  <section class="tarjeta" data-acento="lila"><div class="cab"><h2>Reparto por categoría</h2></div>
    ${grDona(dona)}

      <th class="num">Compras</th><th class="num">Ticket</th><th class="num">vs ant.</th></tr></thead>

      <td class="num" data-etq="Participación">${Math.round(c.total/R.totalGasto*100)}%</td>
      <td class="num" data-etq="Compras">${c.n}</td>
      <td class="num" data-etq="Ticket promedio">${fmt(c.ticket)}</td>

        ${c.variacion===null?"—":`${c.variacion>0?"+":""}${Math.round(c.variacion*100)}%`}</td></tr>`).join("")}</tbody></table>
  </section>

  <section class="tarjeta" data-acento="verde"><div class="cab"><h2>Últimos 6 meses</h2></div>
    ${grBarras(R.historico,{series:[{k:"ingreso",c:"var(--verde)",n:"Ingresos"},{k:"gasto",c:"var(--margen)",n:"Gastos"}]})}</section>

  <section class="tarjeta" data-acento="ambar"><div class="cab"><h2>Comportamiento de compra</h2><span class="cod">hábitos</span></div>
    ${grBarras(R.porDia,{color:"var(--azul, #2E6E8E)"})}
    <div class="metricas">
      <div><em>Ticket promedio</em><b>${fmt(R.ticketGeneral)}</b></div>
      <div><em>Compras del mes</em><b>${R.gastos.length}</b></div>
      <div><em>Compras por día</em><b>${(R.gastos.length/R.diaHoy).toFixed(1)}</b></div>

function simularAvalancha(deudas,extra){
  let ds = deudas.map(d=>({saldo:d.saldo||0,tasa:(d.tasaAnual||0)/100/12,pago:d.pagoMensual||0}))
    .sort((a,b)=>b.tasa-a.tasa);
  let meses=0,interes=0;
  while(ds.some(d=>d.saldo>0) && meses<600){
    let libre = extra;
    ds.forEach(d=>{ if(d.saldo<=0){libre+=d.pago; return;}
      const i=d.saldo*d.tasa; interes+=i; d.saldo+=i-d.pago; if(d.saldo<0){libre+=-d.saldo; d.saldo=0;} });
    for(const d of ds){ if(d.saldo>0 && libre>0){ const p=Math.min(libre,d.saldo); d.saldo-=p; libre-=p; } }
    meses++;
    if(meses>=600) return {meses:Infinity,interes:Infinity};
  }
  return {meses,interes};
}

function movimientoDesdeRecurrente(r,periodo){
  return {tipo:r.tipo,monto:r.monto,categoria:r.tipo==="gasto"?r.categoria:"OTR",sub:"",deudaId:"",
    fecha:fechasPeriodo(periodo)[Math.min(r.dia,fechasPeriodo(periodo).length)-1],metodo:r.metodo,
    tarjetaId:"",cuentaId:"",soloCuenta:false,miembro:r.miembro,nota:r.nota||r.nombre,
    esencial:r.tipo==="gasto"?r.esencial:true,uid:S.uid||"",autor:miNombre(),creado:Date.now(),
    recurrenteId:r.id,periodoRecurrente:periodo};
}

const recurrentesEnProceso=new Set();
async function procesarRecurrentes(forzar=false){
  if(!S.uid&&S.modo==="nube") return 0;
  const periodo=periodoDe(hoyISO()), transcurrido=diaDelPeriodo(periodo);
  let creados=0;
  for(const r of S.recurrentes.filter(x=>x.activo&&x.desde<=periodo&&(forzar||x.dia<=transcurrido))){
    const clave=`${r.id}:${periodo}`; if(recurrentesEnProceso.has(clave)) continue;
    recurrentesEnProceso.add(clave);
    try{ if(await DB.generarRecurrente(r,periodo)) creados++; }
    catch(err){ console.warn("recurrente:",err); }
    finally{ recurrentesEnProceso.delete(clave); }
  }
  return creados;
}

async function modalPapelera(){
  try{ await DB.limpiarPapeleraVencida(); }
  catch(err){ console.warn("papelera:",err); }
  const lista=[...S.papelera].sort((a,b)=>(b.eliminado||0)-(a.eliminado||0));
  modalInfo("Papelera","Elementos recuperables durante 30 días",lista.length?`
    <div class="detalle-lista">${lista.map(x=>{
      const titulo=x.datos?.nombre||x.datos?.nota||x.originalId;
      const dias=Math.max(0,Math.ceil(((x.expira||0)-Date.now())/86400000));
      return `<div class="detalle-fila"><div><b>${esc(titulo)}</b>
        <span>${esc(x.coleccion)} · ${dias} días restantes · eliminado por ${esc(x.autor||"—")}</span></div>
        <button class="btn mini" data-recuperar="${esc(x.id)}">Recuperar</button></div>`;
    }).join("")}</div>`:`<p class="nota">La papelera está vacía.</p>`);
  document.querySelectorAll("[data-recuperar]").forEach(b=>b.onclick=async()=>{

/* ============ compras a crédito: cargo a la tarjeta ================ */
/* Cualquier deuda puede recibir una compra a crédito: una línea, un
   "cuotas sin tarjeta", un crédito rotativo. Limitarlo a las tipadas como
   tarjeta dejaba fuera casos reales y la compra se quedaba sin asignar. */
const tarjetas = ()=>S.deudas;
/* Si una deuda ya tiene compras registradas, su pago es solo caja: esas
   compras ya contaron como gasto. No depende del tipo, sino del uso. */
const tieneCompras = id=>S.movimientos.some(m=>m.tarjetaId===id);
const comprasDelMes = (idT,mes)=>S.movimientos
  .filter(m=>m.tarjetaId===idT && m.tipo==="gasto" && !m.esInteres && enPeriodo(m.fecha,mes))
  .reduce((a,b)=>a+b.monto,0);
/* Los intereses también engordan la deuda, pero no son compras: mezclarlos
   falsearía el aviso de "gastas más de lo que pagas". */
const interesesDelMes = (idT,mes)=>S.movimientos
  .filter(m=>m.tarjetaId===idT && m.esInteres && enPeriodo(m.fecha,mes))
  .reduce((a,b)=>a+b.monto,0);

const fechaCorta = iso=>aDate(iso).toLocaleDateString("es",{day:"2-digit",month:"short"}).replace(".","");

/* Lista de movimientos con quién, cuándo, cómo y cuánto */
function listaDetalle(movs){
  if(!movs.length) return `<p class="nota">No hay movimientos en este grupo durante ${etiquetaPeriodo(S.mes)}.</p>`;
  return `<div class="detalle-lista">${movs.map(m=>{
    const autor = nombreDe(m.uid)||m.autor||"";
    const tarjeta = S.deudas.find(d=>d.id===m.tarjetaId)?.nombre || nombreCuenta(m.cuentaId)
      || S.deudas.find(d=>d.id===m.deudaId)?.nombre;
    return `<div class="detalle-fila" data-editar-mov="${m.id}" role="button" tabindex="0" title="Editar este movimiento">
      <div class="detalle-fecha"><b>${fechaCorta(m.fecha).split(" ")[0]}</b><em>${fechaCorta(m.fecha).split(" ")[1]||""}</em></div>
      <div class="detalle-txt">
        <b>${esc(m.nota||PSEUDO[m.tipo]?.nombre||CAT[m.categoria]?.nombre||"Movimiento")}</b>
        <small>
          <span class="quien" style="color:${col(colorPersona(m.miembro))}">${esc(m.miembro||"—")}</span>
          · ${esc(m.metodo||"—")}${m.sub?` · ${esc(nombreSub(m.categoria,m.sub))}`:""}${tarjeta?` · ${esc(tarjeta)}`:""}
          ${autor&&autor!==m.miembro?` · reg. ${esc(autor)}`:""}
        </small>
      </div>
      <span class="detalle-monto ${["ingreso","retiro"].includes(m.tipo)?"verde":""}">${["ingreso","retiro"].includes(m.tipo)?"+":"−"}${fmt(m.monto)}</span>
    </div>`;
  }).join("")}</div>`;
}

function resumenDetalle(movs,totalMes){
  const total = movs.reduce((a,b)=>a+b.monto,0);
  const porP = {};
  movs.forEach(m=>{ porP[m.miembro||"—"]=(porP[m.miembro||"—"]||0)+m.monto; });
  const personas = Object.entries(porP).sort((a,b)=>b[1]-a[1]);
  return `<div class="metricas" style="margin-top:0;border-top:none;padding-top:0">
      <div><em>Total</em><b>${fmt(total)}</b></div>
      <div><em>Movimientos</em><b>${movs.length}</b></div>
      <div><em>Ticket promedio</em><b>${fmt(movs.length?total/movs.length:0)}</b></div>
      <div><em>Del gasto del mes</em><b>${totalMes>0?Math.round(total/totalMes*100):0}%</b></div>
    </div>
    ${personas.length>1?`<div class="reparto-personas">
      ${personas.map(([n,v])=>`<span><i style="background:${col(colorPersona(n))}"></i>${esc(n)}
        <b>${fmt(v)}</b><em>${total>0?Math.round(v/total*100):0}%</em></span>`).join("")}
    </div>`:""}`;
}

function detalleCategoria(cod){
  const c = CAT[cod];
  const movs = S.movimientos
    .filter(m=>enPeriodo(m.fecha,S.mes) && m.tipo==="gasto" && m.categoria===cod)
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const R = calcular();
  const datos = R.porCat.find(x=>x.cod===cod);
  const porSub = datos && datos.subs.length>1
    ? `<div class="reparto-personas">${datos.subs.map(s=>`<span><i style="background:${col(c?.color||"#8A9099")};opacity:${s.nombre===SIN_SUB?.35:.85}"></i>${esc(s.nombre)}<b>${fmt(s.monto)}</b></span>`).join("")}</div>`
    : "";
  modalInfo(c?.nombre||cod,
    `<span class="cod" style="color:${col(c?.color||"#8A9099")}">${esc(cod)}</span> · ${etiquetaPeriodo(S.mes)}`,
    resumenDetalle(movs,R.totalGasto) + porSub + listaDetalle(movs));
}

function detallePersona(nombre){
  const movs = S.movimientos
    .filter(m=>enPeriodo(m.fecha,S.mes) && m.miembro===nombre)
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const R = calcular();
  const gastos = movs.filter(m=>m.tipo==="gasto");
  modalInfo(nombre, `Movimientos de ${etiquetaPeriodo(S.mes)}`,
    resumenDetalle(gastos,R.totalGasto) + listaDetalle(movs));
}

function detalleNaturaleza(tipo){
  const esencial=tipo==="esencial";
  const movs=S.movimientos
    .filter(m=>enPeriodo(m.fecha,S.mes) && m.tipo==="gasto" && !!m.esencial===esencial)
    .sort((a,b)=>a.fecha<b.fecha?1:-1);
  const R=calcular(), porCat={};
  movs.forEach(m=>{porCat[m.categoria]=(porCat[m.categoria]||0)+m.monto;});
  const categorias=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const color=esencial?"var(--verde)":"var(--ambar)";
  const desglose=categorias.length?`<div class="reparto-personas">${categorias.map(([cod,monto])=>
    `<span><i style="background:${color}"></i>${esc(CAT[cod]?.nombre||cod)}<b>${fmt(monto)}</b></span>`).join("")}</div>`:"";
  modalInfo(esencial?"Gastos esenciales":"Gastos prescindibles",
    `${etiquetaPeriodo(S.mes)} · toca un movimiento para editarlo`,
    resumenDetalle(movs,R.totalGasto)+desglose+listaDetalle(movs));
}

/* ============ botón atrás del móvil ===============================
   Android manda el botón atrás al historial del navegador. Sin hacer nada,
   la primera pulsación cierra la app aunque tengas una ventana abierta.
   Aquí se lleva una pila propia: atrás cierra la ventana, y si no hay
   ventana vuelve a la pestaña anterior. Cuando ya no queda nada dentro de
   la app, se avisa antes de dejar que se cierre. */
let pilaApp = [];
let salidaAvisada = false;

function apilar(estado){
  // Una ventana que reemplaza a otra no añade un paso nuevo
  if(estado.tipo==="modal" && pilaApp.at(-1)?.tipo==="modal") return;
  pilaApp.push(estado);
  try{ history.pushState({pf:pilaApp.length}, ""); }catch{}
}

/* El cajón lateral solo se despliega en pantallas estrechas; a partir de
   960px la barra está siempre visible y no hay nada que abrir. */
const enEscritorio = ()=>matchMedia("(min-width:960px)").matches;
const menuAbierto  = ()=>document.body.classList.contains("menu-abierto");
function pintarMenu(abierto){
  document.body.classList.toggle("menu-abierto", abierto);
  const velo=$("#velo"), btn=$("#btn-menu");
  if(velo) velo.hidden = !abierto;
  if(btn) btn.setAttribute("aria-expanded", String(abierto));
}
function abrirMenu(){
  if(enEscritorio() || menuAbierto()) return;
  pintarMenu(true);
  apilar({tipo:"menu"});            // así el botón atrás lo cierra
}
function cerrarMenu(){
  if(!menuAbierto()) return;
  pintarMenu(false);
  if(pilaApp.at(-1)?.tipo==="menu") history.back();
}

function irAVista(v){
  if(S.vista===v) return;
  apilar({tipo:"vista", vista:S.vista});
  S.vista = v;
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

addEventListener("popstate", ()=>{
  const est = pilaApp.pop();
  if(est){
    salidaAvisada = false;
    if(est.tipo==="menu"){ pintarMenu(false); return; }
    if(est.tipo==="modal"){ cerrarModalDOM(); return; }
    if(est.tipo==="vista"){ S.vista = est.vista; render(); return; }
    return;
  }
  // Ya no queda nada que deshacer dentro de la app
  if(!salidaAvisada){
    salidaAvisada = true;
    avisar("Estás al principio · pulsa atrás otra vez para cerrar la app");
    try{ history.pushState({pf:0}, ""); }catch{}   // reponemos el paso para no salir todavía
    setTimeout(()=>{ salidaAvisada = false; }, 4000);
  }else{
    salidaAvisada = false;
    history.back();                                // ahora sí, que se cierre
  }
});

/* Los campos de importe se formatean mientras se escriben. El cursor se
   mide desde la derecha, que es lo único estable cuando se insertan o
   quitan separadores de miles al teclear. */
document.addEventListener("input", e=>{
  const el = e.target;
  if(!el.classList || !el.classList.contains("importe")) return;
  const desdeDerecha = el.value.length - (el.selectionStart ?? el.value.length);
  const crudo = el.value.replace(/[^\d-]/g,"");
  el.value = crudo===""||crudo==="-" ? crudo : miles(num(crudo));
  const pos = Math.max(0, el.value.length - desdeDerecha);
  try{ el.setSelectionRange(pos,pos); }catch{}
});

/* ============ clima =============================================== 
   Datos de Open-Meteo: sin clave de API ni registro. Se guarda la última
   respuesta en el dispositivo para que el icono aparezca al instante y
   siga mostrando algo sin conexión. */
const CLIMA_TTL = 30*60*1000;                 // media hora
const climaCache = {};

const WMO = c=>
   c===0 ? {t:"despejado", i:"sol"}
 : c<=2  ? {t:"poco nuboso", i:"solnube"}
 : c===3 ? {t:"nublado", i:"nube"}
 : c<=48 ? {t:"niebla", i:"niebla"}
 : c<=57 ? {t:"llovizna", i:"llovizna"}
 : c<=67 ? {t:"lluvia", i:"lluvia"}
 : c<=77 ? {t:"nieve", i:"nieve"}
 : c<=82 ? {t:"chubascos", i:"lluvia"}
 : c<=86 ? {t:"nieve", i:"nieve"}
 : {t:"tormenta", i:"tormenta"};

/* Escala de viento en km/h, resumida de Beaufort a cinco tramos con
   significado práctico: hasta cuándo se puede tender ropa, cuándo hay que
   asegurar cosas fuera y cuándo conviene no salir. */
const escalaViento = v=>
   v<12 ? {clase:"v-calma",    nombre:"calma"}
 : v<29 ? {clase:"v-brisa",    nombre:"brisa"}
 : v<50 ? {clase:"v-moderado", nombre:"viento moderado"}
 : v<75 ? {clase:"v-fuerte",   nombre:"viento fuerte"}
 : {clase:"v-temporal", nombre:"temporal"};

const iconoViento = (px=13)=>`<svg viewBox="0 0 16 12" width="${px+3}" height="${px}" aria-hidden="true"
  fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
  <path d="M1 3h7.2a1.9 1.9 0 1 0-1.9-1.9"/><path d="M1 6.2h9.4a1.9 1.9 0 1 1-1.9 1.9"/><path d="M1 9.4h4.6"/></svg>`;

function iconoClima(codigo,px=20){
  const {i} = WMO(codigo??0);
  const sol = `<circle cx="9" cy="9" r="4.2" fill="var(--sol)"/>${
    [0,45,90,135,180,225,270,315].map(a=>{
      const r=(a*Math.PI)/180, x1=9+Math.cos(r)*6.2, y1=9+Math.sin(r)*6.2,
            x2=9+Math.cos(r)*8, y2=9+Math.sin(r)*8;
      return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--sol)" stroke-width="1.5" stroke-linecap="round"/>`;
    }).join("")}`;
  const nube = (x=4,y=9,s=1)=>`<path transform="translate(${x},${y}) scale(${s})"
    d="M3 8a3 3 0 0 1 .6-6 4.3 4.3 0 0 1 8.2 1A2.6 2.6 0 0 1 11.5 8Z"
    fill="var(--nube)"/>`;
  const gotas = n=>[...Array(n)].map((_,k)=>
    `<line x1="${6+k*4}" y1="15" x2="${5+k*4}" y2="19" stroke="var(--agua)" stroke-width="1.6" stroke-linecap="round"/>`).join("");
  const cuerpo = {
    sol,
    solnube: `<g opacity=".9">${sol}</g>${nube(5,8,.9)}`,
    nube: nube(3,6,1.05),
    niebla: `${nube(3,4,1)}${[0,1,2].map(k=>`<line x1="3" y1="${14+k*2.6}" x2="${15-k*2}" y2="${14+k*2.6}" stroke="var(--nube)" stroke-width="1.4" stroke-linecap="round"/>`).join("")}`,
    llovizna: `${nube(3,3,1)}${gotas(2)}`,
    lluvia: `${nube(3,3,1)}${gotas(3)}`,
    nieve: `${nube(3,3,1)}${[0,1,2].map(k=>`<circle cx="${6+k*4}" cy="${17}" r="1.5" fill="var(--agua)"/>`).join("")}`,
    tormenta: `${nube(3,3,1)}<path d="M10 14l-3 4h3l-1.5 4 4.5-5h-3z" fill="var(--rayo)"/>`,
  }[i];
  return `<svg class="ico-clima" viewBox="0 0 20 21" width="${px}" height="${px*1.05}" aria-hidden="true">${cuerpo}</svg>`;
}

const ubicaciones = ()=>(S.config?.ubicaciones||[]).slice(0,5);
const climaSel = ()=>leerLocal("pf-clima-sel") || "gps";

function posicionGPS(){
  return new Promise((ok,fallo)=>{
    if(!navigator.geolocation) return fallo(new Error("sin geolocalización"));
    navigator.geolocation.getCurrentPosition(
      p=>ok({lat:p.coords.latitude, lon:p.coords.longitude, nombre:"Mi ubicación"}),
      e=>fallo(e), {timeout:9000, maximumAge:15*60*1000});
  });
}

/* El GPS da coordenadas, no un nombre. Se resuelve una vez y se guarda:
   "Antuco" dice mucho más que "Mi ubicación" cuando hay varias guardadas. */
async function nombreDeCoordenadas(lat,lon){
  const clave = `pf-lugar:${lat.toFixed(2)},${lon.toFixed(2)}`;
  const guardado = leerLocal(clave);
  if(guardado) return guardado;
  try{
    const r = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client"
      + `?latitude=${lat}&longitude=${lon}&localityLanguage=es`);
    if(!r.ok) throw new Error("geo");
    const d = await r.json();
    const n = d.locality || d.city || d.principalSubdivision || "";
    if(n) guardarLocal(clave, n);
    return n;
  }catch{ return ""; }
}

async function traerClima(lat,lon){
  const clave = `${lat.toFixed(2)},${lon.toFixed(2)}`;
  const guardado = climaCache[clave] || (()=>{ try{ return JSON.parse(leerLocal("pf-clima:"+clave)||"null"); }catch{ return null; } })();
  if(guardado && Date.now()-guardado.ts < CLIMA_TTL){ climaCache[clave]=guardado; return guardado; }
  const url = "https://api.open-meteo.com/v1/forecast"
    + `?latitude=${lat}&longitude=${lon}`
    + "&current=temperature_2m,weather_code,wind_speed_10m"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max"
    + "&timezone=auto&forecast_days=7";
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error("clima "+r.status);
    const datos = await r.json();
    const paquete = {ts:Date.now(), datos};
    climaCache[clave]=paquete;
    guardarLocal("pf-clima:"+clave, JSON.stringify(paquete));
    return paquete;
  }catch(e){
    /* Sin conexión se sigue mostrando lo último que se supo, por viejo que
       sea: un dato de hace horas informa más que un hueco. */
    if(guardado) return guardado;      // conserva su fecha original
    throw e;
  }
}

/* Resuelve la ubicación activa y trae su pronóstico */
async function climaActivo(){
  const sel = climaSel();
  let lugar;
  if(sel==="gps"){
    const rec = (()=>{ try{ return JSON.parse(leerLocal("pf-clima-gps")||"null"); }catch{ return null; } })();
    try{
      lugar = await posicionGPS();
      guardarLocal("pf-clima-gps", JSON.stringify(lugar));
    }catch(e){
      if(!rec) throw e;          // sin permiso y sin nada guardado
      lugar = rec;               // última posición conocida
    }
    const nombre = await nombreDeCoordenadas(lugar.lat, lugar.lon);
    if(nombre) lugar = {...lugar, nombre, esGPS:true};
    else lugar = {...lugar, esGPS:true};
  }else{
    lugar = ubicaciones().find(u=>u.id===sel) || ubicaciones()[0];
    if(!lugar) throw new Error("sin ubicación");
  }
  const paquete = await traerClima(lugar.lat, lugar.lon);
  return {lugar, datos:paquete.datos, ts:paquete.ts};
}

const antiguedad = ts=>{
  const min = Math.round((Date.now()-ts)/60000);
  if(min<2) return "ahora mismo";
  if(min<60) return `hace ${min} min`;
  const hrs = Math.round(min/60);
  return hrs<24? `hace ${hrs} h` : `hace ${Math.round(hrs/24)} d`;
};

/* Lo último que se llegó a mostrar, para que el icono nunca quede vacío */
function recordarClima(estado){ guardarLocal("pf-clima-ultimo", JSON.stringify(estado)); }
function climaRecordado(){
  try{ return JSON.parse(leerLocal("pf-clima-ultimo")||"null"); }catch{ return null; }
}
function dibujarChip(estado,{viejo=false}={}){
  const btn = $("#btn-clima"); if(!btn || !estado) return;
  const v = estado.viento;
  const esc_ = v==null? null : escalaViento(v);
  btn.innerHTML = `${iconoClima(estado.codigo, 19)}`
    + (estado.lugar? `<span class="chip-lugar">${esc(estado.lugar)}</span>` : "")
    + `<b>${estado.temp}°</b>`
    + (esc_? `<span class="chip-viento ${esc_.clase}">${iconoViento(12)}<b>${Math.round(v)}</b></span>` : "");
  btn.title = `${estado.lugar} · ${WMO(estado.codigo).t}`
    + (esc_? ` · ${esc_.nombre} ${Math.round(v)} km/h` : "")
    + ` · ${antiguedad(estado.ts)}`;
  btn.classList.remove("apagado");
  btn.classList.toggle("viejo", viejo);
}

async function pintarClima(){
  const btn = $("#btn-clima"); if(!btn) return;
  const previo = climaRecordado();
  if(previo) dibujarChip(previo, {viejo:Date.now()-previo.ts > CLIMA_TTL});  // al instante
  try{
    const {lugar,datos,ts} = await climaActivo();
    const estado = {codigo:datos.current?.weather_code ?? 3,
                    temp:Math.round(datos.current?.temperature_2m ?? 0),
                    viento:datos.current?.wind_speed_10m ?? null,
                    lugar:lugar.nombre, ts};
    recordarClima(estado);
    dibujarChip(estado, {viejo: Date.now()-ts > CLIMA_TTL});
  }catch{
    /* No se pudo actualizar: se conserva lo último conocido en vez de
       borrarlo. Solo si nunca hubo dato se muestra el chip apagado. */
    if(previo){ dibujarChip(previo,{viejo:true}); return; }
    btn.innerHTML = `${iconoClima(3,19)}<b>—</b>`;
    btn.title = "Toca para activar el clima";
    btn.classList.add("apagado");
  }
}

async function buscarLugar(q){
  const r = await fetch("https://geocoding-api.open-meteo.com/v1/search"
    + `?name=${encodeURIComponent(q)}&count=6&language=es&format=json`);
  if(!r.ok) throw new Error("búsqueda");
  return (await r.json()).results || [];
}

const DIA_CORTO = f=>{

  return d.toLocaleDateString("es",{weekday:"short"}).replace(".","");
};

const MODAL_REEMPLAZADO=Symbol("modal-reemplazado");
function modal(titulo,cuerpo,onGuardar,textoBoton="Guardar",extra=null){
  const h=$("#modal-host");
  h.innerHTML=`<div class="modal"><div class="hoja" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="hoja-cab"><h2>${esc(titulo)}</h2>

      ${extra?`<button class="btn peligro" id="m-extra">${esc(extra.texto)}</button>`:""}
      <span class="empuje"></span>
      <button class="btn" id="m-cancel">Cancelar</button>
      <button class="btn primario" id="m-ok">${esc(textoBoton)}</button></div>
  </div></div>`;
  // La ventana NO se cierra al hacer clic fuera ni al pasar el cursor:
  // así no se pierde lo que llevas escrito por un roce accidental.
  // Solo cierran la X, el botón Cancelar y la tecla Esc.
  h.querySelector(".modal").onclick=e=>{ e.stopPropagation(); };
  $("#m-x").onclick=cerrarModal; $("#m-cancel").onclick=cerrarModal;
  if(extra){
    const b=$("#m-extra"); let armado=false;
    b.onclick=async()=>{
      if(!armado){ armado=true; b.textContent="Confirmar: "+extra.texto.toLowerCase(); b.classList.add("primario");
        setTimeout(()=>{ if(armado){armado=false;b.textContent=extra.texto;b.classList.remove("primario")} },4000);
        return; }
      try{ await extra.accion(); cerrarModal(); }
      catch(err){
        console.error(err);
        const e=$("#m-error"); e.textContent=mensajeOperacion(err); e.classList.remove("oculto");
      }
    };
  }
  $("#m-ok").onclick=async()=>{
    const boton=$("#m-ok"); boton.disabled=true;
    try{
      const err = await onGuardar();
      if(err===MODAL_REEMPLAZADO) return;
      if(err){const e=$("#m-error");e.textContent=err;e.classList.remove("oculto")}
      else cerrarModal();
    }catch(err){
      console.error(err);
      const e=$("#m-error"); e.textContent=mensajeOperacion(err); e.classList.remove("oculto");
    }finally{ boton.disabled=false; }
  };
  apilar({tipo:"modal"});
  setTimeout(()=>h.querySelector("input,select")?.focus(),40);
}

    <div class="campos-2">

    <div id="bloque-tarjeta" class="${(tipoIni==="gasto"&&(m?.metodo||METODOS[0])==="Crédito")?"":"oculto"}">
      ${tarjetas().length? `
        <label class="campo"><span>¿A qué tarjeta o deuda se carga?</span>
          <select id="m-tarjeta">
            ${tarjetas().map((t,i)=>`<option value="${t.id}" ${

            <option value="" ${m && !m.tarjetaId?"selected":""}>Sin asignar a ninguna deuda</option>
          </select></label>
        <p class="nota aviso-credito">El monto se suma al saldo de esa deuda. La compra cuenta como gasto del periodo; el pago posterior no vuelve a contar.</p>`
      : `<p class="nota aviso-credito">No tienes deudas registradas. Créalas en <b>Deudas → Añadir deuda o tarjeta</b> para que las compras a crédito se sumen solas a su saldo.</p>`}
    </div>

    ${registrador?`<p class="nota firma">Registrado por <b>${esc(registrador)}</b>${m&&m.creado?` · ${new Date(m.creado).toLocaleDateString("es")}`:""}</p>`:""}
  `, async()=>{
    const monto = num($("#m-monto").value);
    if(monto<=0) return "Escribe un monto mayor que cero.";
    const modo = $("#t-gasto").classList.contains("activo") ? "gasto"
               : $("#t-ingreso").classList.contains("activo") ? "ingreso" : "ahorro";
    let tipo = modo, cuentaId = "", soloCuenta = false;
    if(modo==="ahorro"){
      if(!S.cuentas.length) return "Crea primero una cuenta de ahorro en Ahorro → Cuentas de ahorro.";
      cuentaId = $("#m-cuenta").value;
      if(!cuentaId) return "Elige la cuenta de ahorro.";
      tipo = document.querySelector("#m-flujo .activo")?.dataset.flujo || "ahorro";
      soloCuenta = $("#m-solocuenta").checked;
    }
    const cat = document.querySelector("#m-cats .activo")?.dataset.cat||"OTR";
    const metodo = $("#m-metodo").value;
    const tarjetaId = (tipo==="gasto" && metodo==="Crédito") ? ($("#m-tarjeta")?.value||"") : "";
    let sub = tipo==="gasto"? ($("#m-sub")?.value||"") : "";
    const inputSub = $("#m-sub-input");
    if(tipo==="gasto" && inputSub && !inputSub.classList.contains("oculto")){
      const nuevo = inputSub.value.trim();
      if(nuevo){
        sub = nuevo;
        const actuales = subsConfigDe(cat);
        if(!actuales.some(x=>x.nombre.toLowerCase()===nuevo.toLowerCase())){
          await DB.guardarHogar({config:{...S.config,
            subsobres:{...(S.config.subsobres||{}), [cat]:[...actuales,{nombre:nuevo,tipo:"variable",aliases:[]}]}}});
        }
      }
    }
    const deudaId = (tipo==="gasto" && cat==="DEU") ? ($("#m-deuda")?.value||"") : "";
    const datos = { tipo, monto, categoria: tipo==="gasto"?cat:"OTR", sub, deudaId, fecha:$("#m-fecha").value,
      metodo, tarjetaId, cuentaId, soloCuenta, miembro:$("#m-miembro").value,
      nota:$("#m-nota").value.trim(), esencial: tipo==="gasto"? $("#m-esencial").checked : true };
    const claveDuplicado=huellaMovimiento(datos)+"|"+datos.miembro+"|"+datos.metodo;
    const duplicado=S.movimientos.find(x=>x.id!==m?.id
      && huellaMovimiento(x)+"|"+(x.miembro||"")+"|"+(x.metodo||"")===claveDuplicado);
    if(duplicado&&duplicadoAdvertido!==claveDuplicado){
      duplicadoAdvertido=claveDuplicado;
      return `Posible duplicado: ya existe ${datos.nota||"un movimiento"} por ${fmt(datos.monto)} el ${datos.fecha}. Si realmente corresponde registrarlo otra vez, pulsa Guardar nuevamente.`;
    }
    if(m){
      await DB.mutarMovimiento(m,{...m,...datos});
      avisar("Movimiento actualizado");
    }else{
      // Se estampa quién lo registra: el uid es el dato fiable, el nombre solo la etiqueta.
      await DB.mutarMovimiento(null,{...datos, uid:S.uid||"", autor:miNombre(), creado:Date.now()});
      avisar(tarjetaId? "Compra cargada a la tarjeta" : (tipo==="gasto"?"Gasto registrado":"Ingreso registrado"));
    }
  }, m? "Guardar cambios":"Guardar movimiento",
     m? {texto:"Eliminar", accion:async()=>{
          await DB.mutarMovimiento(m,null);
          avisar("Movimiento eliminado");
        }} : null);

  const g=$("#t-gasto"), ing=$("#t-ingreso"), aho=$("#t-ahorro");
  const verTarjeta = ()=>{
    const esGasto = g.classList.contains("activo");
    $("#bloque-tarjeta").classList.toggle("oculto", !(esGasto && $("#m-metodo").value==="Crédito"));
  };
  const cambiarModo = (activo)=>{
    [g,ing,aho].forEach(b=>b.classList.remove("activo"));
    activo.classList.add("activo");
    const modo = activo===g? "gasto" : activo===ing? "ingreso" : "ahorro";
    $("#bloque-cat").classList.toggle("oculto", modo!=="gasto");
    const catActual = document.querySelector("#m-cats .activo")?.dataset.cat;
    $("#bloque-deuda").classList.toggle("oculto", !(modo==="gasto" && catActual==="DEU"));
    $("#bloque-ahorro").classList.toggle("oculto", modo!=="ahorro");
    const etq=$("#etq-miembro");
    if(etq) etq.textContent = modo==="ahorro"? "¿Quién transfiere?"
                            : modo==="ingreso"? "¿Quién lo recibe?" : "¿De quién es el gasto?";
    const nota=$("#m-nota");
    if(nota) nota.placeholder = modo==="ahorro"? "Abono mensual, aguinaldo…"
                              : modo==="ingreso"? "Sueldo, venta, devolución…" : "Supermercado, gasolina…";
    if(modo==="ahorro" && !m) $("#m-metodo").value = "Transferencia";
    verTarjeta();
  };
  $("#m-metodo").onchange = verTarjeta;
  g.onclick=()=>cambiarModo(g); ing.onclick=()=>cambiarModo(ing); aho.onclick=()=>cambiarModo(aho);
  document.querySelectorAll("#m-flujo [data-flujo]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#m-flujo [data-flujo]").forEach(x=>x.classList.remove("activo"));
    b.classList.add("activo");
    const nota=$("#nota-ahorro");
    if(nota) nota.textContent = b.dataset.flujo==="ahorro"
      ? "Un aporte no es un gasto: el dinero sigue siendo tuyo, pero sale del disponible del mes de quien lo transfiere."
      : "Un retiro devuelve el dinero al disponible del mes de quien lo saca.";
  });
  document.querySelectorAll("#m-cats [data-cat]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll("#m-cats [data-cat]").forEach(x=>{x.classList.remove("activo");x.style.borderColor="";x.style.color=""});
    b.classList.add("activo"); const c=CAT[b.dataset.cat];
    b.style.borderColor=col(c.color); b.style.color=col(c.color); $("#m-esencial").checked=c.esencial;
    const sel=$("#m-sub"); if(sel) sel.innerHTML = opcionesSub(b.dataset.cat, "");
    const bd=$("#bloque-deuda"); if(bd) bd.classList.toggle("oculto", b.dataset.cat!=="DEU");
    const inp=$("#m-sub-input"); if(inp){ inp.value=""; inp.classList.add("oculto"); }
  });
  const btnSub = $("#m-sub-nuevo");
  if(btnSub) btnSub.onclick = ()=>{
    const inp = $("#m-sub-input"), sel = $("#m-sub");
    const oculto = inp.classList.toggle("oculto");
    sel.disabled = !oculto;
    btnSub.textContent = oculto? "+ Nuevo" : "Cancelar";
    if(!oculto) inp.focus(); else inp.value="";
  };
}

function modalDeuda(id=null){
  const d = id? S.deudas.find(x=>x.id===id) : null;
  const tipos = ["Tarjeta de crédito","Préstamo personal","Crédito automotriz","Hipoteca","Otro"];
  const saldoPrevio = d? (d.saldo||0) : 0;

  modal(d? "Editar deuda":"Nueva deuda o tarjeta",`
    <label class="campo"><span>Nombre</span><input id="d-nombre" placeholder="Tarjeta banco, crédito auto…" value="${esc(d?.nombre||"")}"></label>
    <div class="campos-2">
      <label class="campo"><span>Saldo actual</span><input id="d-saldo" type="text" inputmode="numeric" class="importe" placeholder="0" value="${vf(d?.saldo)}"></label>
      <label class="campo"><span>Tasa anual %</span><input id="d-tasa" type="number" inputmode="decimal" step="0.01" placeholder="36" value="${d?.tasaAnual??""}"></label>
    </div>
    ${d?`<p class="cierre-dif" id="d-dif">Si cambias el saldo, la app registrará la diferencia.</p>
        <label class="check"><input type="checkbox" id="d-corregir">
          <span>Solo corregir la cifra, sin registrar nada</span></label>`:""}
    <div class="campos-2">
      <label class="campo"><span>Pago mensual</span><input id="d-pago" type="text" inputmode="numeric" class="importe" placeholder="0" value="${vf(d?.pagoMensual)}"></label>
      <label class="campo"><span>Tipo</span><select id="d-tipo">${tipos.map(t=>`<option ${d?.tipo===t?"selected":""}>${t}</option>`).join("")}</select></label>
    </div>
    ${d?`<label class="campo"><span>Deuda inicial (para la barra de avance)</span>
      <input id="d-original" type="text" inputmode="numeric" class="importe" value="${vf(d.original??d.saldo)}"></label>`:""}
  `, async()=>{
    const nombre=$("#d-nombre").value.trim(), saldo=num($("#d-saldo").value);
    if(!nombre) return "Ponle un nombre para identificarla.";
    if(saldo<0) return "El saldo no puede ser negativo.";
    const datos={nombre,tasaAnual:numDec($("#d-tasa").value),
                 pagoMensual:num($("#d-pago").value),tipo:$("#d-tipo").value};

    if(!d){ datos.saldo=saldo; datos.original=saldo; await DB.agregar("deudas",datos); avisar("Deuda registrada"); return; }

    const dif = saldo - saldoPrevio;
    const corregir = $("#d-corregir").checked;
    datos.original = Math.max(num($("#d-original").value), saldo);

    /* Un saldo que sube sin compras detrás son intereses y cargos del
       rotativo: se registran como gasto del periodo y suman a la deuda,
       igual que una compra a crédito. Si baja, es un pago que no se anotó.
       En ambos casos el saldo lo mueve el propio movimiento, no la edición,
       para que no se descuadre. */
    if(corregir || dif===0){
      datos.saldo = saldo;
      await DB.actualizar("deudas",id,datos);
      avisar(corregir&&dif!==0? "Saldo corregido" : "Deuda actualizada");
      return;
    }
    await DB.actualizar("deudas",id,datos);
    const comun = { fecha:hoyISO(), metodo:"Transferencia", cuentaId:"", soloCuenta:false,
      miembro:miNombre(), esencial:true, sub:"", uid:S.uid||"", autor:miNombre(), creado:Date.now() };
    if(dif>0){
      const mov = {...comun, tipo:"gasto", monto:dif, categoria:"DEU", tarjetaId:id, deudaId:"",
        esInteres:true, nota:`Intereses y cargos · ${esc(d.nombre)}`};
      await DB.mutarMovimiento(null,mov);
      avisar(`${fmt(dif)} registrados como intereses`);
    }else{
      const mov = {...comun, tipo:"pago", monto:-dif, categoria:"OTR", tarjetaId:"", deudaId:id,
        nota:`Pago no registrado · ${esc(d.nombre)}`};
      await DB.mutarMovimiento(null,mov);
      avisar(`${fmt(-dif)} registrados como pago`);
    }
  }, d? "Guardar cambios":"Guardar deuda",
     d&&esAdmin()? {texto:"Eliminar", accion:async()=>{await DB.borrar("deudas",id); avisar("Deuda eliminada")}} : null);

  /* Aviso en vivo de qué se va a registrar */
  const campo = $("#d-saldo"), nota = $("#d-dif"), chk = $("#d-corregir");
  if(campo && nota){
    const refrescar = ()=>{
      const dif = num(campo.value) - saldoPrevio;
      if(chk?.checked){ nota.className="cierre-dif"; nota.textContent="Se cambiará la cifra sin dejar rastro del movimiento."; return; }
      if(dif===0){ nota.className="cierre-dif"; nota.textContent=`Saldo sin cambios respecto a ${fmt(saldoPrevio)}.`; }
      else if(dif>0){ nota.className="cierre-dif menos";
        nota.textContent=`Sube ${fmt(dif)}: se registrarán como intereses y cargos del periodo.`; }
      else { nota.className="cierre-dif ok";
        nota.textContent=`Baja ${fmt(-dif)}: se registrará como un pago que no se había anotado.`; }
    };
    campo.addEventListener("input",refrescar);
    chk?.addEventListener("change",refrescar);
    refrescar();
  }
}

function abonarDeuda(id){
  const d = S.deudas.find(x=>x.id===id); if(!d) return;
  const R = calcular();
  const compras = comprasDelMes(id,S.mes);
  /* En una tarjeta con compras registradas, esas compras ya se contaron como
     gasto del periodo. El pago solo mueve dinero: baja el saldo de la cuenta
     y la deuda, pero no vuelve a contar como gasto. En un préstamo, en cambio,
     no hay compras anotadas: el pago es el gasto. */
  const soloCaja = tieneCompras(id);
  modal(`Pago a ${d.nombre}`,`
    <label class="campo"><span>Monto del pago</span><input class="grande importe" id="pg-monto" type="text" inputmode="numeric" value="${vf(d.pagoMensual)}"></label>
    <label class="campo"><span>¿Quién lo paga?</span>
      <select id="pg-miembro">${personasHogar().map(x=>`<option ${miNombre()===x?"selected":""}>${esc(x)}</option>`).join("")}</select></label>
    ${soloCaja
      ? `<p class="nota aviso-credito">Las compras de esta tarjeta ya se contaron como gasto cuando las registraste${compras>0?` (${fmt(compras)} este periodo)`:""}. El pago sale de tu disponible y baja la deuda, sin volver a contar como gasto.</p>`
      : `<label class="check"><input type="checkbox" id="pg-mov" checked><span>Contarlo como gasto del periodo</span></label>
         <p class="nota">Saldo actual: ${fmt(d.saldo)}. En un préstamo la cuota sí es el gasto del mes, porque no hay compras registradas detrás.</p>`}
  `, async()=>{
    const v=num($("#pg-monto").value);
    if(v<=0) return "Escribe un monto mayor que cero.";
    const quien = $("#pg-miembro").value;
    const comun = { monto:v, fecha:hoyISO(), metodo:"Transferencia", tarjetaId:"", cuentaId:"",
      soloCuenta:false, miembro:quien, esencial:true, deudaId:id, sub:"",
      nota:`Pago ${d.nombre}`, uid:S.uid||"", autor:miNombre(), creado:Date.now() };
    /* Un único camino: movimiento y saldo se confirman juntos. */
    const mov = (!soloCaja && $("#pg-mov")?.checked)
      ? {...comun, tipo:"gasto", categoria:"DEU"}
      : {...comun, tipo:"pago",  categoria:"OTR"};
    await DB.mutarMovimiento(null,mov);
    avisar("Pago registrado");
  },"Registrar pago");
}

function codigoLibre(nombre){
  const limpio = nombre.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z]/g,"");
  const base = (limpio.slice(0,3)||"XXX").padEnd(3,"X");
  if(!CAT[base]) return base;
  for(let i=1;i<100;i++){ const alt=base.slice(0,2)+i; if(!CAT[alt]) return alt; }
  return base.slice(0,2)+Math.floor(Math.random()*90+10);
}

  const guardar = async(nuevos)=>{
    await DB.guardarHogar({config:{...S.config, subsobres:{...(S.config.subsobres||{}), [cod]:nuevos}}});
    cerrarModal(); setTimeout(()=>modalSubsobres(cod),120);
  };

    const v = $("#sub-nuevo").value.trim();
    const e = $("#sub-error");

    if(lista.some(x=>[x.nombre,...(x.aliases||[])].some(n=>n.toLowerCase()===v.toLowerCase()))){
      e.textContent="Ya existe un sub-sobre con ese nombre."; e.classList.remove("oculto"); return; }

  };
  document.querySelectorAll("[data-guardar-sub]").forEach(b=>b.onclick=async()=>{
    const i=Number(b.dataset.guardarSub), anterior=lista[i];
    const nombre=document.querySelector(`[data-sub-nombre="${i}"]`).value.trim();
    const tipo=document.querySelector(`[data-sub-tipo="${i}"]`).value;
    const e=$("#sub-error");
    if(!nombre){e.textContent="El nombre no puede quedar vacío.";e.classList.remove("oculto");return;}
    if(lista.some((x,j)=>j!==i&&[x.nombre,...(x.aliases||[])].some(n=>n.toLowerCase()===nombre.toLowerCase()))){
      e.textContent="Ya existe otro sub-sobre con ese nombre.";e.classList.remove("oculto");return;}
    const aliases=nombre!==anterior.nombre
      ? [...new Set([...(anterior.aliases||[]),anterior.nombre])].slice(-10) : (anterior.aliases||[]);
    await guardar(lista.map((x,j)=>j===i?{nombre,tipo,aliases}:x));
  });
  document.querySelectorAll("[data-quitar-sub]").forEach(b=>b.onclick=async()=>{
    const i = Number(b.dataset.quitarSub);

    await guardar(lista.filter((_,j)=>j!==i));
  });
}

function sugerirPresupuestos(){
  const nuevos={...S.presupuestos};
  CATEGORIAS.forEach(c=>{
    let suma=0,meses=0;
    for(let k=1;k<=3;k++){
      const mm=sumaMes(periodoDe(hoyISO()),-k);
      const t=S.movimientos.filter(m=>m.tipo==="gasto"&&m.categoria===c.cod&&enPeriodo(m.fecha,mm)).reduce((a,b)=>a+b.monto,0);
      if(t>0){suma+=t;meses++}
    }
    if(meses) nuevos[c.cod]=Math.round(suma/meses*0.9/10)*10;
  });
  DB.guardarHogar({presupuestos:nuevos});
  avisar("Presupuestos sugeridos");
}

/* ==================== reporte en Excel ============================
   Se genera con SheetJS, que se carga solo cuando se pide el reporte.
   Si no hay conexión para traer la librería, se cae a un CSV. */
let XLSX = null;
async function cargarXLSX(){
  if(XLSX) return XLSX;
  XLSX = await import("https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs");
  return XLSX;
}

function hojaDesde(X,filas,anchos,formatos){
  const ws = X.utils.aoa_to_sheet(filas);
  if(anchos) ws["!cols"] = anchos.map(w=>({wch:w}));
  if(formatos){
    const rango = X.utils.decode_range(ws["!ref"]);
    for(let f=1; f<=rango.e.r; f++){
      for(const [colStr,fmt] of Object.entries(formatos)){
        const c = Number(colStr);
        const cel = ws[X.utils.encode_cell({r:f,c})];
        if(cel && typeof cel.v==="number") cel.z = fmt;
      }
    }
  }
  return ws;
}
