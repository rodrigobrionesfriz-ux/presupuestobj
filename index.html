  mes: mesDe(hoyISO()), mesFijado:false, abiertos:new Set(), verTodosSobres:false, vista:"panel", filtroCat:"TODAS", filtroTexto:"", filtroPersona:"TODAS", csv:"",
};
const COLORES_PERSONA = ["#2E6E8E","#A34E6B","#3F7D58","#8A6A3B","#6B6BA8","#B5651D"];
/* Nombre con el que aparece cada persona del hogar. Si el movimiento trae el
   uid de quien lo registró, se resuelve contra los perfiles del hogar. */
const nombreDe = uid => S.perfiles?.[uid]?.nombre || "";
const colorPersona = nombre =>{
  const lista = personasHogar();
  const i = lista.indexOf(nombre);
  return COLORES_PERSONA[(i<0?0:i) % COLORES_PERSONA.length];
};
function personasHogar(){
  const set = new Set(S.config.miembros||[]);
  Object.values(S.perfiles||{}).forEach(p=>{ if(p?.nombre) set.add(p.nombre); });
  return [...set];
}
const miNombre = ()=> nombreDe(S.uid) || (S.config.miembros?.[0]) || "Yo";

/* Los importes se muestran siempre como enteros con separador de miles:
   en el presupuesto del hogar los céntimos solo añaden ruido visual. */
const fmt = (n)=>{
  const v = Math.round(n||0);
  try{
    return new Intl.NumberFormat(S.config.locale||"es-MX",{style:"currency",currency:S.config.moneda||"MXN",
      minimumFractionDigits:0, maximumFractionDigits:0}).format(v);
  }catch{ return "$"+v.toLocaleString("es-CL"); }
};

/* Diferencias que un movimiento produce en los saldos de deuda. Un valor
   positivo aumenta la deuda y uno negativo la reduce. Se usa tanto en modo
   local como dentro de una transacción de Firestore. */
function deltasDeudaMovimiento(antes,despues){
  const cambios={};
  const sumar=(id,delta)=>{ if(id && delta) cambios[id]=(cambios[id]||0)+delta; };
  const cargo=m=>m?.tipo==="gasto" && m.tarjetaId ? {id:m.tarjetaId,monto:m.monto||0} : null;
  const pago=m=>m?.deudaId && (m.tipo==="pago" || (m.tipo==="gasto"&&m.categoria==="DEU"))
    ? {id:m.deudaId,monto:m.monto||0} : null;
  const ca=cargo(antes), cd=cargo(despues), pa=pago(antes), pd=pago(despues);
  if(ca) sumar(ca.id,-ca.monto);
  if(cd) sumar(cd.id, cd.monto);
  if(pa) sumar(pa.id, pa.monto);
  if(pd) sumar(pd.id,-pd.monto);
  return cambios;
}

/* ====================== capa de datos (DB) ======================== */
/* Misma interfaz para modo nube (Firestore, tiempo real) y modo local */
let FB = null;
const DB = {
  auditar(accion,coleccion,documentoId,campos=[]){
    const a={id:uid(),accion,coleccion,documentoId,campos,fecha:Date.now(),uid:S.uid||"local",autor:miNombre()};
    S.auditoria=[a,...S.auditoria].slice(0,1000); return a;
  },
  async guardarHogar(patch){
    Object.assign(S, patch);
    // Si la conexión aún no está lista, el cambio queda al menos en pantalla
    if(S.modo==="nube" && FB) await FB.actualizarHogar(patch);
    else render();
  },
  async agregar(col,obj){
    if(col==="movimientos") asegurarPeriodoAbierto(null,obj);
    const doc = {...obj, id:obj.id||uid(), creado:Date.now()};
    if(S.modo==="nube" && FB) return await FB.agregar(col,doc);
    S[col] = [...S[col],doc]; this.auditar("crear",col,doc.id,Object.keys(obj)); render();
    return doc;
  },
  async actualizar(col,id,patch){
    if(S.modo==="nube" && FB) await FB.actualizar(col,id,patch);
    else { S[col]=S[col].map(x=>x.id===id?{...x,...patch}:x); this.auditar("editar",col,id,Object.keys(patch)); render(); }
  },
  async borrar(col,id,permitirCerrado=false){
    const actual=S[col]?.find(x=>x.id===id); if(!actual) return;
    if(col==="movimientos"&&!permitirCerrado) asegurarPeriodoAbierto(actual,null);
    if(S.modo==="nube" && FB) await FB.borrar(col,id,actual);
    else {
      S.papelera=[...S.papelera,{id:uid(),coleccion:col,originalId:id,datos:actual,
        eliminado:Date.now(),expira:Date.now()+30*86400000,uid:S.uid||"local",autor:miNombre()}];
      S[col]=S[col].filter(x=>x.id!==id); this.auditar("eliminar",col,id); render();
    }
  },
  async mutarMovimiento(antes,despues){
    asegurarPeriodoAbierto(antes,despues);
    if(S.modo==="nube" && FB) return await FB.mutarMovimiento(antes,despues);
    const cambios=deltasDeudaMovimiento(antes,despues);
    for(const [id,delta] of Object.entries(cambios)){
      S.deudas=S.deudas.map(d=>d.id===id
        ? {...d,saldo:Math.max(0,(d.saldo||0)+delta),original:Math.max(d.original||0,(d.saldo||0)+delta)} : d);
    }
    if(antes && despues){
      S.movimientos=S.movimientos.map(m=>m.id===antes.id?{...m,...despues,id:antes.id}:m);
      this.auditar("editar","movimientos",antes.id,Object.keys(despues));
    }
    else if(antes){
      const ahora=Date.now();
      S.papelera=[...S.papelera,{id:uid(),coleccion:"movimientos",originalId:antes.id,datos:antes,
        eliminado:ahora,expira:ahora+30*86400000,uid:S.uid||"local",autor:miNombre()}];
      S.movimientos=S.movimientos.filter(m=>m.id!==antes.id);
      this.auditar("eliminar","movimientos",antes.id);
    }
    else {
      const nuevo={...despues,id:despues.id||uid(),creado:despues.creado||Date.now()};
      S.movimientos=[...S.movimientos,nuevo]; this.auditar("crear","movimientos",nuevo.id,Object.keys(nuevo)); render(); return nuevo;
    }
    render(); return despues;
  },
  async restaurar(respaldo,reemplazar){
    if(S.modo==="nube" && FB) return await FB.restaurar(respaldo,reemplazar);
    S.config={...configInicial(),...respaldo.hogar.config};
    S.presupuestos={...presInicial(),...respaldo.hogar.presupuestos};
    S.perfiles={...(respaldo.hogar.perfiles||{})};
    S.nombreHogar=respaldo.hogar.nombre||S.nombreHogar;
    for(const col of COLECCIONES_RESPALDO){
      const nuevos=respaldo.datos[col]||[];
      if(reemplazar) S[col]=nuevos;
      else{
        const mapa=new Map(S[col].map(x=>[x.id,x]));
        nuevos.forEach(x=>mapa.set(x.id,x)); S[col]=[...mapa.values()];
      }
    }
    this.auditar("restaurar","respaldo",respaldo.hogar.id||"archivo");
    render();
  },
  async recuperarPapelera(item){
    if(item.coleccion==="movimientos") asegurarPeriodoAbierto(null,item.datos);
    if(S.modo==="nube" && FB) return await FB.recuperarPapelera(item);
    const dato={...item.datos,id:item.originalId};
    const mapa=new Map((S[item.coleccion]||[]).map(x=>[x.id,x])); mapa.set(dato.id,dato);
    S[item.coleccion]=[...mapa.values()];
    if(item.coleccion==="movimientos"){
      for(const [id,delta] of Object.entries(deltasDeudaMovimiento(null,dato)))
        S.deudas=S.deudas.map(d=>d.id===id?{...d,saldo:Math.max(0,(d.saldo||0)+delta),original:Math.max(d.original||0,(d.saldo||0)+delta)}:d);
    }
    S.papelera=S.papelera.filter(x=>x.id!==item.id);
    this.auditar("recuperar",item.coleccion,item.originalId); render();
  },
  async limpiarPapeleraVencida(){
    const ids=S.papelera.filter(x=>(x.expira||0)<=Date.now()).map(x=>x.id);
    if(!ids.length) return;
    if(S.modo==="nube"&&FB) await FB.vaciarPapelera(ids);
    else { const set=new Set(ids); S.papelera=S.papelera.filter(x=>!set.has(x.id)); render(); }
  },
  async generarRecurrente(rec,periodo){
    if(S.modo==="nube"&&FB) return await FB.generarRecurrente(rec,periodo);
    if(S.movimientos.some(m=>m.recurrenteId===rec.id&&m.periodoRecurrente===periodo)) return false;
    const mov=movimientoDesdeRecurrente(rec,periodo);
    await this.mutarMovimiento(null,mov); return true;
  },
  async importarMovimientos(lista){
    lista.forEach(m=>asegurarPeriodoAbierto(null,m));
    if(S.modo==="nube"&&FB) return await FB.importarMovimientos(lista);
    const nuevos=lista.map(x=>({...x,id:uid(),creado:Date.now()}));
    S.movimientos=[...S.movimientos,...nuevos];
    nuevos.forEach(x=>this.auditar("crear","movimientos",x.id,["importado"])); render();
  },
};

/* ============================ Firebase ============================ */
async function iniciarFirebase(){
  const [{initializeApp},
         {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signInAnonymously,signOut,
          GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,sendPasswordResetEmail,
          sendEmailVerification,EmailAuthProvider,linkWithCredential,linkWithPopup},
         {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,getDoc,setDoc,updateDoc,
          collection,onSnapshot,arrayUnion,arrayRemove,serverTimestamp,runTransaction,writeBatch,
          query,orderBy,limit}] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"),
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = getAuth(app);
  const db = initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  let desuscribir = [];
  const datoAuditoria=(accion,coleccion,documentoId,campos=[])=>({
    accion,coleccion,documentoId,campos,fecha:Date.now(),
    uid:auth.currentUser?.uid||"",autor:miNombre()
  });

  FB = {
    auth, db,
    entrar:(e,p)=>signInWithEmailAndPassword(auth,e,p),
    registrar:(e,p)=>createUserWithEmailAndPassword(auth,e,p),
    anonimo:()=>signInAnonymously(auth),
    salir:()=>signOut(auth),
    restablecer:e=>sendPasswordResetEmail(auth,e),
    verificarCorreo:()=>sendEmailVerification(auth.currentUser),
    vincularCorreo:(e,p)=>linkWithCredential(auth.currentUser,EmailAuthProvider.credential(e,p)),
    vincularGoogle:()=>linkWithPopup(auth.currentUser,new GoogleAuthProvider()),
    async google(){
      const prov = new GoogleAuthProvider();
      prov.setCustomParameters({prompt:"select_account"});
      // La ventana emergente falla en apps instaladas y en algunos navegadores
      // móviles: en ese caso se cae a la redirección de página completa.
      try{
        return await signInWithPopup(auth,prov);
      }catch(e){
        const c = String(e?.code||"");
        if(c.includes("popup-blocked")||c.includes("operation-not-supported")||
           c.includes("cancelled-popup-request")||c.includes("web-storage-unsupported")){
          return signInWithRedirect(auth,prov);
        }
        throw e;
      }
    },
    async crearHogar(nombre){
      const codigo = codigoHogar();
      await setDoc(doc(db,"hogares",codigo),{
        config:configInicial(), presupuestos:presInicial(),
        nombre:nombre||"Mi hogar", miembrosUid:[auth.currentUser.uid],
        adminUid:auth.currentUser.uid, adminCorreo:auth.currentUser.email||"", creado:serverTimestamp()
      });
      await setDoc(doc(db,"usuarios",auth.currentUser.uid),{hogarId:codigo,nombre:nombre||""});
      return codigo;
    },
    async unirseHogar(codigo){
      const c = codigo.trim().toUpperCase();
      await updateDoc(doc(db,"hogares",c),{miembrosUid:arrayUnion(auth.currentUser.uid)});
      await setDoc(doc(db,"usuarios",auth.currentUser.uid),{hogarId:c});
      return c;
    },
    async transferirAdmin(uid,correo){
      await updateDoc(doc(db,"hogares",S.hogarId),{adminUid:uid,adminCorreo:correo||""});
    },
    async abandonarHogar(){
      const lote=writeBatch(db);
      lote.update(doc(db,"hogares",S.hogarId),{miembrosUid:arrayRemove(auth.currentUser.uid)});
      lote.set(doc(db,"usuarios",auth.currentUser.uid),{hogarId:null},{merge:true});
      await lote.commit();
      this.cortar(); S.hogarId=null; S.adminUid=""; S.adminCorreo=""; pantallaHogar();
    },
    async perfil(u){
      const d = await getDoc(doc(db,"usuarios",u));
      return d.exists()? d.data() : null;
    },
    guardarPerfil(patch){
      if(!auth.currentUser) return Promise.resolve();
      return setDoc(doc(db,"usuarios",auth.currentUser.uid),patch,{merge:true});
    },
    async hogarDeUsuario(u){
      const d = await getDoc(doc(db,"usuarios",u));
      return d.exists()? d.data().hogarId : null;
    },
    escuchar(hogarId){
      this.cortar();
      const base = doc(db,"hogares",hogarId);
      desuscribir.push(onSnapshot(base, d=>{
        if(!d.exists()) return;
        const v = d.data();
        S.config = {...configInicial(),...(v.config||{})};
        S.presupuestos = {...presInicial(),...(v.presupuestos||{})};
        S.perfiles = v.perfiles||{};
        S.miembrosUid = v.miembrosUid||[];
        if(!S.mesFijado){ S.mes = periodoDe(hoyISO()); S.mesFijado = true; }
        S.adminUid = v.adminUid||""; S.adminCorreo = v.adminCorreo||"";
        S.nombreHogar = v.nombre||"Mi hogar";
        render();
      }, err=>marcarError(err)));
      ["movimientos","deudas","metas","cuentas","cierres","conciliaciones","recurrentes","papelera"].forEach(col=>{
        desuscribir.push(onSnapshot(collection(db,"hogares",hogarId,col), snap=>{
          S[col] = snap.docs.map(d=>({...d.data(), id:d.id}));
          render();
          if(col==="recurrentes") setTimeout(()=>procesarRecurrentes(),0);
        }, err=>marcarError(err)));
      });
      desuscribir.push(onSnapshot(query(collection(db,"hogares",hogarId,"auditoria"),orderBy("fecha","desc"),limit(200)),snap=>{
        S.auditoria=snap.docs.map(d=>({...d.data(),id:d.id})); render();
      },err=>marcarError(err)));
    },
    cortar(){desuscribir.forEach(f=>f());desuscribir=[]},
    actualizarHogar(patch){
      const p={};
      if(patch.config) p.config=patch.config;
      if(patch.presupuestos) p.presupuestos=patch.presupuestos;
      if(patch.perfiles) p.perfiles=patch.perfiles;
      if(patch.nombre!==undefined) p.nombre=patch.nombre;
      return Object.keys(p).length? updateDoc(doc(db,"hogares",S.hogarId),p) : Promise.resolve();
    },
    async agregar(col,obj){
      const {id,...resto}=obj;
      const ref=doc(collection(db,"hogares",S.hogarId,col));
      const auditRef=doc(collection(db,"hogares",S.hogarId,"auditoria"));
      const lote=writeBatch(db);
      lote.set(ref,resto);
      lote.set(auditRef,datoAuditoria("crear",col,ref.id,Object.keys(resto)));
      await lote.commit();
      return {...resto, id:ref.id};
    },
    async actualizar(col,id,patch){
      const lote=writeBatch(db);
      lote.update(doc(db,"hogares",S.hogarId,col,id),patch);
      lote.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),
        datoAuditoria("editar",col,id,Object.keys(patch)));
      await lote.commit();
    },
    async borrar(col,id,actual){
      const lote=writeBatch(db), ahora=Date.now();
      lote.set(doc(collection(db,"hogares",S.hogarId,"papelera")),{
        coleccion:col,originalId:id,datos:actual,eliminado:ahora,expira:ahora+30*86400000,
        uid:auth.currentUser.uid,autor:miNombre()
      });
      lote.delete(doc(db,"hogares",S.hogarId,col,id));
      lote.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),datoAuditoria("eliminar",col,id));
      await lote.commit();
    },
    async mutarMovimiento(antes,despues){
      const movRef = antes
        ? doc(db,"hogares",S.hogarId,"movimientos",antes.id)
        : doc(collection(db,"hogares",S.hogarId,"movimientos"));

      // Las altas que no afectan deudas conservan la cola offline normal de
      // Firestore; no necesitan una transacción.
      if(!antes && Object.keys(deltasDeudaMovimiento(null,despues)).length===0){
        const {id,...datos}=despues;
        const lote=writeBatch(db);
        lote.set(movRef,datos);
        lote.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),
          datoAuditoria("crear","movimientos",movRef.id,Object.keys(datos)));
        await lote.commit();
        return {...despues,id:movRef.id};
      }

      await runTransaction(db,async tx=>{
        // En una edición se usa la versión realmente guardada, no la copia
        // posiblemente antigua de la pantalla. Esto evita sumar dos veces si
        // dos teléfonos corrigen el mismo movimiento a la vez.
        let actual=null;
        if(antes){
          const movSnap=await tx.get(movRef);
          if(!movSnap.exists()) throw new Error("El movimiento ya no existe");
          actual={...movSnap.data(),id:movRef.id};
        }
        const cambios=deltasDeudaMovimiento(actual,despues);
        const ids=Object.keys(cambios).filter(id=>cambios[id]!==0);
        // Firestore exige realizar todas las lecturas antes de las escrituras.
        const refs=ids.map(id=>doc(db,"hogares",S.hogarId,"deudas",id));
        const snaps=[];
        for(const ref of refs) snaps.push(await tx.get(ref));
        snaps.forEach((snap,i)=>{
          if(!snap.exists()) throw new Error("La deuda asociada ya no existe");
          const d=snap.data(), saldo=Math.max(0,(d.saldo||0)+cambios[ids[i]]);
          tx.update(refs[i],{saldo,original:Math.max(d.original||0,saldo)});
        });
        if(antes && despues){
          const {id,...datos}=despues;
          tx.update(movRef,datos);
        }else if(antes){
          tx.delete(movRef);
        }else{
          const {id,...datos}=despues;
          tx.set(movRef,datos);
        }
        const accion=antes?(despues?"editar":"eliminar"):"crear";
        if(antes&&!despues){
          const ahora=Date.now();
          tx.set(doc(collection(db,"hogares",S.hogarId,"papelera")),{
            coleccion:"movimientos",originalId:movRef.id,datos:actual,
            eliminado:ahora,expira:ahora+30*86400000,uid:auth.currentUser.uid,autor:miNombre()
          });
        }
        tx.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),
          datoAuditoria(accion,"movimientos",movRef.id,despues?Object.keys(despues):[]));
      });
      return despues ? {...despues,id:antes?.id||movRef.id} : null;
    },
    async restaurar(respaldo,reemplazar){
      const operaciones=[];
      const hogarRef=doc(db,"hogares",S.hogarId);
      operaciones.push(b=>b.update(hogarRef,{
        nombre:respaldo.hogar.nombre||S.nombreHogar,
        config:{...configInicial(),...respaldo.hogar.config},
        presupuestos:{...presInicial(),...respaldo.hogar.presupuestos},
        perfiles:{...(respaldo.hogar.perfiles||{})}
      }));
      operaciones.push(b=>b.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),
        datoAuditoria("restaurar","respaldo",respaldo.hogar.id||"archivo")));
      if(reemplazar){
        for(const col of COLECCIONES_RESPALDO){
          const entrantes=new Set((respaldo.datos[col]||[]).map(x=>x.id));
          for(const actual of S[col]) if(!entrantes.has(actual.id))
            operaciones.push(b=>b.delete(doc(db,"hogares",S.hogarId,col,actual.id)));
        }
      }
      for(const col of COLECCIONES_RESPALDO){
        for(const item of respaldo.datos[col]||[]){
          const {id,...datos}=item;
          const ref=id ? doc(db,"hogares",S.hogarId,col,id) : doc(collection(db,"hogares",S.hogarId,col));
          operaciones.push(b=>b.set(ref,datos));
        }
      }
      // Margen bajo el límite de 500 escrituras de Firestore.
      for(let i=0;i<operaciones.length;i+=400){
        const lote=writeBatch(db);
        operaciones.slice(i,i+400).forEach(op=>op(lote));
        await lote.commit();
      }
    },
    async recuperarPapelera(item){
      const destino=doc(db,"hogares",S.hogarId,item.coleccion,item.originalId);
      const papel=doc(db,"hogares",S.hogarId,"papelera",item.id);
      const audit=doc(collection(db,"hogares",S.hogarId,"auditoria"));
      const {id,...datos}=item.datos;
      if(item.coleccion!=="movimientos"){
        const lote=writeBatch(db); lote.set(destino,datos); lote.delete(papel);
        lote.set(audit,datoAuditoria("recuperar",item.coleccion,item.originalId));
        await lote.commit(); return;
      }
      await runTransaction(db,async tx=>{
        const cambios=deltasDeudaMovimiento(null,datos), ids=Object.keys(cambios).filter(x=>cambios[x]);
        const refs=ids.map(id=>doc(db,"hogares",S.hogarId,"deudas",id)), snaps=[];
        for(const ref of refs) snaps.push(await tx.get(ref));
        snaps.forEach((snap,i)=>{
          if(!snap.exists()) throw new Error("Restaura primero la deuda asociada");
          const d=snap.data(),saldo=Math.max(0,(d.saldo||0)+cambios[ids[i]]);
          tx.update(refs[i],{saldo,original:Math.max(d.original||0,saldo)});
        });
        tx.set(destino,datos); tx.delete(papel);
        tx.set(audit,datoAuditoria("recuperar","movimientos",item.originalId));
      });
    },
    async vaciarPapelera(ids){
      for(let i=0;i<ids.length;i+=400){
        const lote=writeBatch(db);
        ids.slice(i,i+400).forEach(id=>lote.delete(doc(db,"hogares",S.hogarId,"papelera",id)));
        await lote.commit();
      }
    },
    async generarRecurrente(rec,periodo){
      const id=`${rec.id}_${periodo}`, ref=doc(db,"hogares",S.hogarId,"movimientos",id);
      let creado=false;
      await runTransaction(db,async tx=>{
        if((await tx.get(ref)).exists()) return;
        const mov=movimientoDesdeRecurrente(rec,periodo), {id:ignorar,...datos}=mov;
        tx.set(ref,datos);
        tx.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),
          datoAuditoria("crear","movimientos",id,["recurrenteId","periodoRecurrente"]));
        creado=true;
      });
      return creado;
    },
    async importarMovimientos(lista){
      for(let i=0;i<lista.length;i+=200){
        const lote=writeBatch(db);
        lista.slice(i,i+200).forEach(m=>{
          const ref=doc(collection(db,"hogares",S.hogarId,"movimientos"));
          lote.set(ref,m);
          lote.set(doc(collection(db,"hogares",S.hogarId,"auditoria")),
            datoAuditoria("crear","movimientos",ref.id,["importado"]));
        });
        await lote.commit();
      }
    },
  };

  // Si volvemos de una redirección de Google, recogemos el resultado
  getRedirectResult(auth).catch(e=>console.warn("redirect:",e));

  onAuthStateChanged(auth, async u=>{
    if(!u){ FB.cortar(); S.uid=null; S.hogarId=null; pantallaAcceso(); return; }
    S.uid=u.uid; S.correo=u.email||""; S.nombreUsuario=u.displayName||u.email||"Invitado"; S.foto=u.photoURL||"";
    S.anonimo=u.isAnonymous; S.correoVerificado=u.emailVerified;
    S.proveedores=(u.providerData||[]).map(p=>p.providerId);
    cargarFondoLocal();
    const p = await FB.perfil(u.uid);
    if(p?.fondo && p.fondo!==S.fondo){
      S.fondo=p.fondo; S.fondoOpacidad=p.fondoOpacidad??0.14;
      guardarLocal(claveFondo(),S.fondo); guardarLocal(claveFondo()+":op",String(S.fondoOpacidad));
      pintarFondo();
    }
    if(!p?.hogarId){ pantallaHogar(); return; }
    S.hogarId=p.hogarId; FB.escuchar(p.hogarId); mostrarApp();
  });
}
const codigoHogar = ()=>{
  const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s="";
  for(let i=0;i<8;i++) s+=a[Math.floor(Math.random()*a.length)];
  return s;
};
function marcarError(err){
  console.error(err);
  $("#punto").className="punto error";
  $("#estado-txt").textContent="sin permisos";
}
function mensajeOperacion(err){
  const c=String(err?.code||"");
  if(c.includes("unavailable") || !navigator.onLine)
    return "Necesitas conexión para actualizar una tarjeta o deuda. No se guardó ningún cambio.";
  if(c.includes("permission-denied"))
    return "Firebase rechazó la operación. Revisa que las reglas publicadas correspondan a esta versión.";
  if(c.includes("aborted"))
    return "Otro dispositivo modificó estos datos al mismo tiempo. Inténtalo nuevamente.";
  return err?.message || "No se pudo completar la operación.";
}

function traduce(e){
  const m = String(e?.code||e?.message||e);
  if(m.includes("popup-closed-by-user")||m.includes("cancelled-popup")) return "Cerraste la ventana de Google antes de terminar.";
  if(m.includes("account-exists-with-different-credential")) return "Ese correo ya tiene cuenta con contraseña. Entra con tu contraseña y luego vincula Google.";
  if(m.includes("unauthorized-domain")) return "Este dominio no está autorizado. Añádelo en Firebase → Authentication → Settings → Dominios autorizados.";
  if(m.includes("invalid-email")) return "El correo no tiene un formato válido.";
  if(m.includes("weak-password")) return "La contraseña necesita al menos 6 caracteres.";
  if(m.includes("email-already-in-use")) return "Ese correo ya tiene cuenta. Entra con tu contraseña.";
  if(m.includes("invalid-credential")||m.includes("wrong-password")||m.includes("user-not-found")) return "Correo o contraseña incorrectos.";
  if(m.includes("not-found")) return "Ese código de hogar no existe. Revísalo con quien te lo compartió.";
  if(m.includes("permission-denied")) return "Sin permiso. Revisa las reglas de Firestore del proyecto.";
  if(m.includes("operation-not-allowed")) return "Activa este método de acceso en Firebase → Authentication.";
  return "No se pudo completar la operación: "+m;
}

/* ============================ cálculos ============================ */
/* ============ remanente entre periodos ============================
   Lo que no se gasta no desaparece: sigue en la cuenta. Al cerrarse un
   periodo, su saldo pasa al siguiente como remanente, y así se acumula.
   Se cuenta solo desde el primer periodo con ingresos registrados: antes
   de eso los datos están incompletos y el arrastre saldría falseado. */
function saldoDePeriodo(mm){
  const dentro = S.movimientos.filter(m=>enPeriodo(m.fecha,mm) && afectaCaja(m));
  const suma = t => dentro.filter(m=>m.tipo===t).reduce((a,b)=>a+b.monto,0);
  return suma("ingreso") + suma("retiro")
       - suma("gasto") - suma("ahorro") - suma("pago");
}
/* Flujo de caja de una persona en un periodo, ajustes de cierre incluidos:
   sirve para repartir el arrastre, no para calcular el saldo teórico. */
function flujoCaja(nombre,mes){
  const suyos = S.movimientos.filter(m=>enPeriodo(m.fecha,mes) && m.miembro===nombre && afectaCaja(m));
  const suma = t=>suyos.filter(m=>m.tipo===t).reduce((a,b)=>a+b.monto,0);
  return suma("ingreso") + suma("retiro") - suma("gasto") - suma("ahorro") - suma("pago");
}

function remanenteInfo(mes){
  if(S.config?.arrastre==="reiniciar") return {monto:0, ancla:null, porPersona:{}};

  /* Reparte un punto de partida por persona y le suma su flujo de los
     periodos intermedios, para que el arrastre no quede como un bloque
     anónimo del hogar sino dentro del disponible de cada uno. */
  const repartir = (base, desde)=>{
    const mapa = {...base};
    let p = sumaMes(desde,1), vueltas = 0;
    while(p !== mes && vueltas++ < 120){
      personasHogar().forEach(n=>{ mapa[n] = (mapa[n]||0) + flujoCaja(n,p); });
      p = sumaMes(p,1);
    }
    return mapa;
  };

  /* Si hay un cierre anterior, ese es el punto de partida: son saldos
     declarados, no estimados. Anclar aquí es lo que hace que cerrar el mes
     sirva de algo: el disponible deja de arrastrar la desviación acumulada. */
  const previos = S.cierres.filter(c=>c.mes < mes).sort((a,b)=> a.mes<b.mes? 1 : -1);
  if(previos.length){
    const ancla = previos[0];
    let acc = Object.values(ancla.saldos||{}).reduce((a,b)=>a+(b||0),0);
    let p = sumaMes(ancla.mes,1), vueltas = 0;
    while(p !== mes && vueltas++ < 120){ acc += saldoDePeriodo(p); p = sumaMes(p,1); }
    return {monto:acc, ancla, porPersona:repartir(ancla.saldos||{}, ancla.mes)};
  }

  /* Si el cierre de este mismo periodo declaró con cuánto empezó cada
     persona, ese es su arranque real y no hay nada que estimar. */
  const propio = cierreDe(mes);
  if(propio?.iniciales && Object.keys(propio.iniciales).length){
    const monto = Object.values(propio.iniciales).reduce((a,b)=>a+(b||0),0);
    return {monto, ancla:{mes:sumaMes(mes,-1), inicial:true}, porPersona:{...propio.iniciales}};
  }

  /* Sin ningún cierre todavía: se acumula desde el primer periodo con
     ingresos registrados, que es lo mejor que se puede hacer a ciegas. */
  const conIngreso = S.movimientos.filter(m=>m.tipo==="ingreso").map(m=>m.fecha).sort();
  if(!conIngreso.length) return {monto:0, ancla:null, porPersona:{}};
  const primero = periodoDe(conIngreso[0]);
  let p = primero, acc = 0, vueltas = 0;
  while(p !== mes && vueltas++ < 120){ acc += saldoDePeriodo(p); p = sumaMes(p,1); }
  if(vueltas>=120) return {monto:0, ancla:null, porPersona:{}};
  return {monto:acc, ancla:null, porPersona:repartir({}, sumaMes(primero,-1))};
}
const remanenteAntesDe = mes => remanenteInfo(mes).monto;

/* ============ cierre de periodo: cuadrar con la realidad ==========
   El saldo teórico de una persona al cerrar un periodo es lo que la app
   cree que debería tener: el saldo real que ella misma declaró en el
   cierre anterior, más lo que entró y menos lo que salió según lo
   registrado. La diferencia contra su saldo real es, casi siempre, gasto
   que nunca se anotó. Al arrancar cada cierre desde el saldo declarado,
   los errores de un mes no se arrastran a los siguientes. */
const cierreDe = mes => S.cierres.find(c=>c.mes===mes);
const periodoCerrado = fecha=>cierreDe(periodoDe(fecha));
function asegurarPeriodoAbierto(antes,despues){
  const bloqueados=[antes,despues].filter(Boolean).map(m=>periodoDe(m.fecha))
    .filter((m,i,a)=>a.indexOf(m)===i && cierreDe(m));
  if(bloqueados.length) throw new Error(`El periodo ${etiquetaPeriodo(bloqueados[0])} está cerrado. El administrador debe reabrirlo antes de modificar sus movimientos.`);
}
const ultimaConciliacion = ()=>[...(S.conciliaciones||[])].sort((a,b)=>a.fecha<b.fecha?1:-1)[0];

const diaAnterior = iso=>{ const d=aDate(iso); d.setDate(d.getDate()-1);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };

/* Cierres y conciliaciones son lo mismo a efectos de cuadratura: una
   declaración de saldo real en una fecha. Ordenadas, encadenan el cálculo. */
function declaraciones(){
  return [...(S.cierres||[]).map(c=>({fecha:c.fecha, ts:c.creado||0, saldos:c.saldos||{}, origen:"cierre"})),
          ...(S.conciliaciones||[]).map(c=>({fecha:c.fecha, ts:c.creado||0, saldos:c.saldos||{}, origen:"conciliacion"}))]
    .filter(d=>d.fecha)
    .sort((a,b)=> a.fecha===b.fecha? (a.ts-b.ts) : (a.fecha<b.fecha? -1 : 1));
}
function flujoCajaEntre(nombre,desde,hasta,desdeTs=0){
  /* Dentro del mismo día la fecha no basta: un gasto anotado después de
     conciliar sí cuenta, y uno anterior ya estaba en el saldo declarado.
     La marca de tiempo del registro deshace el empate. */
  const posterior = m => !desde ? true
    : m.fecha>desde ? true
    : (m.fecha===desde && desdeTs && (m.creado||0)>desdeTs);
  return S.movimientos
    .filter(m=>m.miembro===nombre && afectaCaja(m) && !m.ajusteCierre
            && posterior(m) && m.fecha<=hasta)
    .reduce((a,m)=> a + (["ingreso","retiro"].includes(m.tipo)? m.monto : -m.monto), 0);
}
/* Lo que esta persona debería tener el día `corte`.
   Se calcula EXACTAMENTE igual que el disponible por persona del panel:
   su parte del arrastre más sus movimientos de caja del periodo hasta esa
   fecha. Antes se encadenaba desde la última declaración, que es otro
   camino, y por eso las dos cifras no coincidían. */
function saldoAFecha(nombre,corte){
  const mes = periodoDe(corte);
  const arrastre = remanenteInfo(mes).porPersona?.[nombre] || 0;
  const flujo = S.movimientos
    .filter(m=>m.miembro===nombre && afectaCaja(m) && enPeriodo(m.fecha,mes) && m.fecha<=corte)
    .reduce((a,m)=> a + (["ingreso","retiro"].includes(m.tipo)? m.monto : -m.monto), 0);
  /* Si el ingreso estimado de la persona supera lo que ha entrado de verdad,
     el panel muestra dinero que aún no ha llegado: conviene avisarlo. */
  const estimado = (S.config.ingresosPersona||{})[nombre] || 0;
  const registrado = S.movimientos
    .filter(m=>m.miembro===nombre && m.tipo==="ingreso" && enPeriodo(m.fecha,mes) && m.fecha<=corte)
    .reduce((a,b)=>a+b.monto,0);
  return {base:arrastre, desde:inicioPeriodo(mes), flujo, teorico:arrastre+flujo,
          hayPrevio:true, porLlegar:Math.max(0, estimado-registrado)};
}

function flujoPersona(nombre,mes){
  /* Los ajustes generados por un cierre anterior se excluyen: son una
     conclusión, no un movimiento real. Si se contaran, al volver a cerrar
     el mismo periodo el saldo teórico ya vendría corregido y la diferencia
     saldría distinta. */
  const suyos = S.movimientos.filter(m=>enPeriodo(m.fecha,mes) && m.miembro===nombre
    && !m.ajusteCierre && afectaCaja(m));
  const suma = t=>suyos.filter(m=>m.tipo===t).reduce((a,b)=>a+b.monto,0);
  return suma("ingreso") + suma("retiro")
       - suma("gasto") - suma("ahorro") - suma("pago");
}
const saldoTeorico = (nombre,mes)=>saldoAFecha(nombre, mes===periodoDe(hoyISO())? hoyISO() : finPeriodo(mes));
/* Historial de lo que se detecta al cuadrar, periodo a periodo */
function historialNoRegistrado(mes,n=6){
  const salida=[];
  for(let k=n-1;k>=0;k--){
    const mm = sumaMes(mes,-k);
    const total = S.movimientos
      .filter(m=>enPeriodo(m.fecha,mm) && m.categoria==="NRG" && m.tipo==="gasto")
      .reduce((a,b)=>a+b.monto,0);
    salida.push({mes:mesCorto(mm), clave:mm, total});
  }
  return salida;
}

/* ============ cargos fijos que aún no se han pagado ================
   Antes se daba por pendiente cualquier gasto del periodo anterior en una
   categoría fija cuyo texto no se repitiera literalmente. Eso inflaba la
   cifra con compras puntuales —una reparación, un cargo único— y con
   conceptos escritos de otra forma ("Luz" frente a "Luz y agua").
   Ahora solo cuenta lo que de verdad se repite mes a mes. */
const claveConcepto = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().replace(/·.*$/,"")           // quita sufijos tipo "· sept"
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();

function fijosPendientesDetalle(mes, gastosDelMes){
  /* Un cargo se da por pagado si este periodo hay un gasto de su misma
     categoría cuyo concepto coincide, lo contiene o está contenido en él
     —"Arriendo" y "Arriendo casa" son lo mismo—, o bien con un importe casi
     idéntico, que es la señal más fiable cuando el texto cambió del todo. */
  const yaPagado = x=>gastosDelMes.some(g=>{
    if(g.categoria!==x.categoria || !esFijoMovimiento(g)) return false;
    if(x.sub && nombreSub(g.categoria,g.sub)!==x.sub) return false;
    const a = claveConcepto(g.nota), b = claveConcepto(x.nota);
    if(a && b && (a===b || a.includes(b) || b.includes(a))) return true;
    return x.monto>0 && Math.abs(g.monto - x.monto) <= x.monto*0.1;
  });
  const historial = {};
  /* Se recorre de lo más antiguo a lo más reciente para quedarse con el
     último importe conocido de cada cargo. */
  for(let k=3;k>=1;k--){
    const mm = sumaMes(mes,-k);
    S.movimientos
      .filter(m=>m.tipo==="gasto" && esFijoMovimiento(m) && !m.esInteres && !m.ajusteCierre
                 && enPeriodo(m.fecha,mm))
      .forEach(m=>{
        const c = claveConcepto(m.nota); if(!c) return;
        const sub=nombreSub(m.categoria,m.sub), clave=`${m.categoria}|${sub}|${c}`;
        if(!historial[clave]) historial[clave] = {periodos:new Set(), nota:m.nota, categoria:m.categoria, sub, monto:0};
        historial[clave].periodos.add(mm);
        historial[clave].monto = m.monto;
      });
  }
  /* Recurrente = aparece en al menos dos de los tres periodos anteriores.
     Con uno solo no hay forma de distinguir un fijo de un gasto puntual. */
  return Object.values(historial)
    .filter(x=>x.periodos.size>=2 && !yaPagado(x))
    .sort((a,b)=>b.monto-a.monto);
}

function calcular(){
  const mes = S.mes, mesAnt = sumaMes(mes,-1);
  const delMes = S.movimientos.filter(m=>enPeriodo(m.fecha,mes));
  const gastos = delMes.filter(m=>m.tipo==="gasto");
  const ingresos = delMes.filter(m=>m.tipo==="ingreso");
  const gastosAnt = S.movimientos.filter(m=>enPeriodo(m.fecha,mesAnt) && m.tipo==="gasto");

  const totalGasto = gastos.reduce((a,b)=>a+b.monto,0);
  const totalIngreso = ingresos.reduce((a,b)=>a+b.monto,0);
  const presupuestoTotal = Object.values(S.presupuestos).reduce((a,b)=>a+(b||0),0);

  const dias = diasPeriodo(mes);
  const esMesActual = mes===periodoDe(hoyISO());
  const diaHoy = esMesActual? diaDelPeriodo(mes) : dias;
  const restantes = Math.max(0,dias-diaHoy);
  const ritmoDiario = totalGasto/Math.max(1,diaHoy);

  /* Base de ingresos del mes.
     El ingreso estimado es lo que la familia espera recibir; los registrados son
     los que ya entraron. A mitad de mes suele faltar parte del sueldo, así que
     por omisión se toma el mayor de los dos y se muestran ambos, para que se vea
     de dónde sale la cifra. La base se puede fijar a mano en Ajustes. */
  const ingresoRegistrado = totalIngreso;
  const ingresoEstimado = S.config.ingresoMensual||0;
  const base = S.config.baseIngreso||"auto";
  const ingresoBase =
      base==="registrado" ? ingresoRegistrado
    : base==="estimado"   ? (ingresoEstimado || ingresoRegistrado)
    : esMesActual         ? Math.max(ingresoRegistrado, ingresoEstimado)
    : (ingresoRegistrado>0 ? ingresoRegistrado : ingresoEstimado);
  const baseUsada = ingresoBase===ingresoEstimado && ingresoEstimado!==ingresoRegistrado
    ? "estimado" : "registrado";

  /* Aportes y retiros de las cuentas de ahorro.
     Un aporte no es un gasto —el dinero sigue siendo tuyo— pero sí sale del
     disponible del mes de quien lo transfiere: ya no puede gastarlo. Los
     marcados como "solo cuenta" (intereses, comisiones, traspasos internos)
     mueven el saldo de la cuenta sin tocar el presupuesto del mes. */
  const aportes = delMes.filter(m=>m.tipo==="ahorro" && !m.soloCuenta);
  const retiros = delMes.filter(m=>m.tipo==="retiro" && !m.soloCuenta);
  const totalAporte = aportes.reduce((a,b)=>a+b.monto,0);
  const totalRetiro = retiros.reduce((a,b)=>a+b.monto,0);
  const infoRem = remanenteInfo(mes);
  const remanente = infoRem.monto;
  /* El gasto del periodo sigue siendo el devengado —así los sobres y las
     estadísticas reflejan lo que se consumió— pero el disponible solo
     descuenta lo que efectivamente salió de la cuenta. */
  const comprasCredito = gastos.filter(esCredito).reduce((a,b)=>a+b.monto,0);
  const gastosCaja = totalGasto - comprasCredito;
  const pagosTarjeta = delMes.filter(m=>m.tipo==="pago").reduce((a,b)=>a+b.monto,0);
  const anclaRem = infoRem.ancla;
  const cierrePropio = cierreDe(mes);
  const declaradoCierre = cierrePropio
    ? Object.values(cierrePropio.saldos||{}).reduce((a,b)=>a+(b||0),0) : null;
  const disponible = remanente + ingresoBase - gastosCaja - pagosTarjeta - totalAporte + totalRetiro;

  /* Saldo de cada cuenta: el inicial más todo lo aportado menos lo retirado,
     desde siempre y no solo de este mes. */
  const cuentasCalc = S.cuentas.map(c=>{
    const dentro = S.movimientos.filter(m=>m.cuentaId===c.id);
    const entradas = dentro.filter(m=>m.tipo==="ahorro").reduce((a,b)=>a+b.monto,0);
    const salidas  = dentro.filter(m=>m.tipo==="retiro").reduce((a,b)=>a+b.monto,0);
    const delMesC  = dentro.filter(m=>enPeriodo(m.fecha,mes));
    return {...c,
      saldo:(c.saldoInicial||0)+entradas-salidas, entradas, salidas,
      aporteMes: delMesC.filter(m=>m.tipo==="ahorro").reduce((a,b)=>a+b.monto,0),
      retiroMes: delMesC.filter(m=>m.tipo==="retiro").reduce((a,b)=>a+b.monto,0),
      movimientos: dentro.length,
    };
  }).sort((a,b)=>b.saldo-a.saldo);
  const saldoAhorros = cuentasCalc.reduce((a,c)=>a+c.saldo,0);

  /* Proyección de cierre por etapa del ciclo. Los cargos fijos se cuentan una
     sola vez. Para el gasto variable restante se observa cuánto se gastó desde
     este mismo día hasta el cierre en los tres periodos anteriores. Así el fuerte
     desembolso de los días 1–8 no se extrapola durante todo el mes. Sin historial
     se usa una curva prudente: el ritmo esperado después del día 8 baja al 45 %. */
  const gastoFijo = gastos.filter(esFijoMovimiento).reduce((a,b)=>a+b.monto,0);
  const gastoVariable = totalGasto-gastoFijo;
  const ritmoVariable = gastoVariable/Math.max(1,diaHoy);
  const detalleFijos = fijosPendientesDetalle(mes, gastos);
  const fijosPendientes = detalleFijos.reduce((a,x)=>a+x.monto,0);
  const diaEnCiclo=(fecha,mm)=>Math.round((aDate(fecha)-aDate(inicioPeriodo(mm)))/86400000)+1;
  const colasHistoricas=[];
  for(let k=1;k<=3;k++){
    const mm=sumaMes(mes,-k), n=diasPeriodo(mm);
    const cola=S.movimientos.filter(m=>m.tipo==="gasto" && !esFijoMovimiento(m)
      && !m.ajusteCierre && enPeriodo(m.fecha,mm) && diaEnCiclo(m.fecha,mm)>Math.min(diaHoy,n))
      .reduce((a,b)=>a+b.monto,0);
    const tieneDatos=S.movimientos.some(m=>enPeriodo(m.fecha,mm));
    if(tieneDatos) colasHistoricas.push({monto:cola,peso:4-k});
  }
  const restanteHistorico=colasHistoricas.length
    ? colasHistoricas.reduce((a,x)=>a+x.monto*x.peso,0)/colasHistoricas.reduce((a,x)=>a+x.peso,0)
    : null;
  const diasIniciales=Math.min(diaHoy,8), variableInicial=gastos
    .filter(g=>!esFijoMovimiento(g) && diaEnCiclo(g.fecha,mes)<=8).reduce((a,b)=>a+b.monto,0);
  const ritmoInicial=variableInicial/Math.max(1,diasIniciales);
  const diasPost=Math.max(0,diaHoy-8), variablePost=gastos
    .filter(g=>!esFijoMovimiento(g) && diaEnCiclo(g.fecha,mes)>8).reduce((a,b)=>a+b.monto,0);
  const ritmoPost=diasPost?variablePost/diasPost:ritmoInicial*.45;
  const restanteCurva=diaHoy<8
    ? ritmoInicial*.75*(8-diaHoy) + ritmoInicial*.45*Math.max(0,dias-8)
    : ritmoPost*restantes;
  const pesoActual=diaHoy<=8?0:Math.min(.7,diasPost/14);
  const variableRestante=restanteHistorico===null?restanteCurva
    : restanteHistorico*(1-pesoActual)+restanteCurva*pesoActual;
  const metodoProyeccion=restanteHistorico===null
    ? (diaHoy<=8?"curva 1–8 / 9–cierre":"ritmo desde el día 9")
    : (diaHoy<=8?`historial de ${colasHistoricas.length} ciclo${colasHistoricas.length===1?"":"s"}`
      : "historial + ritmo desde el día 9");
  const proyectado = esMesActual
    ? totalGasto + variableRestante + fijosPendientes
    : totalGasto;
  /* Margen = presupuesto del periodo menos lo gastado a la fecha. Los cargos
     fijos que aún no llegan no se descuentan aquí: se informan aparte, para
     que la cifra diaria sea la que uno espera y no una ya recortada. */
  const margenRestante = presupuestoTotal - totalGasto;
  const disponibleDiario = restantes>0? margenRestante/restantes : 0;
  const margenTrasFijos = margenRestante - fijosPendientes;

  /* Ahorro real del hogar: lo que entra menos lo que sale, sumando a las dos
     personas. Distinto del "ahorro potencial", que son oportunidades de recorte. */
  const ahorroReal = ingresoBase - totalGasto;
  const tasaAhorro = ingresoBase>0? ahorroReal/ingresoBase : 0;
  const ahorroProyectado = ingresoBase - proyectado;
  const tasaProyectada = ingresoBase>0? ahorroProyectado/ingresoBase : 0;

  const porCat = CATEGORIAS.map(c=>{
    const l = gastos.filter(g=>g.categoria===c.cod);
    const lAnt = gastosAnt.filter(g=>g.categoria===c.cod);
    const total = l.reduce((a,b)=>a+b.monto,0);
    const totalAnt = lAnt.reduce((a,b)=>a+b.monto,0);
    const totalAntCorte = lAnt.filter(g=>diaEnCiclo(g.fecha,mesAnt)<=diaHoy).reduce((a,b)=>a+b.monto,0);
    const pres = S.presupuestos[c.cod]||0;
    /* Reparto interno: primero los sub-sobres declarados, después lo que
       quedó sin clasificar, para que la suma cuadre siempre con el total. */
    const mapa = {};
    l.forEach(g=>{ const k=nombreSub(c.cod,(g.sub||"").trim())||SIN_SUB; mapa[k]=(mapa[k]||0)+g.monto; });
    const subs = Object.entries(mapa)
      .map(([nombre,monto])=>({nombre, monto, n:l.filter(g=>(nombreSub(c.cod,(g.sub||"").trim())||SIN_SUB)===nombre).length,
        tipo:nombre===SIN_SUB?(esFijaCat(c.cod)?"fijo":"variable"):(metaSub(c.cod,nombre)?.tipo||"variable")}))
      .sort((a,b)=> a.nombre===SIN_SUB? 1 : b.nombre===SIN_SUB? -1 : b.monto-a.monto);
    const porQuien = {};
    l.forEach(g=>{ const k=g.miembro||"—"; porQuien[k]=(porQuien[k]||0)+g.monto; });
    const personas = Object.entries(porQuien).map(([nombre,monto])=>({nombre,monto}))
      .sort((a,b)=>b.monto-a.monto);
    return {...c,total,totalAnt,totalAntCorte,pres,n:l.length,subs,personas,
      ticket:l.length?total/l.length:0,
      uso:pres>0?total/pres:null, variacion: totalAnt>0? (total-totalAnt)/totalAnt : null,
      variacionCorte:totalAntCorte>0?(total-totalAntCorte)/totalAntCorte:null, delta: total-totalAnt};
  }).sort((a,b)=>b.total-a.total);

  const esenciales = gastos.filter(g=>g.esencial).reduce((a,b)=>a+b.monto,0);
  const prescindibles = totalGasto-esenciales;

  const acumulado=[]; let acc=0;
  fechasPeriodo(mes).forEach((dd,i)=>{
    const d = i+1;                       // día número i dentro del ciclo
    acc += gastos.filter(g=>g.fecha===dd).reduce((a,b)=>a+b.monto,0);
    acumulado.push({dia:Number(dd.slice(8)),      // se rotula con el día del calendario
                    gasto:(esMesActual&&d>diaHoy)?null:acc,
                    limite:presupuestoTotal*d/dias});
  });
  const historico=[];
  for(let k=5;k>=0;k--){
    const mm=sumaMes(mes,-k);
    const g=S.movimientos.filter(m=>enPeriodo(m.fecha,mm)&&m.tipo==="gasto").reduce((a,b)=>a+b.monto,0);
    const i=S.movimientos.filter(m=>enPeriodo(m.fecha,mm)&&m.tipo==="ingreso").reduce((a,b)=>a+b.monto,0);
    historico.push({mes:mesCorto(mm),gasto:g,ingreso:i});
  }
  const gastoAnterior=gastosAnt.reduce((a,b)=>a+b.monto,0);
  const gastoAnteriorCorte=gastosAnt.filter(g=>diaEnCiclo(g.fecha,mesAnt)<=diaHoy).reduce((a,b)=>a+b.monto,0);
  const basesPromedio=[];
  for(let k=1;k<=6;k++){
    const mm=sumaMes(mes,-k);
    const movs=S.movimientos.filter(m=>enPeriodo(m.fecha,mm));
    if(movs.length) basesPromedio.push(movs.filter(m=>m.tipo==="gasto"&&diaEnCiclo(m.fecha,mm)<=diaHoy).reduce((a,b)=>a+b.monto,0));
  }
  const promedioHistorico=basesPromedio.length
    ? basesPromedio.reduce((a,b)=>a+b,0)/basesPromedio.length : 0;
  const variacionAnterior=gastoAnteriorCorte>0?(totalGasto-gastoAnteriorCorte)/gastoAnteriorCorte:null;
  const variacionPromedio=promedioHistorico>0?(totalGasto-promedioHistorico)/promedioHistorico:null;
  const porDia = DIAS.map((d,i)=>{
    const l=gastos.filter(g=>aDate(g.fecha).getDay()===i);
    return {dia:d,total:l.reduce((a,b)=>a+b.monto,0),n:l.length};
  });
  const agrupar = campo=>{
    const m={}; gastos.forEach(g=>{const k=g[campo]||"—"; m[k]=(m[k]||0)+g.monto});
    return Object.entries(m).map(([nombre,total])=>({nombre,total})).sort((a,b)=>b.total-a.total);
  };
  const conceptos={};
  gastos.forEach(g=>{
    const k=(g.nota||"Sin concepto").trim().toLowerCase();
    if(!conceptos[k]) conceptos[k]={nombre:g.nota||"Sin concepto",total:0,n:0,cod:g.categoria};
    conceptos[k].total+=g.monto; conceptos[k].n++;
  });
  const topConceptos=Object.values(conceptos).sort((a,b)=>b.total-a.total).slice(0,8);

  const ticketGeneral = gastos.length? totalGasto/gastos.length : 0;
  const umbralMicro = Math.max(ticketGeneral*0.3,1);
  const micro = gastos.filter(g=>g.monto<=umbralMicro && !g.esencial);
  const microTotal = micro.reduce((a,b)=>a+b.monto,0);

  const rec={};
  S.movimientos.filter(m=>m.tipo==="gasto").forEach(g=>{
    const k=(g.nota||"").trim().toLowerCase(); if(!k) return;
    if(!rec[k]) rec[k]={nombre:g.nota,meses:new Set(),montos:[],cod:g.categoria};
    rec[k].meses.add(periodoDe(g.fecha)); rec[k].montos.push(g.monto);
  });
  const recurrentes = Object.values(rec).filter(r=>r.meses.size>=3)
    .map(r=>({nombre:r.nombre,cod:r.cod,meses:r.meses.size,promedio:r.montos.reduce((a,b)=>a+b,0)/r.montos.length}))
    .sort((a,b)=>b.promedio-a.promedio);

  const deudaTotal = S.deudas.reduce((a,d)=>a+(d.saldo||0),0);
  const pagoMinTotal = S.deudas.reduce((a,d)=>a+(d.pagoMensual||0),0);
  const deudasCalc = S.deudas.map(d=>({...d,...amortizar(d)})).sort((a,b)=>(b.tasaAnual||0)-(a.tasaAnual||0));
  const metasCalc = S.metas.map(m=>{
    const faltan = Math.max(0,(m.objetivo||0)-(m.ahorrado||0));
    const meses = m.fechaLimite? mesesHasta(m.fechaLimite) : null;
    return {...m, faltan, meses, requerido: meses&&meses>0? faltan/meses : null,
      progreso: m.objetivo>0? clamp((m.ahorrado||0)/m.objetivo,0,1) : 0};
  });

  /* Desglose por persona: en un hogar de dos, saber quién aporta y quién gasta
     en qué es la estadística más útil. Se agrupa por el nombre atribuido, y se
     cuenta aparte quién registró cada movimiento (por uid). */
  const porPersona = personasHogar().map(nombre=>{
    const g = gastos.filter(x=>x.miembro===nombre);
    const i = ingresos.filter(x=>x.miembro===nombre);
    const gasto = g.reduce((a,b)=>a+b.monto,0);
    const ingreso = i.reduce((a,b)=>a+b.monto,0);
    const aporte = aportes.filter(x=>x.miembro===nombre).reduce((a,b)=>a+b.monto,0);
    const retiro = retiros.filter(x=>x.miembro===nombre).reduce((a,b)=>a+b.monto,0);
    const credito = g.filter(esCredito).reduce((a,b)=>a+b.monto,0);
    const pagos = delMes.filter(x=>x.tipo==="pago" && x.miembro===nombre).reduce((a,b)=>a+b.monto,0);
    /* Base de ingreso de esta persona: lo suyo registrado frente a lo suyo
       estimado, con el mismo criterio que se aplica al hogar. */
    const arrastre = infoRem.porPersona?.[nombre] || 0;
    const estP = (S.config.ingresosPersona||{})[nombre] || 0;
    const baseP = base==="registrado" ? ingreso
                : base==="estimado"   ? (estP||ingreso)
                : esMesActual         ? Math.max(ingreso,estP)
                : (ingreso>0? ingreso : estP);
    const porCatP = {};
    g.forEach(x=>{ porCatP[x.categoria]=(porCatP[x.categoria]||0)+x.monto; });
    const top = Object.entries(porCatP).sort((a,b)=>b[1]-a[1])[0];
    const registrados = S.movimientos.filter(x=>enPeriodo(x.fecha,mes) && nombreDe(x.uid)===nombre).length;
    return {
      nombre, gasto, ingreso, aporte, retiro, baseP,
      neto:ingreso-gasto,
      arrastre,
      disponible: arrastre + baseP - (gasto-credito) - pagos - aporte + retiro,
      credito, pagos,
      n:g.length, registrados,
      ticket: g.length? gasto/g.length : 0,
      pct: totalGasto>0? gasto/totalGasto : 0,
      prescindible: g.filter(x=>!x.esencial).reduce((a,b)=>a+b.monto,0),
      topCat: top? {cod:top[0], monto:top[1]} : null,
      color: colorPersona(nombre),
    };
  }).filter(p=>p.gasto>0||p.ingreso>0||p.aporte>0||p.baseP>0||p.arrastre!==0).sort((a,b)=>b.gasto-a.gasto);
  const sinAsignar = gastos.filter(x=>!personasHogar().includes(x.miembro)).reduce((a,b)=>a+b.monto,0);
  const restoDisponible = disponible - porPersona.reduce((a,p)=>a+p.disponible,0);
  const saldoCierre = ingresoBase - gastosCaja - pagosTarjeta - totalAporte + totalRetiro;  // sin arrastre

  return {mes,mesAnt,delMes,gastos,ingresos,gastosAnt,totalGasto,totalIngreso,ingresoBase,presupuestoTotal,disponible,
    dias,diaHoy,restantes,esMesActual,ritmoDiario,proyectado,porCat,esenciales,prescindibles,acumulado,historico,porDia,
    gastoAnterior,gastoAnteriorCorte,promedioHistorico,periodosPromedio:basesPromedio.length,variacionAnterior,variacionPromedio,
    gastoFijo,gastoVariable,ritmoVariable,variableRestante,metodoProyeccion,fijosPendientes,detalleFijos,margenRestante,margenTrasFijos,disponibleDiario,
    ingresoRegistrado,ingresoEstimado,baseUsada,porPersona,sinAsignar,restoDisponible,
    aportes,retiros,totalAporte,totalRetiro,cuentasCalc,saldoAhorros,
    comprasCredito,gastosCaja,pagosTarjeta,
    ahorroReal,tasaAhorro,ahorroProyectado,tasaProyectada,remanente,saldoCierre,anclaRem,cierrePropio,declaradoCierre,
    porMetodo:agrupar("metodo"),porMiembro:agrupar("miembro"),topConceptos,ticketGeneral,umbralMicro,micro,microTotal,
    recurrentes,recurrentesNoEsenciales:recurrentes.filter(r=>!CAT[r.cod]?.esencial),
    deudaTotal,pagoMinTotal,deudasCalc,metasCalc};
}

function amortizar(d,extra=0){
  const tasa=(d.tasaAnual||0)/100/12, pago=(d.pagoMensual||0)+extra;
  let saldo=d.saldo||0, interes=0, meses=0;
  if(saldo<=0) return {meses:0,interes:0,viable:true};
  if(pago<=saldo*tasa) return {meses:Infinity,interes:Infinity,viable:false};
  while(saldo>0 && meses<600){ const i=saldo*tasa; interes+=i; saldo=saldo+i-pago; meses++; }
  return {meses,interes,viable:true};
}
const mesesHasta = f=>{
  const [y,m]=f.split("-").map(Number); const hoy=new Date();
  return (y-hoy.getFullYear())*12 + (m-1-hoy.getMonth());
};

/* ==================== motor de recomendaciones ====================
   Cada recomendación lleva un `grupo`, porque varias describen el mismo
   dinero desde ángulos distintos y no se pueden sumar entre sí:
     · presupuesto → excesos por categoría; son dinero distinto: se suman.
     · habitos     → prescindible, compras hormiga, patrón semanal,
                     suscripciones; unas están contenidas en otras: se toma
                     la mayor, nunca la suma.
     · alza        → aumentos contra el mes anterior: se suman.
     · exceso      → avisos de desvío (ritmo, tarjeta que crece). NO son
                     ahorro conseguible: quedan fuera del total.
     · deuda       → intereses, que son cifra anual: quedan fuera del total.
   ================================================================== */
const MODO_GRUPO = {presupuesto:"suma", habitos:"max", alza:"suma"};

function ahorroPotencial(rec,R){
  const acum={};
  rec.filter(r=>r.ahorro>0 && MODO_GRUPO[r.grupo]).forEach(r=>{
    acum[r.grupo] = MODO_GRUPO[r.grupo]==="max"
      ? Math.max(acum[r.grupo]||0, r.ahorro)
      : (acum[r.grupo]||0) + r.ahorro;
  });
  const total = Object.values(acum).reduce((a,b)=>a+b,0);
  // Techo lógico: no se puede ahorrar más que lo prescindible más los excesos.
  const excesos = R.porCat.filter(c=>c.pres>0&&c.total>c.pres).reduce((a,c)=>a+(c.total-c.pres),0);
  return Math.min(total, R.prescindibles + excesos);
}
const cuenta = (n,sing,plur)=>`${n} ${n===1?sing:plur}`;

function recomendar(R){
  const out=[]; const push=o=>out.push({id:uid(),nivel:"info",ahorro:0,...o});
  if(R.gastos.length<3 && S.deudas.length===0 && S.metas.length===0) return out;

  R.porCat.filter(c=>c.pres>0&&c.total>c.pres).sort((a,b)=>(b.total-b.pres)-(a.total-a.pres)).slice(0,3).forEach(c=>{
    const ex=c.total-c.pres;
    const n=Math.ceil(ex/Math.max(c.ticket,1));
    push({nivel:"alto",grupo:"presupuesto",etiqueta:`${c.cod} · presupuesto excedido`,ahorro:ex,
      titulo:`${c.nombre} superó su sobre en ${fmt(ex)}`,
      detalle:`El hogar lleva ${fmt(c.total)} contra un presupuesto de ${fmt(c.pres)} (${Math.round(c.uso*100)}%). Con ${cuenta(c.n,"compra","compras")}, el ticket promedio es ${fmt(c.ticket)}.`,
      accion:`Recortar ${cuenta(n,"compra","compras")} de este tipo al mes devuelve el sobre a su límite.`});
  });

  if(R.esMesActual && R.presupuestoTotal>0 && R.proyectado>R.presupuestoTotal*1.02){
    const ex=R.proyectado-R.presupuestoTotal;
    push({nivel:"alto",grupo:"exceso",etiqueta:"Ritmo de gasto",ahorro:ex,cifra:"exceso proyectado",
      titulo:`Vas camino a cerrar el mes en ${fmt(R.proyectado)}`,
      detalle:`El hogar lleva ${fmt(R.totalGasto)} en ${R.diaHoy} días. Considerando ${fmt(R.variableRestante)} de gasto variable restante`+
        (R.fijosPendientes>0?`, más ${fmt(R.fijosPendientes)} de cargos fijos que aún faltan por pagar,`:"")+
        ` la estimación por ${R.metodoProyeccion} queda ${fmt(ex)} por encima del presupuesto de ${fmt(R.presupuestoTotal)}.`,
      accion: R.margenRestante>0
        ? `Te quedan ${fmt(R.margenRestante)} de margen: son ${fmt(R.disponibleDiario)} por día durante los ${R.restantes} días que faltan.`
        : `Ya no queda margen: el presupuesto está superado en ${fmt(-R.margenRestante)}. A partir de aquí lo realista es contener el exceso, no cumplir el mes; revisa si los sobres están bien dimensionados en Ajustes.`});
  }

  if(R.totalGasto>0){
    const pct=R.prescindibles/R.totalGasto;
    if(pct>0.3){
      const ah=R.prescindibles*0.25;
      push({nivel:"medio",grupo:"habitos",etiqueta:"Composición del gasto",ahorro:ah,
        titulo:`El ${Math.round(pct*100)}% del gasto del hogar es prescindible`,
        detalle:`${fmt(R.prescindibles)} del gasto conjunto fueron a restaurantes, ocio, compras o suscripciones. Por encima del 30% el margen de ahorro está aquí, no en lo esencial.`,
        accion:`Bajar esa bolsa un 25% libera ${fmt(ah)} al mes sin tocar comida, vivienda ni salud.`});
    }
  }

  if(R.micro.length>=6){
    const ah=R.microTotal*0.4;
    push({nivel:"medio",grupo:"habitos",etiqueta:"Compras hormiga",ahorro:ah,
      titulo:`${R.micro.length} compras pequeñas suman ${fmt(R.microTotal)}`,
      detalle:`Gastos no esenciales de menos de ${fmt(R.umbralMicro)} cada uno. Juntos equivalen al ${Math.round(R.microTotal/R.totalGasto*100)}% del gasto del mes.`,
      accion:`Fija un tope semanal en efectivo: recortarlas 40% deja ${fmt(ah)} al mes.`});
  }

  const crecio = R.porCat.filter(c=>c.totalAnt>0&&c.delta>0&&c.variacion>0.25&&c.delta>R.totalGasto*0.03).sort((a,b)=>b.delta-a.delta)[0];
  if(crecio) push({nivel:"medio",grupo:"alza",etiqueta:`${crecio.cod} · en alza`,ahorro:crecio.delta,
    titulo:`${crecio.nombre} subió ${Math.round(crecio.variacion*100)}% respecto al mes pasado`,
    detalle:`Pasó de ${fmt(crecio.totalAnt)} a ${fmt(crecio.total)}, ${fmt(crecio.delta)} más. Es el aumento más grande del presupuesto.`,
    accion:`Volver al nivel del mes anterior recupera ${fmt(crecio.delta)}.`});

  const pres = R.gastos.filter(g=>!g.esencial);
  if(pres.length>=5){
    const totalPres = pres.reduce((a,b)=>a+b.monto,0);
    const top = DIAS.map((d,i)=>({dia:d,total:pres.filter(g=>aDate(g.fecha).getDay()===i).reduce((a,b)=>a+b.monto,0)}))
      .sort((a,b)=>b.total-a.total)[0];
    if(top.total>totalPres*0.28) push({grupo:"habitos",etiqueta:"Patrón semanal",ahorro:top.total*0.3,
      titulo:`Los ${top.dia.toLowerCase()} concentran ${Math.round(top.total/totalPres*100)}% del gasto prescindible`,
      detalle:`Ese día suma ${fmt(top.total)} en salidas, restaurantes y compras. El hábito, no el precio, mueve la cifra.`,
      accion:`Planea ese día con presupuesto cerrado: reducirlo 30% ahorra ${fmt(top.total*0.3)} al mes.`});
  }

  const sus = R.porCat.find(c=>c.cod==="SUS");
  if(sus&&sus.total>0) push({grupo:"habitos",etiqueta:"SUS · suscripciones",ahorro:sus.total*0.3,
    titulo:`El hogar paga ${fmt(sus.total)} al mes en suscripciones`,
    detalle:`Son ${fmt(sus.total*12)} al año en ${cuenta(sus.n,"cargo recurrente","cargos recurrentes")}. Es el gasto que más fácil se olvida y el más rápido de cancelar.`,
    accion:"Revisa cuáles usaste en las últimas dos semanas y cancela el resto; suele sobrar un tercio."});

  /* lo que aparece al cuadrar la caja */
  const fuga = R.porCat.find(c=>c.cod==="NRG");
  if(fuga && fuga.total>0 && R.totalGasto>0){
    const pct = fuga.total/R.totalGasto;
    push({nivel: pct>0.1? "alto":"medio", grupo:"habitos", ahorro:fuga.total*0.5,
      etiqueta:"NRG · gasto sin registrar",
      titulo:`${fmt(fuga.total)} salieron sin quedar registrados`,
      detalle:`Es el ${Math.round(pct*100)}% del gasto del periodo y apareció al cuadrar los saldos reales con los teóricos. Son las compras pequeñas que nadie anota: café, propinas, encargos, efectivo suelto.`,
      accion:"Anota durante dos semanas todo lo que pagues en efectivo, aunque sean cifras mínimas. Lo que se mide se puede recortar; a ciegas, no."});
  }

  /* tarjetas: gastar más de lo que se abona */
  tarjetas().forEach(t=>{
    const compras = comprasDelMes(t.id,R.mes);
    if(compras>0 && compras > (t.pagoMensual||0)*1.05){
      push({nivel:"alto",grupo:"exceso",cifra:"aumenta la deuda",ahorro:compras-(t.pagoMensual||0),
        etiqueta:"Tarjeta en aumento",
        titulo:`${t.nombre} crece: cargas ${fmt(compras)} y pagas ${fmt(t.pagoMensual||0)}`,
        detalle:`Este mes le sumaste ${fmt(compras)} en compras y el pago mensual es de ${fmt(t.pagoMensual||0)}. La diferencia se queda como deuda y empieza a generar intereses al ${t.tasaAnual||0}% anual.`,
        accion:`Para no crecer el saldo tendrías que pagar al menos ${fmt(compras)} este mes, o bajar las compras a crédito en ${fmt(compras-(t.pagoMensual||0))}.`});
    }
  });

  /* intereses rotativos detectados al cuadrar el saldo */
  const interesPeriodo = S.movimientos
    .filter(m=>m.esInteres && enPeriodo(m.fecha,R.mes))
    .reduce((a,b)=>a+b.monto,0);
  if(interesPeriodo>0){
    push({nivel:"alto",grupo:"presupuesto",ahorro:interesPeriodo,
      etiqueta:"Intereses del rotativo",
      titulo:`${fmt(interesPeriodo)} se fueron solo en intereses y cargos`,
      detalle:`Es lo que creció la deuda sin que compraras nada: intereses del rotativo, comisiones y seguros. Al año, a este ritmo, son ${fmt(interesPeriodo*12)}.`,
      accion:"Pagar el total facturado en vez del mínimo elimina este cargo por completo; si no alcanza, prioriza la deuda de tasa más alta."});
  }

  /* deudas */
  if(R.deudasCalc.length){
    const cara = R.deudasCalc[0];
    const otras = R.deudasCalc.slice(1).reduce((a,d)=>a+(d.pagoMensual||0),0);
    if(cara.tasaAnual>0){
      const conExtra = amortizar(cara, Math.max(200, cara.pagoMensual*0.2));
      const ahorroInt = isFinite(cara.interes)&&isFinite(conExtra.interes)? cara.interes-conExtra.interes : 0;
      push({nivel:"alto",etiqueta:"Deudas · avalancha",ahorro:0,
        titulo:`Ataca primero ${cara.nombre}: ${cara.tasaAnual}% anual`,
        detalle: cara.viable
          ? `Al ritmo actual la liquidas en ${cara.meses} meses y pagarás ${fmt(cara.interes)} de intereses. Es la tasa más alta de tus ${R.deudasCalc.length} deudas.`
          : `Tu pago mensual no alcanza a cubrir los intereses: el saldo crecerá cada mes. Sube el pago por encima de ${fmt(cara.saldo*cara.tasaAnual/100/12)}.`,
        accion: ahorroInt>0? `Abonar un 20% extra cada mes te ahorra ${fmt(ahorroInt)} en intereses y adelanta ${cara.meses-conExtra.meses} meses la liquidación.` : "Prioriza cualquier peso extra en esta deuda antes que en las demás."});
    }
    if(R.ingresoBase>0 && R.pagoMinTotal/R.ingresoBase>0.35){
      push({nivel:"alto",etiqueta:"Carga de deuda",
        titulo:`Tus pagos de deuda son el ${Math.round(R.pagoMinTotal/R.ingresoBase*100)}% del ingreso`,
        detalle:`${fmt(R.pagoMinTotal)} al mes sobre un ingreso de ${fmt(R.ingresoBase)}. Por encima del 35% el presupuesto queda sin margen ante cualquier imprevisto.`,
        accion:"Antes de recortar gastos esenciales, consulta reestructurar o consolidar la deuda de tasa más alta."});
    }
  }

  /* metas */
  R.metasCalc.filter(m=>m.requerido>0).sort((a,b)=>b.requerido-a.requerido).slice(0,2).forEach(m=>{
    push({nivel:"info",etiqueta:"Meta de ahorro",
      titulo:`${m.nombre} necesita ${fmt(m.requerido)} al mes`,
      detalle:`Faltan ${fmt(m.faltan)} de ${fmt(m.objetivo)} y quedan ${m.meses} meses. Llevas ${Math.round(m.progreso*100)}% acumulado.`,
      accion:"Programa una transferencia automática el día que entra el ingreso, no al final del mes."});
  });

  const ahorroReal = R.ingresoBase-R.totalGasto;
  if(S.config.metaAhorro>0){
    if(ahorroReal<S.config.metaAhorro){
      push({nivel:"alto",etiqueta:"Meta mensual",
        titulo:`Te faltan ${fmt(S.config.metaAhorro-ahorroReal)} para tu meta de ${fmt(S.config.metaAhorro)}`,
        detalle:`Este mes el saldo es ${fmt(ahorroReal)}. Las acciones de esta lista cubren buena parte de la diferencia.`,
        accion:"Aparta la meta el día que entra el ingreso, no con lo que sobre al final."});
    }else{
      push({nivel:"bien",etiqueta:"Meta cumplida",
        titulo:`Meta alcanzada: ${fmt(ahorroReal)} ahorrados`,
        detalle:`Superaste tu meta de ${fmt(S.config.metaAhorro)} en ${fmt(ahorroReal-S.config.metaAhorro)}.`,
        accion:"Mueve el excedente a una cuenta separada el mismo día para que no se reabsorba."});
    }
  }
  const orden={alto:0,medio:1,info:2,bien:3};
  return out.sort((a,b)=>(orden[a.nivel]-orden[b.nivel])||(b.ahorro-a.ahorro));
}

/* ============================ gráficas SVG ======================== */
function grLinea(datos,{alto=150,ancho=320}={}){
  const max = Math.max(1,...datos.map(d=>Math.max(d.gasto||0,d.limite||0)));
  const px = i=> 24 + i*(ancho-30)/Math.max(1,datos.length-1);
  const py = v=> alto-18-(v/max)*(alto-30);
  const base = alto-18;

  /* Puntos con datos reales. Con uno solo, una polilínea no pinta nada:
     por eso además se marcan los vértices y se rellena el área bajo la
     curva, que es lo que hace visible el gasto en los primeros días del
     periodo, cuando la línea aún está pegada al eje. */
  const reales = datos.map((d,i)=>({...d,i})).filter(d=>d.gasto!=null);
  const conGasto = reales.some(d=>d.gasto>0);
  const ptsGasto = reales.map(d=>`${px(d.i)},${py(d.gasto)}`);
  const area = ptsGasto.length>1
    ? `<polygon points="${px(reales[0].i)},${base} ${ptsGasto.join(" ")} ${px(reales[reales.length-1].i)},${base}"
        fill="var(--tinta)" opacity=".08"/>` : "";
  const lineaGasto = ptsGasto.length>1
    ? `<polyline fill="none" points="${ptsGasto.join(" ")}" stroke="var(--tinta)" stroke-width="2.4"
        stroke-linejoin="round" stroke-linecap="round"/>` : "";
  const vertices = reales.length<=14
    ? reales.map(d=>`<circle cx="${px(d.i)}" cy="${py(d.gasto)}" r="2.4" fill="var(--tinta)"/>`).join("") : "";
  const ultimo = reales.length
    ? `<circle cx="${px(reales[reales.length-1].i)}" cy="${py(reales[reales.length-1].gasto)}" r="4"
        fill="var(--hoja)" stroke="var(--tinta)" stroke-width="2.2"/>` : "";

  const ptsLim = datos.filter(d=>d.limite!=null).map((d,i)=>`${px(i)},${py(d.limite)}`);
  const lineaLim = ptsLim.length>1
    ? `<polyline fill="none" points="${ptsLim.join(" ")}" stroke="var(--margen)" stroke-width="1.4" stroke-dasharray="4 4"/>` : "";

  const ejes = [0,.5,1].map(f=>`<line x1="24" x2="${ancho}" y1="${py(max*f)}" y2="${py(max*f)}" stroke="currentColor" stroke-dasharray="2 4" opacity=".35"/>
    <text x="0" y="${py(max*f)+3}" font-size="8">${corto(max*f)}</text>`).join("");
  const etiquetas = datos.filter((d,i)=>i%5===0).map((d,j)=>`<text x="${px(datos.indexOf(d))}" y="${alto-4}" font-size="8" text-anchor="middle">${d.dia}</text>`).join("");

  return `<svg class="gr" viewBox="0 0 ${ancho} ${alto}">${ejes}${area}${lineaLim}${lineaGasto}${vertices}${ultimo}${etiquetas}</svg>
    <div class="gr-leyenda"><span><i style="background:var(--tinta)"></i>Gasto real</span><span><i style="background:var(--margen)"></i>Presupuesto</span></div>
    ${conGasto? "" : `<p class="nota" style="text-align:center;margin:6px 0 0">Todavía no hay gastos registrados en este periodo.</p>`}`;
}
function grBarras(items,{alto=150,ancho=320,color="var(--azul, #2E6E8E)",series=null}={}){
  const max = Math.max(1,...items.map(i=>series? Math.max(...series.map(s=>i[s.k])) : i.total));
  const n = items.length, w = (ancho-28)/n;
  const py = v=> alto-18-(v/max)*(alto-30);
  const barras = items.map((it,i)=>{
    const x0 = 26+i*w;
    if(series){
      const bw = (w-8)/series.length;
      return series.map((s,j)=>`<rect x="${x0+4+j*bw}" y="${py(it[s.k])}" width="${bw-2}" height="${Math.max(0,alto-18-py(it[s.k]))}" fill="${s.c}"/>`).join("");
    }
    // Si el dato trae color propio —una persona, una categoría— manda ese
    return `<rect x="${x0+4}" y="${py(it.total)}" width="${w-8}" height="${Math.max(0,alto-18-py(it.total))}" fill="${it.color? col(it.color) : color}"/>`;
  }).join("");
  const ejes=[0,.5,1].map(f=>`<line x1="26" x2="${ancho}" y1="${py(max*f)}" y2="${py(max*f)}" stroke="currentColor" stroke-dasharray="2 4" opacity=".35"/>
    <text x="0" y="${py(max*f)+3}" font-size="8">${corto(max*f)}</text>`).join("");
  const et = items.map((it,i)=>`<text x="${26+i*w+w/2}" y="${alto-4}" font-size="8" text-anchor="middle">${esc(it.mes||it.dia||it.nombre||"")}</text>`).join("");
  const leyenda = series? `<div class="gr-leyenda">${series.map(s=>`<span><i style="background:${s.c};height:9px"></i>${s.n}</span>`).join("")}</div>`:"";
  return `<svg class="gr" viewBox="0 0 ${ancho} ${alto}">${ejes}${barras}${et}</svg>${leyenda}`;
}
function grDona(items){
  const total = items.reduce((a,b)=>a+b.total,0)||1;
  const R0=42,R1=68,cx=90,cy=80; let ang=-Math.PI/2;
  const arcos = items.map(it=>{
    const a = it.total/total*Math.PI*2, fin=ang+a;
    const p = (r,t)=>[cx+r*Math.cos(t),cy+r*Math.sin(t)];
    const [x1,y1]=p(R1,ang),[x2,y2]=p(R1,fin),[x3,y3]=p(R0,fin),[x4,y4]=p(R0,ang);
    const big = a>Math.PI?1:0; ang=fin;
    return `<path d="M${x1},${y1} A${R1},${R1} 0 ${big} 1 ${x2},${y2} L${x3},${y3} A${R0},${R0} 0 ${big} 0 ${x4},${y4} Z" fill="${col(it.color)}" stroke="var(--hoja)" stroke-width="1.5"${it.cod?` data-detalle-cat="${it.cod}" class="sector" tabindex="0" role="button"><title>${esc(it.nombre)}</title></path>`:"/>"}`;
  }).join("");
  return `<svg class="gr" viewBox="0 0 180 160" style="max-width:230px;margin:0 auto">${arcos}
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="9" letter-spacing="1">TOTAL</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="12" fill="#16241C">${corto(total)}</text></svg>`;
}
const corto = v=>{ const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(1)+"M"; if(a>=1e3) return Math.round(v/1e3)+"k"; return Math.round(v); };

/* En la barra lateral cabe el nombre completo: las abreviaturas venían de
   la antigua barra inferior, donde el espacio se repartía entre siete. */
const NAV = [["resumen","Resumen"],["panel","Panel"],["movimientos","Movimientos"],["estadisticas","Estadísticas"],
             ["deudas","Deudas"],["metas","Metas"],["ahorro","Ahorro"],["ajustes","Ajustes"]];

/* La cabecera tiene una o dos filas según el ancho: se mide su alto real
   para reservar justo ese hueco bajo ella. */
function ajustarCabecera(){
  const cab = $("header"); if(!cab) return;
  document.documentElement.style.setProperty("--alto-cab", cab.offsetHeight+"px");
}

function render(){
  if($("#app").classList.contains("oculto")) return;
  sincronizarCategorias();
  const R = calcular();
  $("#mes-txt").innerHTML = `<span class="mes-largo">${esc(etiquetaPeriodo(S.mes))}</span>`
    + `<span class="mes-corto">${esc(etiquetaPeriodoCorta(S.mes))}</span>`;
  $("#sub-hogar").textContent = S.modo==="nube"
    ? (S.nombreHogar || "Mi hogar")
    : "Modo local · sin sincronizar";
  $("#punto").className = "punto"+(S.modo==="local"?" local":"");
  $("#estado-txt").textContent = S.modo==="nube"? "en línea":"local";
  $("#nav").innerHTML = NAV.map(([k,t])=>`<button data-vista="${k}" class="${S.vista===k?"activo":""}">${t}</button>`).join("");
  const v = $("#vista");
  const vacio = S.movimientos.length===0 && S.deudas.length===0 && S.metas.length===0;

    resumen:vResumen, panel:vPanel, movimientos:vMovimientos, estadisticas:vEstadisticas,
    deudas:vDeudas, metas:vMetas, ahorro:vAhorro, ajustes:vAjustes
  }[S.vista]||vPanel)(R);
  conectar(R);
  ajustarCabecera();
  revisarAlertas(R);
}
