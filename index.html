<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16241C" id="meta-tema">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<title>Presupuesto familiar</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./iconos/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./iconos/apple-touch-icon.png">
<script>
  /* Tema y tipografía antes de pintar, para que no haya parpadeo al abrir */
  try {
    document.documentElement.dataset.tema = localStorage.getItem("pf-tema") || "papel";
    document.documentElement.dataset.tipo = localStorage.getItem("pf-tipo") || "inter";
  } catch (e) {
    document.documentElement.dataset.tema = "papel";
    document.documentElement.dataset.tipo = "inter";
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ancho-lateral:232px;
  /* Tipografía: se elige en Ajustes y se guarda por dispositivo */
  --tipo-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tipo-titulo:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tipo-num:'IBM Plex Mono',ui-monospace,monospace;
  --azul:#2E6E8E;
  --papel:#E4E9DD; --hoja:#FBFCF9; --tinta:#16241C; --suave:#5B6B60;
  --rayado:#D3DBCB; --margen:#9E3B2E; --verde:#3F7D58; --ambar:#C7913A;
  --azul:#2E6E8E; --borde:#C9D2C0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
body{
  font-family:var(--tipo-ui);color:var(--tinta);background:var(--papel);
  background-image:repeating-linear-gradient(to bottom,transparent 0 27px,rgba(107,128,110,.12) 27px 28px);
  min-height:100vh;padding-top:var(--alto-cab,108px);
  padding-bottom:calc(34px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--tipo-titulo);letter-spacing:-.02em;margin:0}
.oculto{display:none!important}
.mono{font-family:var(--tipo-num);font-variant-numeric:tabular-nums}
.rojo{color:var(--margen)!important}.verde{color:var(--verde)!important}.ambar{color:var(--ambar)!important}

/* ---------------- cabecera ---------------- */
/* Fija, no pegajosa: con overflow-x:hidden en body, position:sticky deja de
   anclarse al viewport en varios navegadores móviles y la cabecera se va con
   el scroll, dejando el menú fuera de alcance. */
header{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--tinta);color:var(--papel);
  padding:calc(12px + env(safe-area-inset-top)) 18px 12px;border-bottom:3px solid var(--margen)}
.marca{display:flex;align-items:center;gap:11px}
.logo{font-family:var(--tipo-num);font-weight:600;font-size:15px;border:1.5px solid var(--papel);
  border-radius:2px;padding:3px 6px}
header h1{font-weight:800;font-size:19px;line-height:1.1}
header .sub{display:block;margin:2px 0 0;padding:0;background:none;border:none;text-align:left;
  font-family:inherit;font-size:11px;color:#A8B8A6;letter-spacing:.09em;text-transform:uppercase;
  cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sub:hover{color:var(--papel);text-decoration:underline;text-underline-offset:3px}
.barra-mes{display:flex;align-items:center;gap:8px;margin-top:12px;
  border-top:1px solid rgba(228,233,221,.22);padding-top:9px}
.mes-txt{flex:1;min-width:0;text-align:center;font-family:var(--tipo-num);font-size:13.5px;
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mes-corto{display:none}
@media(max-width:560px){
  .mes-largo{display:none}
  .mes-corto{display:inline}
}
header .marca>div{min-width:0}
.icono{background:none;border:1px solid rgba(228,233,221,.35);color:inherit;width:30px;height:30px;
  border-radius:2px;font-size:17px;line-height:1;cursor:pointer}
.icono:hover{background:rgba(228,233,221,.12)}
.clima{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid rgba(228,233,221,.35);
  color:inherit;border-radius:2px;padding:3px 7px 3px 5px;cursor:pointer;line-height:1;flex:none;
  --sol:#E8B84B; --nube:#C7D0C6; --agua:#7FB2D9; --rayo:#E8B84B}
.clima b{font-family:var(--tipo-num);font-size:12.5px;font-weight:500}
.clima:hover{background:rgba(228,233,221,.12)}
.clima.apagado{opacity:.55}
.clima.viejo b{opacity:.7}
.clima.viejo::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.5;margin-left:1px}
.ico-clima{display:block;flex:none}
.chip-lugar{max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;opacity:.85;letter-spacing:.01em}
.cl-gps{font-style:normal;font-family:var(--tipo-num);font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;border:1px solid var(--borde);border-radius:999px;padding:1px 6px;margin-left:4px}
.chip-viento{display:inline-flex;align-items:center;gap:2px;margin-left:5px;padding-left:6px;
  border-left:1px solid rgba(228,233,221,.3);line-height:1}
.chip-viento b{font-size:11px}
/* Escala de viento: los mismos colores en el chip y en el pronóstico */
.v-calma{color:var(--suave)}
.v-brisa{color:var(--verde)}
.v-moderado{color:var(--ambar)}
.v-fuerte{color:var(--margen)}
.v-temporal{color:var(--hoja);background:var(--margen);border-radius:2px;padding:1px 4px}
.clima .v-calma{color:#B9C4BB}
.clima .v-brisa{color:#7BC48F}
.clima .v-moderado{color:#E8B84B}
.clima .v-fuerte{color:#E8836B}
.clima .v-temporal{color:#fff;background:#C0392B}
.cd-viento{display:flex;align-items:center;gap:3px;justify-content:flex-end}
.cd-viento svg{flex:none}
.leyenda-viento{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;padding-top:11px;
  border-top:1px dotted var(--rayado);font-family:var(--tipo-num);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase}
.leyenda-viento span{display:inline-flex;align-items:center;gap:4px}

.clima-lugares{margin-bottom:14px}
.clima-lugares .borrar{font-size:14px;margin-left:2px;color:inherit;opacity:.6}
.clima-cab{display:flex;align-items:center;gap:14px;padding:4px 0 14px;
  --sol:#E8B84B; --nube:#9FB0A0; --agua:#4E8CBF; --rayo:#D9A21B}
.clima-cab b{display:block;font-family:var(--tipo-num);font-size:30px;font-weight:500;line-height:1}
.clima-cab span{font-size:12.5px;color:var(--suave)}
.cl-edad{display:block;font-style:normal;font-family:var(--tipo-num);font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;margin-top:2px;opacity:.8}
.clima-dias{--sol:#E8B84B; --nube:#9FB0A0; --agua:#4E8CBF; --rayo:#D9A21B;
  border-top:1px solid var(--rayado)}
.clima-dia{display:grid;grid-template-columns:34px 24px 1fr 74px 60px;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px dotted var(--rayado);font-size:12.5px}
.cd-nombre{font-family:var(--tipo-num);font-size:11px;text-transform:uppercase;color:var(--suave)}
.cd-temp{font-family:var(--tipo-num);white-space:nowrap}
.cd-temp b{font-weight:500}
.cd-temp em{font-style:normal;color:var(--suave);margin-left:5px}
.cd-lluvia{display:flex;align-items:center;gap:5px;font-family:var(--tipo-num);font-size:11px;color:var(--suave);justify-content:flex-end;white-space:nowrap}
.cd-barra{display:inline-flex;align-items:flex-end;width:6px;height:18px;background:var(--papel);
  border:1px solid var(--rayado);border-radius:1px;overflow:hidden}
.cd-barra i{display:block;width:100%;background:var(--agua)}
.cd-viento{font-family:var(--tipo-num);font-size:11px;color:var(--suave);text-align:right}
.cl-lista{list-style:none;margin:10px 0 0;padding:0}
.cl-lista li{padding:10px 2px;border-bottom:1px dotted var(--rayado);cursor:pointer}
.cl-lista li:hover{background:var(--papel)}
.cl-lista b{display:block;font-size:13.5px;font-weight:500}
.cl-lista span{font-size:11.5px;color:var(--suave)}
@media(max-width:430px){
  .estado-conn span{display:none}
  .chip-lugar{max-width:70px}
  .barra-mes{gap:6px}
  .mes-txt{font-size:12px;letter-spacing:.03em}
  .clima-dia{grid-template-columns:30px 22px 1fr 68px 54px;gap:6px;font-size:12px}
  .cd-lluvia,.cd-viento{font-size:10.5px}
}
.estado-conn{font-family:var(--tipo-num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#A8B8A6;display:flex;align-items:center;gap:6px}
.punto{width:7px;height:7px;border-radius:50%;background:var(--verde);display:inline-block}
.punto.local{background:var(--ambar)}.punto.error{background:var(--margen)}

main{max-width:840px;margin:0 auto;padding:16px 14px 8px;display:flex;flex-direction:column;gap:14px;
  min-width:0;width:100%}

/* ---------------- tarjetas ---------------- */
.tarjeta{background:var(--hoja);border:1px solid var(--borde);border-radius:3px;padding:16px 15px;min-width:0;
  box-shadow:0 1px 0 rgba(22,36,28,.05)}
.cab{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.cab h2{font-weight:700;font-size:15.5px}
.cod{font-family:var(--tipo-num);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--suave)}
.nota{font-size:13.5px;color:var(--suave);margin:0 0 10px;line-height:1.5}
.enlace{background:none;border:none;color:var(--margen);font-family:var(--tipo-ui);font-size:12.5px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}

/* ---------------- cinta de sumadora ---------------- */
.cinta{--z:11px;background:var(--hoja);border:1px solid var(--borde);border-bottom:none;
  padding:15px 17px calc(var(--z) + 14px);font-family:var(--tipo-num);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--z)) no-repeat,
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/17px 100% repeat-x;
  mask:linear-gradient(#000 0 0) top/100% calc(100% - var(--z)) no-repeat,
    conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/17px 100% repeat-x}
.cinta-cab{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--suave);padding-bottom:11px;border-bottom:1px solid var(--rayado);margin-bottom:11px}
.renglon{display:flex;align-items:baseline;gap:7px;font-size:13px;padding:3.5px 0}
.renglon i{flex:1;border-bottom:1px dotted var(--rayado)}
.renglon b{font-weight:500;font-variant-numeric:tabular-nums}
.renglon.tenue{color:var(--suave)}
.marca-base{font-style:normal;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--borde);border-radius:2px;padding:1px 4px;margin-left:6px;vertical-align:1px}
.cinta-total{display:flex;align-items:baseline;justify-content:space-between;margin-top:11px;padding-top:11px;
  border-top:2px solid var(--tinta)}
.cinta-total span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase}
.cinta-total strong{font-family:var(--tipo-titulo);font-size:31px;font-weight:800;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.cinta-pie{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px;padding-top:11px;
  border-top:1px dotted var(--rayado)}
.cinta-pie em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--suave);margin-bottom:3px}
.cinta-pie b{font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.reserva{display:block;font-style:normal;font-size:9.5px;color:var(--suave);margin-top:3px;line-height:1.3}
.desglose .tenue{opacity:.55}

/* ---------------- sobres y barras ---------------- */
.sobres{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.sobre-cab{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;padding:3px 2px;border-radius:3px}
.flecha{color:var(--suave);font-size:11px;flex:none;line-height:1}
.desglose-sobre{margin-top:11px;padding-top:11px;border-top:1px dotted var(--rayado);animation:abrir .18s ease-out}
@keyframes abrir{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.sub-cab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;
  font-family:var(--tipo-num);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--suave)}
.subs{list-style:none;margin:0 0 4px;padding:0;display:flex;flex-direction:column;gap:8px}
.sub-fila{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px;font-size:12.5px}
.sub-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-nom.tenue{color:var(--suave);font-style:italic}
.sub-monto{font-family:var(--tipo-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub-monto em{font-style:normal;font-size:10px;color:var(--suave);margin-left:6px}
.ver-mas{display:block;margin:14px auto 0;text-align:center}
.opcional{font-style:normal;text-transform:none;letter-spacing:0;color:var(--suave);font-size:9.5px}
.fila-sub{display:flex;gap:8px;align-items:center}
.fila-sub select{flex:1;min-width:0}
.fila-sub .btn{flex:none;white-space:nowrap}
#m-sub-input{margin-top:8px}
.btn-sub{background:none;border:1px solid var(--rayado);border-radius:2px;color:var(--suave);
  font-family:var(--tipo-num);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 6px;margin-left:6px;cursor:pointer;vertical-align:1px}
.btn-sub:hover{border-color:var(--tinta);color:var(--tinta)}
.etq-sub{font-style:normal;font-family:var(--tipo-num);font-size:9.5px;letter-spacing:.06em;color:var(--suave);
  border:1px solid var(--rayado);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:1px}

.sobre-nom{flex:1;font-size:13.5px;font-weight:500}
.sobre-cifra{font-family:var(--tipo-num);font-size:13px;font-variant-numeric:tabular-nums}
.barra{height:9px;background:var(--papel);border:1px solid var(--rayado);border-radius:1px;overflow:hidden}
.barra.fina{height:6px}
.fill{height:100%;background:var(--verde);transition:width .35s ease}
.fill.ambar{background:var(--ambar)}.fill.rojo{background:var(--margen)}
.sobre-pie{display:flex;justify-content:space-between;font-family:var(--tipo-num);font-size:10.5px;
  color:var(--suave);margin-top:4px}
.split{display:flex;height:16px;border:1px solid var(--rayado);border-radius:2px;overflow:hidden}
.split .e{background:var(--verde)}.split .p{background:var(--ambar)}
.leyenda{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12.5px;color:var(--suave)}
.leyenda i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px}
.leyenda b{font-family:var(--tipo-num);color:var(--tinta);margin-left:5px}
.split [data-detalle-naturaleza],.leyenda [data-detalle-naturaleza]{cursor:pointer}
.leyenda [data-detalle-naturaleza]{padding:5px 7px;margin:-5px -7px;border-radius:4px}
.leyenda [data-detalle-naturaleza]:hover,.leyenda [data-detalle-naturaleza]:focus-visible{background:var(--papel);color:var(--tinta);outline:none}
.split [data-detalle-naturaleza]:focus-visible{outline:2px solid var(--tinta);outline-offset:-3px}

/* ---------------- libro de movimientos ---------------- */
.filtros{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.libro{border-left:2px solid var(--margen);padding-left:12px}
.dia{margin-bottom:15px}
.dia-cab{display:flex;justify-content:space-between;font-family:var(--tipo-num);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--suave);padding-bottom:5px;border-bottom:1px solid var(--rayado)}
.mov{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--rayado);
  cursor:pointer;transition:background .15s}
.mov:hover,.mov:focus-visible{background:var(--papel)}
.lapiz{font-size:13px;color:#A3AC9C;flex:none;opacity:0;transition:opacity .15s}
.mov:hover .lapiz,.mov:focus-visible .lapiz{opacity:1}
@media(hover:none){.lapiz{opacity:.55}}
.pie-modal{margin-top:8px;padding-top:14px;border-top:1px dotted var(--rayado)}
.pie-modal .empuje{flex:1}
.aviso-credito{background:var(--papel);border-left:3px solid var(--ambar);padding:9px 11px;border-radius:2px;
  margin:-4px 0 13px;font-size:12.5px;line-height:1.5}
.migaja{font-family:var(--tipo-num);font-size:11px;margin-bottom:14px}
.mov-txt{flex:1;min-width:0}
.mov-txt b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-txt small{font-size:11px;color:var(--suave)}
.mov-monto{font-family:var(--tipo-num);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.borrar{background:none;border:none;color:#A3AC9C;font-size:17px;line-height:1;cursor:pointer;padding:0 2px}
.borrar:hover{color:var(--margen)}

/* ---------------- tablas, listas, métricas ---------------- */
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;table-layout:auto}
th{font-family:var(--tipo-num);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave);
  text-align:left;font-weight:500;padding:0 7px 7px 0;border-bottom:1px solid var(--rayado)}
td{padding:7px 7px 7px 0;border-bottom:1px dotted var(--rayado);overflow-wrap:anywhere}
td:last-child,th:last-child{padding-right:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.num{font-family:var(--tipo-num);font-variant-numeric:tabular-nums}

/* En pantallas estrechas la tabla deja de ser rejilla: cada fila pasa a ser
   un bloque con su título y sus datos etiquetados, sin desbordar a lo ancho. */
@media(max-width:620px){
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp thead{display:none}
  table.resp{margin-top:4px}
  table.resp tr{padding:11px 0;border-bottom:1px solid var(--rayado)}
  table.resp tr:last-child{border-bottom:none}
  table.resp td{border:none;padding:3px 0;display:flex;justify-content:space-between;
    align-items:baseline;gap:14px;text-align:right}
  table.resp td::before{content:attr(data-etq);font-family:var(--tipo-num);font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--suave);text-align:left;flex:none}
  table.resp td.principal{display:block;text-align:left;font-size:14px;font-weight:500;
    padding:0 0 6px;line-height:1.3}
  table.resp td.principal::before{content:none}
  table.resp td:empty{display:none}
}
.metricas{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:14px;padding-top:13px;
  border-top:1px dotted var(--rayado)}
.metricas em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--suave)}
.metricas b{font-family:var(--tipo-num);font-size:16px;font-weight:500}
.metricas small{display:block;margin-top:2px;color:var(--suave);font-size:10px}
.lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.lista-cab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.lista-cab b{font-family:var(--tipo-num);font-weight:500}
.dos{display:grid;gap:22px}
svg.gr{width:100%;height:auto;display:block;overflow:visible;color:var(--rayado)}
.gr text{font-family:var(--tipo-num);fill:var(--suave)}
.gr-leyenda{display:flex;gap:16px;justify-content:center;font-size:11.5px;color:var(--suave);margin-top:6px}
.gr-leyenda i{display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle}

/* ---------------- consejos ---------------- */
.consejo{border-left:3px solid var(--rayado);padding-left:13px}
.consejo.alto{border-color:var(--margen)}.consejo.medio{border-color:var(--ambar)}
.consejo.info{border-color:var(--azul)}.consejo.bien{border-color:var(--verde)}
.consejo-cab{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:7px}
.etiqueta{font-family:var(--tipo-num);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--suave)}
.chip-ahorro{font-family:var(--tipo-num);font-size:10.5px;background:var(--papel);border:1px solid var(--borde);
  border-radius:2px;padding:2px 7px}
.chip-ahorro.alerta{border-color:var(--margen);color:var(--margen)}
.desglose{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:11px;padding-top:10px;
  border-top:1px dotted var(--rayado);font-size:10.5px;color:var(--suave);align-items:baseline}
.desglose b{font-weight:500;color:var(--tinta);margin-left:4px}
.desglose .total{margin-left:auto;font-size:11.5px;color:var(--tinta);font-weight:500}
.desglose .clicable{border-radius:3px;padding:1px 3px;margin:-1px -3px}
.consejo h3{font-size:16px;font-weight:700;margin:0 0 6px;line-height:1.25}
.consejo p{margin:0;font-size:13.5px;line-height:1.55;color:#374A3D}
.accion{margin-top:7px!important;font-weight:500;color:var(--tinta)!important}
.destacado em{display:block;font-style:normal;font-family:var(--tipo-num);font-size:10.5px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.destacado strong{display:block;font-family:var(--tipo-titulo);font-size:34px;font-weight:800;
  letter-spacing:-.03em;margin:5px 0 3px;color:var(--verde)}
.destacado>span{font-size:12.5px;color:var(--suave)}

/* ---------------- formularios ---------------- */
label.campo{display:block;margin-bottom:13px}
label.campo>span,.campo-tit{display:block;font-family:var(--tipo-num);font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--suave);margin-bottom:6px}
.campos-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;background:var(--hoja);border:1px solid var(--borde);border-radius:2px;
  padding:10px 11px;font-family:var(--tipo-ui);font-size:14.5px;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--tinta);outline-offset:1px}
input.grande{font-family:var(--tipo-num);font-size:29px;font-weight:500;padding:11px}
input.mini{width:104px;text-align:right;font-family:var(--tipo-num);padding:7px 9px;font-size:13px}
textarea.csv{height:130px;font-family:var(--tipo-num);font-size:11px;white-space:pre}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:13px}
.check input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--hoja);border:1px solid var(--borde);border-radius:2px;
  padding:6px 9px;font-family:var(--tipo-ui);font-size:12px;color:var(--suave);cursor:pointer}
.chip b{font-family:var(--tipo-num);font-size:10.5px}
.chip.activo{border-width:1.5px;background:var(--papel);font-weight:500;color:var(--tinta)}
.btn{background:var(--hoja);border:1px solid var(--tinta);border-radius:2px;padding:11px 15px;font-family:var(--tipo-ui);
  font-size:13.5px;font-weight:500;color:var(--tinta);cursor:pointer;width:auto}
.btn:hover{background:var(--papel)}
.btn.primario{background:var(--tinta);color:var(--hoja)}
.btn.primario:hover{background:#0E1913}
.btn.peligro{border-color:var(--margen);color:var(--margen)}
.btn.mini{padding:6px 10px;font-size:12px}
.fila-btns{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:6px}
.fila-btns input{flex:1;min-width:130px}
.error{color:var(--margen);font-size:13px;margin:0 0 10px}
.pres{list-style:none;margin:0 0 14px;padding:0}
.pres li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dotted var(--rayado)}
.pres-nom{flex:1;font-size:13.5px}
.tono{width:34px;height:34px;border:2px solid transparent;border-radius:3px;cursor:pointer;padding:0;
  box-shadow:inset 0 0 0 1px rgba(22,36,28,.15)}
.tono.activo{border-color:var(--tinta);transform:scale(1.06)}
.lapiz-cat{background:none;border:none;color:#A3AC9C;font-size:12px;cursor:pointer;padding:0 4px}
.lapiz-cat:hover{color:var(--margen)}
.marca-fija{font-family:var(--tipo-num);font-style:normal;font-size:9px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--suave);border:1px solid var(--rayado);border-radius:2px;padding:1px 4px;margin-left:5px}
.total-ing{border-bottom:none!important;padding-top:11px!important;
  border-top:1px solid var(--rayado)!important;font-weight:600}
.total-ing b{font-family:var(--tipo-num);font-size:14px}
.balanza{margin-top:16px}
.balanza-barra{height:14px;background:var(--verde);border:1px solid var(--borde);border-radius:2px;overflow:hidden}
.balanza-barra span{display:block;height:100%;background:var(--margen)}
.balanza-pie{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--suave)}
.balanza-pie b{font-family:var(--tipo-num);margin-left:5px}
.ayuda{font-size:11.5px;margin:7px 0 0;line-height:1.45}
.mini-select{width:auto;min-width:104px;flex:none}
input.importe{font-family:var(--tipo-num);font-variant-numeric:tabular-nums;text-align:right}
input.grande.importe{text-align:left}
.composicion{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:11px;padding-top:10px;
  border-top:1px dotted var(--rayado);font-size:11.5px;color:var(--suave)}
.composicion span{display:inline-flex;align-items:center;gap:5px;padding:2px 4px;border-radius:3px}
.composicion i{width:8px;height:8px;border-radius:50%;flex:none}
.composicion b{font-family:var(--tipo-num);color:var(--tinta);margin-left:3px}
.toggle.tres button{font-size:13px;padding:10px 4px}
.cuentas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:15px}
.cuentas>li{padding-bottom:14px;border-bottom:1px dotted var(--rayado)}
.cuentas>li:last-child{border-bottom:none;padding-bottom:0}
.cuenta-cab{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.cuenta-nom{flex:1;font-size:14.5px;font-weight:600}
.cuenta-saldo{font-family:var(--tipo-num);font-size:15px;font-variant-numeric:tabular-nums}
.cierre{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:18px}
.cierre>li{padding-bottom:16px;border-bottom:1px dotted var(--rayado)}
.cierre>li:last-child{border-bottom:none;padding-bottom:0}
.cierre-cab{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.cierre-nom{font-size:15px;font-weight:600}
.cierre-linea{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-size:12.5px;color:var(--suave);padding:3px 0}
.cierre-linea b{font-family:var(--tipo-num);font-weight:500;color:var(--tinta)}
.cierre-linea input.mini{width:118px;padding:5px 8px;font-size:12.5px;flex:none}
.cierre-linea.total{border-top:1px solid var(--rayado);margin-top:5px;padding-top:7px;color:var(--tinta);font-weight:500}
.cierre-dif{font-size:12px;margin:0;padding:7px 9px;border-radius:2px;background:var(--papel);
  border-left:3px solid var(--rayado);color:var(--suave)}
.cierre-dif.ok{border-left-color:var(--verde);color:var(--verde)}
.cierre-dif.menos{border-left-color:var(--margen);color:var(--margen)}
.cierre-dif.mas{border-left-color:var(--ambar);color:var(--ambar)}
.cierre-resumen{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.cierre-resumen li{display:flex;align-items:center;gap:8px;font-size:13px}
.cierre-resumen b{margin-left:auto;font-family:var(--tipo-num);font-weight:500}
.cierre-resumen em{font-style:normal;font-family:var(--tipo-num);font-size:11px;min-width:72px;text-align:right}
.nota-cuadrado{font-size:11px;margin:9px 0 0;line-height:1.45;color:var(--suave)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpis.dos-col{margin-top:14px}
.kpi{border:1px solid var(--borde);border-radius:6px;padding:11px 12px;background:var(--papel)}
.kpi em{display:block;font-style:normal;font-family:var(--tipo-num);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--suave);margin-bottom:5px}
.kpi b{display:block;font-family:var(--tipo-num);font-size:19px;font-weight:500;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{display:block;font-size:11px;color:var(--suave);margin-top:5px;line-height:1.35}
.kpi-barra{height:4px;background:var(--rayado);border-radius:999px;overflow:hidden;margin-top:8px}
.kpi-barra i{display:block;height:100%;background:var(--verde);border-radius:999px}
.kpi.bueno b{color:var(--verde)}
.kpi.medio b{color:var(--ambar)}
.kpi.medio .kpi-barra i{background:var(--ambar)}
.kpi.malo b{color:var(--margen)}
.kpi.malo .kpi-barra i{background:var(--margen)}
/* Siempre dos de ancho: seis KPI en tres filas caben incluso en 360px */
@media(max-width:380px){
  .kpi{padding:9px 10px}
  .kpi b{font-size:16px}
  .kpi em{font-size:9px;letter-spacing:.06em}
  .kpi span{font-size:10.5px}
}
.clicable{cursor:pointer;transition:background .15s}
.clicable:hover,.clicable:focus-visible{background:var(--papel)}
tr.clicable td{transition:background .15s}
.lupa{float:right;color:var(--suave);font-size:15px;line-height:1;opacity:.6}
.sector{cursor:pointer;transition:opacity .15s}
.sector:hover{opacity:.75}
.sub-hoja{margin:3px 0 0;font-family:var(--tipo-num);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--suave)}
.detalle-lista{margin-top:14px;border-top:1px solid var(--rayado);max-height:46vh;overflow-y:auto}
.detalle-fila{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px dotted var(--rayado);
  cursor:pointer;transition:background .15s}
.detalle-fila:hover,.detalle-fila:focus-visible{background:var(--papel)}
.detalle-fecha{flex:none;width:34px;text-align:center;font-family:var(--tipo-num);line-height:1.1}
.detalle-fecha b{display:block;font-size:15px;font-weight:500}
.detalle-fecha em{font-style:normal;font-size:9.5px;text-transform:uppercase;color:var(--suave)}
.detalle-txt{flex:1;min-width:0}
.detalle-txt b{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detalle-txt small{font-size:11px;color:var(--suave)}
.detalle-monto{font-family:var(--tipo-num);font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.reparto-personas{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:11px;
  border-top:1px dotted var(--rayado);font-size:12px;color:var(--suave)}
.reparto-personas i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.reparto-personas b{font-family:var(--tipo-num);color:var(--tinta);margin-left:6px}
.reparto-personas em{font-style:normal;margin-left:5px}
.firma{font-size:11.5px;margin:-4px 0 13px;color:var(--suave)}
.filtro-personas{margin:-6px 0 14px}
.quien{font-weight:600}
.personas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.personas>li{padding-bottom:14px;border-bottom:1px dotted var(--rayado)}
.personas>li:last-child{border-bottom:none;padding-bottom:0}
.persona-cab{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.punto-p{width:11px;height:11px;border-radius:50%;flex:none}
.persona-nom{flex:1;font-size:15px;font-weight:600}
.persona-cifra{font-family:var(--tipo-num);font-size:15px;font-variant-numeric:tabular-nums}
.persona-cifra em{font-style:normal;font-size:11px;color:var(--suave);margin-left:7px}
.persona-datos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px}
.persona-datos em{display:block;font-style:normal;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--suave);margin-bottom:2px}
.persona-datos b{font-family:var(--tipo-num);font-size:13px;font-weight:500}
.persona-pie{font-size:11px;color:var(--suave);margin:9px 0 0}
.persona-suelta{font-size:12.5px;color:var(--suave)}
@media(max-width:420px){.persona-datos{grid-template-columns:repeat(2,1fr)}}

/* ---------------- modal ---------------- */
.modal{position:fixed;inset:0;background:rgba(22,36,28,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--hoja);border-top:3px solid var(--margen);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  padding:18px 16px calc(26px + env(safe-area-inset-bottom));border-radius:4px 4px 0 0;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
.hoja-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.hoja-cab h2{font-size:17px;font-weight:700}
.hoja .icono{border-color:var(--borde);color:var(--tinta)}
.cerrar-modal{width:36px;height:36px;font-size:16px;font-weight:600;border-width:1.5px;flex:none}
.cerrar-modal:hover{background:var(--margen);border-color:var(--margen);color:var(--hoja)}
html[data-tema="claro"] .cerrar-modal{border-width:2px}
.toggle{display:flex;border:1px solid var(--tinta);border-radius:2px;overflow:hidden;margin-bottom:16px}
.toggle button{flex:1;background:none;border:none;padding:10px;font-family:var(--tipo-ui);font-size:13.5px;
  cursor:pointer;color:var(--tinta)}
.toggle button.activo{background:var(--tinta);color:var(--hoja);font-weight:600}

/* ---------------- navegación ---------------- */
/* Barra lateral: fija en pantallas anchas, cajón deslizante en el móvil */
nav{position:fixed;top:0;left:0;bottom:0;width:var(--ancho-lateral);z-index:46;display:flex;flex-direction:column;
  background:var(--tinta);overflow-y:auto;scrollbar-width:none;
  padding:calc(14px + env(safe-area-inset-top)) 0 calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-100%);transition:transform .24s ease;box-shadow:2px 0 16px rgba(22,36,28,.25)}
nav::-webkit-scrollbar{display:none}
body.menu-abierto nav{transform:none}
nav::before{content:"Presupuesto familiar";display:block;padding:6px 20px 16px;color:#93A594;
  font-family:var(--tipo-num);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
nav button{width:100%;text-align:left;background:none;border:none;color:#93A594;padding:14px 20px;cursor:pointer;
  font-family:var(--tipo-num);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  border-left:3px solid transparent;transition:background .15s,color .15s}
nav button:hover{background:rgba(228,233,221,.07);color:var(--papel)}
nav button.activo{color:var(--papel);border-left-color:var(--margen);background:rgba(228,233,221,.09)}
.velo{position:fixed;inset:0;z-index:45;background:rgba(22,36,28,.55);
  opacity:0;transition:opacity .24s ease;pointer-events:none}
body.menu-abierto .velo{opacity:1;pointer-events:auto}
.fab{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:31;width:54px;height:54px;
  border-radius:50%;background:var(--margen);color:#FBFCF9;border:none;font-size:29px;line-height:1;cursor:pointer;
  box-shadow:0 4px 14px rgba(22,36,28,.28);transition:transform .25s ease,opacity .25s ease}
.fab.recogido{transform:translateY(96px);opacity:0}
.aviso{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;
  background:var(--tinta);color:var(--papel);padding:9px 15px;border-radius:2px;font-family:var(--tipo-num);font-size:12px}

/* ---------------- acceso ---------------- */
.acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.acceso .tarjeta{max-width:420px;width:100%}
.acceso h2{font-size:22px;margin-bottom:6px}
.codigo-hogar{font-family:var(--tipo-num);font-size:22px;letter-spacing:.22em;background:var(--papel);
  border:1px dashed var(--borde);padding:12px;text-align:center;border-radius:2px;margin:10px 0}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px}
.btn-google svg{flex:none}
.separador{display:flex;align-items:center;gap:10px;margin:16px 0;font-family:var(--tipo-num);
  font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--suave)}
.separador::before,.separador::after{content:"";flex:1;border-top:1px dotted var(--rayado)}
.paleta{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:13px;border-top:1px dotted var(--rayado)}
.muestra{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--suave);min-width:62px}
.muestra i{display:block;height:26px;border-radius:3px;border:1px solid var(--borde)}
.muestra b{font-family:var(--tipo-num);font-size:9.5px;font-weight:500;color:var(--tinta)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--margen);outline-offset:2px}
@media(min-width:960px){
  body{padding-left:var(--ancho-lateral)}
  header{left:var(--ancho-lateral)}
  nav{transform:none;box-shadow:none}
  .velo{display:none}
  #btn-menu{display:none}
  .marca-agua{left:var(--ancho-lateral)}
  .fab{right:calc((100vw - var(--ancho-lateral) - 840px)/2 + 16px)}
}
@media(min-width:640px){
  main{padding:20px 18px 8px}
  .metricas{grid-template-columns:repeat(4,1fr)}
  .dos{grid-template-columns:1fr 1fr;gap:26px}
  .sobres{display:grid;grid-template-columns:1fr 1fr;gap:15px 22px}

}
@media(max-width:420px){
  header h1{font-size:16.5px;line-height:1.15}
  header{padding-left:14px;padding-right:14px}
  .marca{gap:9px}
  .logo{font-size:13px;padding:2px 5px}
  main{padding-left:11px;padding-right:11px}
  .tarjeta{padding:14px 12px}
}
@media(max-width:380px){.chip-lugar{max-width:56px}}
@media(max-width:400px){.cinta-pie{grid-template-columns:1fr}.campos-2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ==================================================================
   TEMA CLARO — fondo limpio y bordes remarcados en tono oscuro.
   Todo se controla desde aquí: el resto de la hoja no cambia.
   ================================================================== */
html[data-tema="claro"]{
  --papel:#F4F5F1; --hoja:#FFFFFF; --tinta:#101A14; --suave:#4A5A50;
  --rayado:#94A398; --margen:#8E3226; --verde:#2F6B4A; --ambar:#A9761F;
  --azul:#255C79; --borde:#2C3D33;
}
html[data-tema="claro"] body{background-image:none}
html[data-tema="claro"] .tarjeta{border-width:2px;box-shadow:3px 3px 0 rgba(16,26,20,.10)}
html[data-tema="claro"] .cinta{border-width:2px;border-bottom:none}
html[data-tema="claro"] input,
html[data-tema="claro"] select,
html[data-tema="claro"] textarea{border-width:2px}
html[data-tema="claro"] .btn{border-width:2px}
html[data-tema="claro"] .chip{border-width:2px}
html[data-tema="claro"] .chip.activo{border-width:2.5px}
html[data-tema="claro"] .barra{border-width:1.5px;border-color:var(--borde)}
html[data-tema="claro"] .split{border-width:1.5px;border-color:var(--borde)}
html[data-tema="claro"] .libro{border-left-width:3px}
html[data-tema="claro"] .consejo{border-left-width:4px}
html[data-tema="claro"] .dia-cab{border-bottom:1.5px solid var(--borde)}
html[data-tema="claro"] th{border-bottom:1.5px solid var(--borde)}
html[data-tema="claro"] td{border-bottom:1px solid #D8DED8}
html[data-tema="claro"] .mov{border-bottom:1px solid #D8DED8}
html[data-tema="claro"] .pres li{border-bottom:1px solid #D8DED8}
html[data-tema="claro"] .renglon i{border-bottom-color:#B9C4BB}
html[data-tema="claro"] .cinta-cab{border-bottom:1.5px solid var(--borde)}
html[data-tema="claro"] .cinta-total{border-top-width:2.5px}
html[data-tema="claro"] .codigo-hogar{border:2px dashed var(--borde)}
html[data-tema="claro"] .hoja{border:2px solid var(--borde);border-top:4px solid var(--margen)}
html[data-tema="claro"] .toggle{border-width:2px}
html[data-tema="claro"] header{border-bottom-width:4px}
html[data-tema="claro"] nav{border-right:2px solid var(--borde)}
html[data-tema="claro"] .fab{border:2px solid var(--tinta)}
html[data-tema="claro"] .gr line{stroke:#B9C4BB}

/* ==================================================================
   TEMA SAP FIORI — paleta Quartz/Horizon con colores semánticos.
   Azul de marca para acciones, y verde/naranja/rojo con el significado
   que tienen en Fiori: positivo, crítico y negativo.
   ================================================================== */
html[data-tema="fiori"]{
  --papel:#F5F6F7;   /* sapBackgroundColor */
  --hoja:#FFFFFF;    /* sapTile_Background  */
  --tinta:#32363A;   /* sapTextColor        */
  --suave:#6A6D70;   /* sapContent_LabelColor */
  --rayado:#E5E5E5;  /* sapList_BorderColor */
  --borde:#C6CBD0;   /* sapGroup_ContentBorderColor */
  --margen:#BB0000;  /* sapNegativeColor    */
  --verde:#107E3E;   /* sapPositiveColor    */
  --ambar:#E9730C;   /* sapCriticalColor    */
  --azul:#0A6ED1;    /* sapBrandColor       */
  --shell:#354A5F;   /* sapShellColor       */
}
html[data-tema="fiori"] body{background-image:none}
html[data-tema="fiori"] h1,html[data-tema="fiori"] h2,html[data-tema="fiori"] h3,
html[data-tema="fiori"] .btn,html[data-tema="fiori"] .chip,html[data-tema="fiori"] .enlace{letter-spacing:0}
/* Con la tipografía original, Fiori usa la familia "72" de SAP si está instalada */
html[data-tema="fiori"][data-tipo="original"]{
  --tipo-ui:"72","72full",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --tipo-titulo:"72","72full",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
html[data-tema="fiori"] .tarjeta{border-radius:8px;box-shadow:0 0 8px 0 rgba(0,0,0,.08);border-color:var(--borde)}
html[data-tema="fiori"] .cinta{border-radius:8px 8px 0 0;box-shadow:0 0 8px 0 rgba(0,0,0,.08)}
html[data-tema="fiori"] header{background:var(--shell);border-bottom:none;box-shadow:0 1px 4px rgba(0,0,0,.16)}
html[data-tema="fiori"] header .sub{color:#C6D2DC}
html[data-tema="fiori"] .estado-conn{color:#C6D2DC}
html[data-tema="fiori"] .logo{border-color:#8FA5B8}
html[data-tema="fiori"] nav{background:#FFFFFF;border-right:1px solid var(--borde);box-shadow:1px 0 4px rgba(0,0,0,.08)}
html[data-tema="fiori"] nav button{color:var(--suave)}
html[data-tema="fiori"] nav::before{color:var(--suave)}
html[data-tema="fiori"] nav button.activo{color:var(--azul);border-left-color:var(--azul);background:#EBF5FE}
html[data-tema="fiori"] .fab{background:var(--azul);border-radius:50%;box-shadow:0 4px 12px rgba(10,110,209,.4)}
html[data-tema="fiori"] .fab:hover{background:#0854A0}
html[data-tema="fiori"] .btn{border-radius:4px;border-color:var(--azul);color:var(--azul);background:#FFFFFF}
html[data-tema="fiori"] .btn:hover{background:#EBF5FE}
html[data-tema="fiori"] .btn.primario{background:var(--azul);border-color:var(--azul);color:#FFFFFF}
html[data-tema="fiori"] .btn.primario:hover{background:#0854A0;border-color:#0854A0}
html[data-tema="fiori"] .btn.peligro{border-color:var(--margen);color:var(--margen)}
html[data-tema="fiori"] .btn.peligro:hover{background:#FFEBEB}
html[data-tema="fiori"] .btn-google{border-color:var(--borde);color:var(--tinta)}
html[data-tema="fiori"] input,html[data-tema="fiori"] select,html[data-tema="fiori"] textarea{
  border-radius:4px;border-color:#89919A}
html[data-tema="fiori"] input:focus,html[data-tema="fiori"] select:focus,html[data-tema="fiori"] textarea:focus{
  outline:2px solid var(--azul);outline-offset:0;border-color:var(--azul)}
html[data-tema="fiori"] .chip{border-radius:4px}
html[data-tema="fiori"] .chip.activo{background:#EBF5FE;border-color:var(--azul);color:var(--azul)}
html[data-tema="fiori"] .toggle{border-radius:4px;border-color:var(--azul)}
html[data-tema="fiori"] .toggle button{color:var(--azul)}
html[data-tema="fiori"] .toggle button.activo{background:var(--azul);color:#FFFFFF}
html[data-tema="fiori"] .barra{border-radius:4px;border-color:var(--rayado);background:#EDEEF0}
html[data-tema="fiori"] .split{border-radius:4px;border-color:var(--rayado)}
html[data-tema="fiori"] .enlace{color:var(--azul)}
html[data-tema="fiori"] .cinta-total strong{color:var(--tinta)}
html[data-tema="fiori"] .destacado strong{color:var(--verde)}
html[data-tema="fiori"] .hoja{border-radius:8px 8px 0 0;border-top:4px solid var(--azul)}
html[data-tema="fiori"] .aviso{background:var(--shell);border-radius:4px}
html[data-tema="fiori"] .codigo-hogar{border:1px dashed var(--azul);background:#EBF5FE;color:var(--azul)}
html[data-tema="fiori"] .libro{border-left-color:var(--azul)}
html[data-tema="fiori"] .gr line{stroke:var(--rayado)}
html[data-tema="fiori"] .cerrar-modal:hover{background:#FFEBEB;border-color:var(--margen);color:var(--margen)}

/* ==================================================================
   TEMA FEMENINO — ciruela profunda, rosa empolvado y oro viejo.
   Contraste alto de verdad (tinta #3B2230 sobre blanco), serif en los
   títulos y semánticos suavizados: salvia, oro y granate.
   ================================================================== */
html[data-tema="femenino"]{
  --papel:#FAF2F3; --hoja:#FFFFFF; --tinta:#3B2230; --suave:#7A5C68;
  --rayado:#EBD9DE; --borde:#DCC2CB; --margen:#A8385A; --verde:#4E7C6A;
  --ambar:#9A6A18; --azul:#8A6FA8; --oro:#C9A227;
}
html[data-tema="femenino"] body{
  background-image:repeating-linear-gradient(115deg,transparent 0 22px,rgba(168,56,90,.045) 22px 23px)}
html[data-tema="femenino"][data-tipo="original"] h1,
html[data-tema="femenino"][data-tipo="original"] h2,
html[data-tema="femenino"][data-tipo="original"] h3,
html[data-tema="femenino"][data-tipo="original"] .cinta-total strong,
html[data-tema="femenino"][data-tipo="original"] .destacado strong{
  font-family:'Fraunces',Georgia,serif;font-weight:700;letter-spacing:-.01em}
html[data-tema="femenino"] .tarjeta{border-radius:7px;box-shadow:0 2px 10px rgba(59,34,48,.07)}
html[data-tema="femenino"] .cinta{border-radius:7px 7px 0 0}
html[data-tema="femenino"] header{background:linear-gradient(105deg,#3B2230 0%,#5A3145 100%);border-bottom-color:var(--oro)}
html[data-tema="femenino"] header .sub,html[data-tema="femenino"] .estado-conn{color:#E3C9D2}
html[data-tema="femenino"] .logo{border-color:var(--oro);color:#F7E4C8}
html[data-tema="femenino"] nav{background:#3B2230}
html[data-tema="femenino"] nav button{color:#C9A9B5}
html[data-tema="femenino"] nav::before{color:#C9A9B5}
html[data-tema="femenino"] nav button.activo{color:#FFF;border-left-color:var(--oro)}
html[data-tema="femenino"] .fab{background:var(--margen);box-shadow:0 4px 14px rgba(168,56,90,.35)}
html[data-tema="femenino"] .fab:hover{background:#8C2C49}
html[data-tema="femenino"] .btn{border-radius:5px}
html[data-tema="femenino"] .btn.primario{background:var(--tinta);border-color:var(--tinta)}
html[data-tema="femenino"] input,html[data-tema="femenino"] select,html[data-tema="femenino"] textarea{border-radius:5px}
html[data-tema="femenino"] .chip{border-radius:5px}
html[data-tema="femenino"] .chip.activo{background:#FBEEF2}
html[data-tema="femenino"] .barra{border-radius:5px;background:#F3E4E8}
html[data-tema="femenino"] .split{border-radius:5px}
html[data-tema="femenino"] .hoja{border-radius:7px 7px 0 0;border-top-color:var(--oro)}
html[data-tema="femenino"] .codigo-hogar{border-color:var(--oro);color:var(--margen)}
html[data-tema="femenino"] .libro{border-left-color:var(--oro)}
html[data-tema="femenino"] .gr line{stroke:var(--rayado)}

/* ================= marca de agua personal ========================= */
.marca-agua{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-position:center;background-size:cover;background-repeat:no-repeat;
  opacity:0;transition:opacity .45s ease;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 68%,transparent 100%);
  mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 68%,transparent 100%);
}
main{position:relative;z-index:1}
.previa-fondo{width:100%;height:120px;border:1px solid var(--borde);border-radius:3px;
  background-position:center;background-size:cover;background-color:var(--papel);margin-bottom:12px}
.rango{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rango input[type=range]{flex:1;padding:0;height:26px;background:none;border:none}
.rango b{font-family:var(--tipo-num);font-size:12px;font-weight:500;min-width:42px;text-align:right}

/* ================= tipografías seleccionables ===================== */
html[data-tipo="roboto"]{
  --tipo-ui:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tipo-titulo:'Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tipo-num:'Roboto Mono',ui-monospace,monospace;
}
html[data-tipo="roboto"] .cod,html[data-tipo="roboto"] .mono,
html[data-tipo="roboto"] td.num,html[data-tipo="roboto"] .renglon b{font-variant-numeric:tabular-nums}
html[data-tipo="original"]{
  --tipo-ui:'Karla',system-ui,sans-serif;
  --tipo-titulo:'Bricolage Grotesque','Karla',sans-serif;
}
/* Inter y Roboto son algo más anchas: se compensa el interletrado de los títulos */
html[data-tipo="inter"] h1,html[data-tipo="inter"] h2,html[data-tipo="inter"] h3{letter-spacing:-.018em}
html[data-tipo="roboto"] h1,html[data-tipo="roboto"] h2,html[data-tipo="roboto"] h3{letter-spacing:-.012em}
.muestra-tipo{font-size:15px;line-height:1.35;margin:10px 0 0;padding:11px 12px;background:var(--papel);
  border:1px solid var(--borde);border-radius:3px}
.muestra-tipo b{display:block;font-family:var(--tipo-titulo);font-size:17px;font-weight:700;margin-bottom:3px}
.muestra-tipo span{font-family:var(--tipo-num);font-variant-numeric:tabular-nums;color:var(--suave);font-size:13px}

/* ==================================================================
   TEMA OSCURO — paleta tipo GitHub Dark. Fondo casi negro azulado,
   tarjetas elevadas con filo de color y acentos vivos para los datos.
   ================================================================== */
html[data-tema="oscuro"]{
  --papel:#0D1117;   /* lienzo     */
  --hoja:#161B22;    /* tarjeta    */
  --tinta:#E6EDF3;   /* texto      */
  --suave:#8B949E;   /* secundario */
  --rayado:#21262D;  /* separador  */
  --borde:#30363D;
  --margen:#F85149;  /* negativo   */
  --verde:#3FB950;   /* positivo   */
  --ambar:#D29922;   /* atención   */
  --azul:#58A6FF;    /* enlace     */
  color-scheme:dark;
}
html[data-tema="oscuro"] body{background-image:none}
html[data-tema="oscuro"] .tarjeta{border-radius:8px;box-shadow:0 1px 3px rgba(1,4,9,.85)}
html[data-tema="oscuro"] .cinta{border-radius:8px 8px 0 0}
html[data-tema="oscuro"] header{background:#161B22;border-bottom:1px solid var(--borde);color:var(--tinta)}
html[data-tema="oscuro"] header h1{color:var(--tinta)}
html[data-tema="oscuro"] .barra-mes{border-top-color:var(--borde)}
html[data-tema="oscuro"] .mes-txt{color:var(--tinta)}
html[data-tema="oscuro"] header .sub,html[data-tema="oscuro"] .estado-conn{color:var(--suave)}
html[data-tema="oscuro"] .logo{border-color:var(--borde);color:var(--suave)}
html[data-tema="oscuro"] .icono{border-color:var(--borde);color:var(--tinta)}
html[data-tema="oscuro"] nav{background:#161B22;border-right:1px solid var(--borde)}
html[data-tema="oscuro"] nav button{color:var(--suave)}
html[data-tema="oscuro"] nav::before{color:var(--suave)}
html[data-tema="oscuro"] nav button.activo{color:var(--azul);border-left-color:var(--azul);background:#0D419D26}
html[data-tema="oscuro"] .fab{background:#238636;color:#fff;box-shadow:0 0 0 1px #2EA043,0 4px 16px rgba(35,134,54,.45)}
html[data-tema="oscuro"] .fab:hover{background:#2EA043}
html[data-tema="oscuro"] .btn{background:#21262D;border-color:var(--borde);color:var(--tinta);border-radius:6px}
html[data-tema="oscuro"] .btn:hover{background:#30363D}
html[data-tema="oscuro"] .btn.primario{background:#238636;border-color:#2EA043;color:#fff}
html[data-tema="oscuro"] .btn.primario:hover{background:#2EA043}
html[data-tema="oscuro"] .btn.peligro{background:#21262D;border-color:#F8514966;color:var(--margen)}
html[data-tema="oscuro"] .btn-google{background:#21262D;color:var(--tinta)}
html[data-tema="oscuro"] input,html[data-tema="oscuro"] select,html[data-tema="oscuro"] textarea{
  background:#0D1117;border-color:var(--borde);color:var(--tinta);border-radius:6px}
html[data-tema="oscuro"] input::placeholder{color:#6E7681}
html[data-tema="oscuro"] input:focus,html[data-tema="oscuro"] select:focus,html[data-tema="oscuro"] textarea:focus{
  outline:2px solid var(--azul);outline-offset:0;border-color:var(--azul)}
html[data-tema="oscuro"] .chip{background:#21262D;border-color:var(--borde);color:var(--suave);border-radius:6px}
html[data-tema="oscuro"] .chip.activo{background:#0D419D40;border-color:var(--azul);color:var(--azul)}
html[data-tema="oscuro"] .toggle{border-color:var(--borde);border-radius:6px}
html[data-tema="oscuro"] .toggle button{color:var(--tinta)}
html[data-tema="oscuro"] .toggle button.activo{background:#238636;color:#fff}
html[data-tema="oscuro"] .barra{background:#0D1117;border-color:var(--borde);border-radius:6px}
html[data-tema="oscuro"] .split{border-color:var(--borde);border-radius:6px}
html[data-tema="oscuro"] .hoja{background:#161B22;border:1px solid var(--borde);border-top:3px solid var(--azul);
  border-radius:10px 10px 0 0}
html[data-tema="oscuro"] .modal{background:rgba(1,4,9,.75)}
html[data-tema="oscuro"] .enlace{color:var(--azul)}
html[data-tema="oscuro"] .libro{border-left-color:var(--azul)}
html[data-tema="oscuro"] .aviso{background:#21262D;border:1px solid var(--borde);border-radius:6px}
html[data-tema="oscuro"] .codigo-hogar{background:#0D1117;border-color:var(--azul);color:var(--azul)}
html[data-tema="oscuro"] .chip-ahorro{background:#0D1117;border-color:var(--borde)}
html[data-tema="oscuro"] .gr line{stroke:var(--rayado)}
html[data-tema="oscuro"] .gr text{fill:var(--suave)}
html[data-tema="oscuro"] .previa-fondo{border-color:var(--borde)}
html[data-tema="oscuro"] .aviso-credito{background:#0D1117;border-left-color:var(--ambar)}
html[data-tema="oscuro"] .marca-fija,html[data-tema="oscuro"] .marca-base{border-color:var(--borde)}
html[data-tema="oscuro"] .cerrar-modal:hover{background:#F8514933;border-color:var(--margen);color:var(--margen)}
html[data-tema="oscuro"] .muestra i{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
/* Filo de color en cada tarjeta, como en un panel de indicadores */
html[data-tema="oscuro"] [data-acento]{border-top:2px solid var(--acento-color)}
html[data-tema="oscuro"] [data-acento] .cab h2{color:var(--acento-color)}
html[data-tema="oscuro"] [data-acento="verde"]{--acento-color:#3FB950}
html[data-tema="oscuro"] [data-acento="rojo"]{--acento-color:#F85149}
html[data-tema="oscuro"] [data-acento="azul"]{--acento-color:#58A6FF}
html[data-tema="oscuro"] [data-acento="ambar"]{--acento-color:#D29922}
html[data-tema="oscuro"] [data-acento="lila"]{--acento-color:#A371F7}

/* ==================================================================
   TEMA CÁLIDO — cabecera slate, lienzo hueso y naranja como acento.
   La paleta de los gráficos se armoniza a tonos medios: mismo peso
   visual para las once categorías, sin que ninguna grite más que otra.
   ================================================================== */
html[data-tema="calido"]{
  --papel:#F1EFEA;   /* lienzo cálido */
  --hoja:#FFFFFF;    /* tarjeta       */
  --tinta:#1F242A;   /* texto         */
  --suave:#6E757C;   /* secundario    */
  --rayado:#E6E1D8;  /* separador     */
  --borde:#DDD7CC;
  --margen:#C2402D;  /* negativo      */
  --verde:#2F7D3A;   /* positivo      */
  --ambar:#C88A1E;   /* atención      */
  --azul:#3D7C8F;    /* informativo   */
  --naranja:#D9782D; /* acento        */
  --shell:#2E353D;   /* cabecera      */
}
html[data-tema="calido"] body{background-image:none}
html[data-tema="calido"] .tarjeta{border-radius:12px;border-color:var(--borde);
  box-shadow:0 1px 2px rgba(31,36,42,.05)}
html[data-tema="calido"] .cinta{border-radius:12px 12px 0 0}
html[data-tema="calido"] header{background:var(--shell);border-bottom:none;color:#F1EFEA}
html[data-tema="calido"] header h1{color:#FFFFFF}
html[data-tema="calido"] header .sub,html[data-tema="calido"] .estado-conn{color:#A7B0B9}
html[data-tema="calido"] .barra-mes{border-top-color:rgba(241,239,234,.18)}
html[data-tema="calido"] .mes-txt{color:#F1EFEA}
html[data-tema="calido"] .logo{border-color:#7A858F;color:#E7E3DC}
html[data-tema="calido"] .icono{border-color:#59636D;color:#E7E3DC}
html[data-tema="calido"] nav{background:var(--shell);border-right:none}
html[data-tema="calido"] nav::before{color:#8B959E}
html[data-tema="calido"] nav button{color:#A7B0B9;border-radius:0}
html[data-tema="calido"] nav button:hover{background:rgba(241,239,234,.07);color:#fff}
html[data-tema="calido"] nav button.activo{color:#fff;border-left-color:var(--naranja);
  background:rgba(217,120,45,.16)}
html[data-tema="calido"] .fab{background:var(--naranja);border-radius:16px;
  box-shadow:0 4px 14px rgba(217,120,45,.35)}
html[data-tema="calido"] .fab:hover{background:#C46A22}
html[data-tema="calido"] .btn{border-radius:10px;border-color:var(--borde);background:var(--hoja);
  color:var(--tinta)}
html[data-tema="calido"] .btn:hover{background:#F6F4F0}
html[data-tema="calido"] .btn.primario{background:var(--naranja);border-color:var(--naranja);color:#fff}
html[data-tema="calido"] .btn.primario:hover{background:#C46A22;border-color:#C46A22}
html[data-tema="calido"] .btn.peligro{border-color:var(--margen);color:var(--margen)}
html[data-tema="calido"] input,html[data-tema="calido"] select,html[data-tema="calido"] textarea{
  border-radius:10px;border-color:var(--borde)}
html[data-tema="calido"] input:focus,html[data-tema="calido"] select:focus,
html[data-tema="calido"] textarea:focus{outline:2px solid var(--naranja);outline-offset:0;border-color:var(--naranja)}
html[data-tema="calido"] .chip{border-radius:999px;border-color:var(--borde)}
html[data-tema="calido"] .chip.activo{background:#FBEFE4;border-color:var(--naranja);color:#A85A18}
html[data-tema="calido"] .toggle{border-radius:10px;border-color:var(--borde);overflow:hidden}
html[data-tema="calido"] .toggle button{color:var(--suave)}
html[data-tema="calido"] .toggle button.activo{background:var(--naranja);color:#fff}
html[data-tema="calido"] .barra{border-radius:999px;background:#EDE9E1;border-color:var(--rayado)}
html[data-tema="calido"] .fill{border-radius:999px}
html[data-tema="calido"] .split{border-radius:999px;border-color:var(--rayado)}
html[data-tema="calido"] .hoja{border-radius:16px 16px 0 0;border-top:4px solid var(--naranja)}
html[data-tema="calido"] .enlace{color:var(--naranja)}
html[data-tema="calido"] .libro{border-left-color:var(--naranja)}
html[data-tema="calido"] .aviso{background:var(--shell);border-radius:10px}

<script type="module">

const FIREBASE_CONFIG = {

/* ============================ catálogo ============================ */
const CATEGORIAS_BASE = [
  {cod:"ALM",nombre:"Alimentación",color:"#3F7D58",esencial:true},
  {cod:"HOG",nombre:"Hogar y servicios",color:"#2E6E8E",esencial:true},
  {cod:"TRA",nombre:"Transporte",color:"#6B6BA8",esencial:true},
  {cod:"SAL",nombre:"Salud",color:"#C25B54",esencial:true},
  {cod:"EDU",nombre:"Educación",color:"#8A6A3B",esencial:true},
  {cod:"DEU",nombre:"Pago de deudas",color:"#7A4A55",esencial:true},
  {cod:"RES",nombre:"Restaurantes",color:"#A34E6B",esencial:false},
  {cod:"OCI",nombre:"Ocio y salidas",color:"#D08A2C",esencial:false},
  {cod:"ROP",nombre:"Ropa y compras",color:"#4F8C8C",esencial:false},
  {cod:"SUS",nombre:"Suscripciones",color:"#5A5F6B",esencial:false},
  {cod:"NRG",nombre:"Gastos no registrados",color:"#8C6D8F",esencial:false},
  {cod:"OTR",nombre:"Otros",color:"#8A9099",esencial:false},
];
/* CATEGORIAS y CAT se recalculan al vuelo: a las de serie se suman las que
   crea la familia, guardadas en config.categorias y sincronizadas como todo
   lo demás. */
let CATEGORIAS = [...CATEGORIAS_BASE];
let CAT = Object.fromEntries(CATEGORIAS.map(c=>[c.cod,c]));
function sincronizarCategorias(){
  const propias = (S?.config?.categorias||[]).filter(c=>c&&c.cod&&!CATEGORIAS_BASE.some(b=>b.cod===c.cod));
  CATEGORIAS = [...CATEGORIAS_BASE, ...propias.map(c=>({...c,propia:true}))];
  CAT = Object.fromEntries(CATEGORIAS.map(c=>[c.cod,c]));
  recalcularPaleta();
}
const esPropia = cod=>!!CAT[cod]?.propia;
/* Sub-sobres: divisiones dentro de una categoría. "Alimentación" puede
   separarse en supermercado, feria y carnicería sin multiplicar los sobres
   del panel. Se guardan por código de categoría en la configuración del
   hogar, así que los ve toda la familia. */
const subsConfigDe = cod => ((S.config?.subsobres||{})[cod] || []).map(s=>
  typeof s==="string" ? {nombre:s,tipo:esFijaCat(cod)?"fijo":"variable",aliases:[]} :
  ({nombre:String(s?.nombre||""),tipo:s?.tipo==="fijo"?"fijo":"variable",aliases:Array.isArray(s?.aliases)?s.aliases.map(String):[]}))
  .filter(s=>s.nombre);
const subsDe = cod => subsConfigDe(cod).map(s=>s.nombre);
const metaSub = (cod,nombre)=>subsConfigDe(cod).find(s=>
  s.nombre.toLowerCase()===String(nombre||"").toLowerCase() || s.aliases.some(a=>a.toLowerCase()===String(nombre||"").toLowerCase()));
const nombreSub = (cod,nombre)=>metaSub(cod,nombre)?.nombre || nombre || "";
const esFijoMovimiento = m=>{
  const sub=(m?.sub||"").trim(), cfg=sub&&metaSub(m.categoria,sub);
  return cfg ? cfg.tipo==="fijo" : esFijaCat(m?.categoria);
};
const SIN_SUB = "Sin clasificar";
const opcionesSub = (cod,actual="")=>{
  const cfg=subsConfigDe(cod), actualCanon=nombreSub(cod,actual);
  const lista = cfg.map(s=>s.nombre);
  const extra = actual && !lista.includes(actualCanon) ? [actual] : [];
  return `<option value="">Sin especificar</option>` +
    [...lista,...extra].map(s=>`<option ${actualCanon===s?"selected":""}>${esc(s)}${metaSub(cod,s)?.tipo==="fijo"?" · fijo":" · variable"}</option>`).join("");
};
/* Los colores de categoría están pensados sobre papel claro; sobre un fondo
   oscuro pierden contraste, así que se aclaran y saturan al vuelo. */
/* Unifica saturación y luminosidad conservando el tono de cada categoría.
   Es lo que hace que una paleta suelta de once colores se vea como una
   familia: dejan de competir entre sí y el gráfico se lee de un vistazo. */
function armonizar(hex,sat,luz){
  const m=/^#?([\da-f]{6})$/i.exec(hex||""); if(!m) return hex;
  const n=parseInt(m[1],16), r=(n>>16)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b); let h=0;
  const d=max-min;
  if(d){ h = max===r? ((g-b)/d+(g<b?6:0)) : max===g? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return `hsl(${Math.round(h)} ${sat}% ${luz}%)`;
}
const aclarar = (hex,luz=62,sat=68)=>armonizar(hex,sat,luz);
/* Cada tema puede pedir su propio ajuste de la paleta de gráficos */
const AJUSTE_PALETA = {
  oscuro: {sat:68, luz:62},   // sobre negro hay que subir luz y saturación
  calido: {sat:44, luz:45},   // tonos medios y terrosos, sin estridencias
};
const tonoDe = hex=>{
  const m=/^#?([\da-f]{6})$/i.exec(hex||""); if(!m) return 0;
  const n=parseInt(m[1],16), r=(n>>16)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  if(!d) return 0;
  let t = max===r? ((g-b)/d+(g<b?6:0)) : max===g? ((b-r)/d+2) : ((r-g)/d+4);
  return t*60;
};

/* Unificar saturación y luz haría que dos categorías de tono parecido
   —educación y ocio, ambas ámbar— quedaran indistinguibles. Se ordenan
   por tono y se alterna la luminosidad en tres escalones, de modo que
   dos vecinas nunca caen en el mismo nivel. */
let PALETA_ARMONICA = {};
function recalcularPaleta(){
  PALETA_ARMONICA = {};
  const a = AJUSTE_PALETA[S.tema]; if(!a) return;
  [...CATEGORIAS].map(c=>({hex:c.color, h:tonoDe(c.color)}))
    .sort((x,y)=>x.h-y.h)
    .forEach((c,i)=>{
      const luz = a.luz + ((i%3)-1)*9;
      PALETA_ARMONICA[c.hex] = `hsl(${Math.round(c.h)} ${a.sat}% ${luz}%)`;
    });
}
const col = c => {
  if(PALETA_ARMONICA[c]) return PALETA_ARMONICA[c];
  const a = AJUSTE_PALETA[S.tema];
  return a ? armonizar(c, a.sat, a.luz) : c;
};
const PALETA_CAT = ["#3F7D58","#2E6E8E","#6B6BA8","#C25B54","#8A6A3B","#A34E6B",
                    "#D08A2C","#4F8C8C","#5A5F6B","#7A4A55","#8A9099","#B5651D"];
/* Categorías cuyo cargo es mensual y no se repite a diario: no deben promediarse
   por día al proyectar el cierre del mes. */
const CAT_FIJAS_BASE = ["HOG","EDU","SUS","DEU"];
const esFijaCat = cod=>CAT_FIJAS_BASE.includes(cod) || !!CAT[cod]?.fija;
const METODOS = ["Efectivo","Débito","Crédito","Transferencia"];
const MONEDAS = [["MXN","es-MX"],["EUR","es-ES"],["COP","es-CO"],["ARS","es-AR"],["CLP","es-CL"],["PEN","es-PE"],["USD","es-US"]];
const DIAS = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
/* Aportes y retiros de las cuentas de ahorro. No son categorías de gasto:
   el dinero no se consume, cambia de bolsillo. Se les da código y color
   propios para que se distingan en el libro. */
const PSEUDO = {
  ahorro:{cod:"AHO", nombre:"Aporte a ahorro",  color:"#3F7D58"},
  retiro:{cod:"RET", nombre:"Retiro de ahorro", color:"#C7913A"},

/* ============ devengo frente a caja ===============================
   Una compra con tarjeta de crédito es gasto del periodo —cuenta en su
   sobre y en las estadísticas— pero el dinero no ha salido de la cuenta:
   lo que sale es el pago de la tarjeta, más adelante. Si se restaran las
   dos cosas, el mismo gasto se descontaría dos veces del disponible.
   afectaCaja() decide qué movimientos mueven dinero de verdad. */
const afectaCaja = m => {
  if(m.tipo==="gasto")  return !m.tarjetaId;        // a crédito aún no sale
  if(m.tipo==="ahorro" || m.tipo==="retiro") return !m.soloCuenta;
  return true;                                      // ingresos y pagos de tarjeta
};
const esCredito = m => m.tipo==="gasto" && !!m.tarjetaId;
const codDe   = m => PSEUDO[m.tipo]?.cod   || m.categoria;
const colorDe = m => PSEUDO[m.tipo]?.color || CAT[m.categoria]?.color || "#8A9099";
const nombreCuenta = id => S.cuentas.find(c=>c.id===id)?.nombre || "";
const TIPOS_CUENTA = ["Cuenta de ahorro","Cuenta corriente","Depósito a plazo",
                      "Fondo mutuo","APV","Efectivo guardado","Otra"];

/* ============ administración y borrado de datos ===================
   El borrado masivo y la eliminación de deudas, metas y sobres quedan
   reservados al administrador del hogar: exclusivamente quien lo creó.
   El resto puede corregir y borrar sus movimientos uno
   a uno, que es la operación del día a día.
   Esto se refuerza en las reglas de Firestore: la interfaz no basta. */
const esAdmin = ()=>{
  if(S.modo!=="nube") return true;                   // en local no hay nadie más
  if(!S.uid) return false;
  return !!S.adminUid && S.uid===S.adminUid;         // quien creó el hogar
};
const correoAdmin = ()=> S.adminCorreo || "";

/* ============================ utilidades ========================== */
const $ = s=>document.querySelector(s);
const pad = n=>String(n).padStart(2,"0");
const hoyISO = ()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const mesDe = iso=>String(iso).slice(0,7);
const aDate = iso=>{const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)};
const diasEnMes = m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()};
const sumaMes = (m,k)=>{const[y,mm]=m.split("-").map(Number);const d=new Date(y,mm-1+k,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const mesLargo = m=>{const[y,mm]=m.split("-").map(Number);const s=new Date(y,mm-1,1).toLocaleDateString("es",{month:"long",year:"numeric"});return s[0].toUpperCase()+s.slice(1)};
const mesCorto = m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm-1,1).toLocaleDateString("es",{month:"short"}).replace(".","")};
const uid = ()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

/* ============ ciclo mensual configurable =========================
   Muchas familias no viven del 1 al 31 sino del día de pago al siguiente.
   El "periodo" se identifica por el mes en que empieza: con el ciclo el 10,
   el periodo 2026-08 va del 10 de agosto al 9 de septiembre.
   Con el ciclo el día 1 —el valor por omisión— todo esto equivale al mes
   natural, así que los datos ya registrados siguen cayendo donde estaban. */
const diaCiclo = ()=>Math.min(28,Math.max(1, S.config?.diaCiclo || 1));
const iso = (y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const inicioPeriodo = mes=>{ const [y,m]=mes.split("-").map(Number); return iso(y,m,diaCiclo()); };
const finPeriodo = mes=>{
  const [y,m]=mes.split("-").map(Number);
  const d = new Date(y,m-1,diaCiclo());   // día siguiente al cierre
  d.setMonth(d.getMonth()+1); d.setDate(d.getDate()-1);
  return iso(d.getFullYear(), d.getMonth()+1, d.getDate());
};
/* A qué periodo pertenece una fecha */
const periodoDe = fechaISO=>{
  const [y,m,d] = String(fechaISO).split("-").map(Number);
  const clave = `${y}-${pad(m)}`;
  return d>=diaCiclo()? clave : sumaMes(clave,-1);
};
const enPeriodo = (fechaISO,mes)=>periodoDe(fechaISO)===mes;
const diasPeriodo = mes=>{
  const a=aDate(inicioPeriodo(mes)), b=aDate(finPeriodo(mes));
  return Math.round((b-a)/86400000)+1;
};
const diaDelPeriodo = mes=>{
  const a=aDate(inicioPeriodo(mes)), hoy=aDate(hoyISO());
  return Math.min(diasPeriodo(mes), Math.max(1, Math.round((hoy-a)/86400000)+1));
};
const fechasPeriodo = mes=>{
  const salida=[], a=aDate(inicioPeriodo(mes)), n=diasPeriodo(mes);
  for(let i=0;i<n;i++){ const d=new Date(a); d.setDate(a.getDate()+i);
    salida.push(iso(d.getFullYear(), d.getMonth()+1, d.getDate())); }
  return salida;
};
/* Etiqueta del periodo: "Agosto de 2026" con ciclo el 1, "10 ago – 9 sep 2026" si no */
/* Versión corta para la cabecera del móvil: "sept 2026" en vez de
   "Septiembre de 2026", que no cabe junto al clima. */
const etiquetaPeriodoCorta = mes=>{
  if(diaCiclo()===1) return `${mesCorto(mes)} ${mes.slice(0,4)}`;
  const corto = f=>aDate(f).toLocaleDateString("es",{day:"numeric",month:"short"}).replace(".","");
  return `${corto(inicioPeriodo(mes))}–${corto(finPeriodo(mes))}`;
};
const etiquetaPeriodo = mes=>{
  if(diaCiclo()===1) return mesLargo(mes);
  const corto = f=>aDate(f).toLocaleDateString("es",{day:"numeric",month:"short"}).replace(".","");
  const fin = finPeriodo(mes);
  return `${corto(inicioPeriodo(mes))} – ${corto(fin)} ${fin.slice(0,4)}`;
};
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* num() devuelve enteros: todos los importes de la app lo son.
   numDec() se reserva para valores que sí llevan decimales, como la tasa. */
const numDec = v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
/* Los importes se escriben con separador de miles, así que al leerlos se
   descarta todo lo que no sea dígito o signo. */
const num = v=>{ const n=parseInt(String(v).replace(/[^\d-]/g,""),10); return isFinite(n)?n:0; };
/* Formato para los campos de captura: solo miles, sin símbolo de moneda */
const miles = n=>{
  try{ return Number(n).toLocaleString(S.config?.locale||"es-CL",{maximumFractionDigits:0}); }
  catch{ return String(Math.round(n||0)); }
};
/* Valor inicial de un campo de importe: vacío si no hay nada que mostrar */
const vf = n=>(n===null||n===undefined||n===""||Number(n)===0)? "" : miles(Number(n));
const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));

/* ============================ estado ============================== */
const configInicial = ()=>({moneda:"MXN",locale:"es-MX",ingresoMensual:0,metaAhorro:0,miembros:["Yo"]});
const presInicial = ()=>Object.fromEntries(CATEGORIAS.map(c=>[c.cod,0]));

let S = {
