/* ================= respaldo y restauración completos ============= */
const COLECCIONES_RESPALDO = ["movimientos","deudas","metas","cuentas","cierres","conciliaciones","recurrentes"];

/* ================= importación de cartolas ======================== */
const limpiarTexto=s=>String(s??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
function claveComercio(glosa){
  const omitir=new Set(["compra","debito","credito","pago","transferencia","transfer","transaccion","cargo","abono","pos","web","cl","chile","spa","ltda","sa"]);
  const palabras=limpiarTexto(glosa).replace(/[^a-z0-9 ]/g," ").split(/\s+/)
    .filter(x=>x&&!/^\d+$/.test(x)&&!omitir.has(x));
  const clave=palabras.slice(0,5).join(" ").slice(0,80);
  return ["__proto__","prototype","constructor"].includes(clave)?`comercio ${clave}`:clave;
}
function parsearCSV(texto){
  texto=texto.replace(/^\uFEFF/,"");
  const primera=(texto.split(/\r?\n/,1)[0]||""), sep=(primera.match(/;/g)||[]).length>(primera.match(/,/g)||[]).length?";":",";
  const filas=[]; let fila=[],campo="",comillas=false;
  for(let i=0;i<texto.length;i++){
    const c=texto[i];
    if(c==='"'&&comillas&&texto[i+1]==='"'){campo+='"';i++;}
    else if(c==='"')comillas=!comillas;
    else if(c===sep&&!comillas){fila.push(campo);campo="";}
    else if((c==='\n'||c==='\r')&&!comillas){
      if(c==='\r'&&texto[i+1]==='\n')i++; fila.push(campo); if(fila.some(x=>x.trim()))filas.push(fila); fila=[];campo="";
    }else campo+=c;
  }
  fila.push(campo); if(fila.some(x=>x.trim()))filas.push(fila); return filas;
}
function fechaCartola(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  const s=String(v??"").trim(); let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){const y=m[3].length===2?`20${m[3]}`:m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`;}
  return "";
}
function montoCartola(v){
  if(typeof v==="number")return v;
  let s=String(v??"").trim().replace(/[^\d,.-]/g,""); if(!s)return 0;
  const neg=s.includes("-"); s=s.replace(/-/g,"");
  const coma=s.lastIndexOf(','),punto=s.lastIndexOf('.');
  if(coma>punto)s=s.replace(/\./g,"").replace(',','.');
  else if(punto>coma&&s.length-punto-1===3)s=s.replace(/\./g,"");
  else s=s.replace(/,/g,"");
  const n=parseFloat(s)||0; return neg?-n:n;
}
function categoriaSugerida(glosa){
  const s=limpiarTexto(glosa), aprendida=S.config?.reglasCategoria?.[claveComercio(glosa)];
  if(aprendida&&CAT[aprendida]) return aprendida;
  const reglas=[
    ["ALM",/supermerc|lider|jumbo|santa isabel|unimarc|tottus|acuenta|mercado|panader|carnicer|verduler/],
    ["TRA",/copec|shell|enex|petrobras|bencina|combust|peaje|estacionamiento|uber|cabify|taxi|bus/],
    ["HOG",/enel|frontel|cge|essbio|aguas|gasco|lipigas|metrogas|internet|movistar|entel|wom|claro|arriendo|dividendo/],
    ["SAL",/farmac|cruz verde|salcobrand|ahumada|clinica|hospital|medic|isapre|fonasa/],
    ["EDU",/coleg|jardin|univers|instituto|matricula|mensualidad|libreria/],
    ["RES",/restaurant|cafeter|delivery|pedidos ya|rappi|burger|pizza|sushi|mcdonald/],
    ["SUS",/netflix|spotify|youtube|google|icloud|amazon prime|disney|hbo|microsoft/],
    ["ROP",/falabella|ripley|paris|zara|h&m|calzado|vestuario/]
  ];
  return reglas.find(([,r])=>r.test(s))?.[0]||"OTR";
}
const huellaMovimiento=m=>[m.fecha,m.tipo,Math.round(m.monto),limpiarTexto(m.nota)].join("|");

async function elegirCartola(){
  if(cierreDe(S.mes)){avisar("Este periodo está cerrado; reábrelo antes de importar una cartola");return;}
  const input=document.createElement("input");input.type="file";input.accept=".csv,.txt,.xlsx,.xls";
  input.onchange=async()=>{
    const f=input.files?.[0];if(!f)return;if(f.size>20*1024*1024){avisar("La cartola supera los 20 MB");return;}
    try{
      let filas;
      if(/\.csv$|\.txt$/i.test(f.name))filas=parsearCSV(await f.text());
      else{
        const X=await cargarXLSX(),libro=X.read(await f.arrayBuffer(),{type:"array",cellDates:true});
        const hoja=libro.Sheets[libro.SheetNames[0]];filas=X.utils.sheet_to_json(hoja,{header:1,defval:"",raw:true});
      }
      filas=filas.filter(r=>Array.isArray(r)&&r.some(x=>String(x).trim()));
      if(filas.length<2)throw new Error("No se encontraron filas para importar.");
      modalMapeoCartola(f.name,filas.slice(0,2001));
    }catch(err){console.error(err);avisar(err.message||"No se pudo leer la cartola");}
  };input.click();
}

function modalMapeoCartola(nombre,filas){
  const cab=filas[0].map(String), normal=cab.map(limpiarTexto);
  const buscar=(...pat)=>{const i=normal.findIndex(x=>pat.some(p=>x.includes(p)));return i>=0?String(i):""};
  const opt=(valor,permitirVacio=true)=>`${permitirVacio?'<option value="">No usar</option>':""}${cab.map((x,i)=>`<option value="${i}" ${String(i)===valor?"selected":""}>${esc(x||`Columna ${i+1}`)}</option>`).join("")}`;
  modal("Asignar columnas",`
    <p class="nota migaja">${esc(nombre)} · ${filas.length-1} filas detectadas</p>
    <p class="nota">Indica qué representa cada columna. Puedes usar Cargo y Abono separados, o una sola columna Monto con signo.</p>
    <div class="campos-2"><label class="campo"><span>Fecha</span><select id="ic-fecha">${opt(buscar("fecha"),false)}</select></label>
      <label class="campo"><span>Descripción o glosa</span><select id="ic-glosa">${opt(buscar("descripcion","descripci","glosa","detalle","concepto"),false)}</select></label></div>
    <div class="campos-2"><label class="campo"><span>Cargo o egreso</span><select id="ic-cargo">${opt(buscar("cargo","debe","egreso","retiro"))}</select></label>
      <label class="campo"><span>Abono o ingreso</span><select id="ic-abono">${opt(buscar("abono","haber","ingreso","deposito"))}</select></label></div>
    <label class="campo"><span>Monto único con signo</span><select id="ic-monto">${opt(buscar("monto","importe","valor"))}</select></label>
    <p class="nota ayuda">En monto único, los valores negativos se interpretan como gastos y los positivos como ingresos.</p>
  `,async()=>{
    const map={fecha:$("#ic-fecha").value,glosa:$("#ic-glosa").value,cargo:$("#ic-cargo").value,abono:$("#ic-abono").value,monto:$("#ic-monto").value};
    if(map.fecha===""||map.glosa==="")return "Selecciona fecha y descripción.";
    if(map.cargo===""&&map.abono===""&&map.monto==="")return "Selecciona Cargo/Abono o Monto.";
    const datos=[],invalidas=[];
    filas.slice(1).forEach((r,i)=>{
      const fecha=fechaCartola(r[Number(map.fecha)]),nota=String(r[Number(map.glosa)]??"").trim();let tipo,monto;
      const cargo=map.cargo===""?0:Math.abs(montoCartola(r[Number(map.cargo)]));
      const abono=map.abono===""?0:Math.abs(montoCartola(r[Number(map.abono)]));
      if(cargo){tipo="gasto";monto=cargo;}else if(abono){tipo="ingreso";monto=abono;}else{
        const n=montoCartola(r[Number(map.monto)]);tipo=n<0?"gasto":"ingreso";monto=Math.abs(n);
      }
      if(!fecha||!nota||!monto){invalidas.push(i+2);return;}
      const sugerida=tipo==="gasto"?categoriaSugerida(nota):"OTR";
      datos.push({tipo,monto:Math.round(monto),categoria:sugerida,sub:"",deudaId:"",fecha,
        metodo:"Transferencia",tarjetaId:"",cuentaId:"",soloCuenta:false,miembro:miNombre(),nota,
        esencial:tipo==="gasto"?(CAT[sugerida]?.esencial??false):true,uid:S.uid||"",autor:miNombre(),creado:Date.now(),
        _clave:claveComercio(nota),_sugeridaInicial:sugerida});
    });
    if(!datos.length)return "No hubo filas válidas. Revisa las columnas y el formato de fecha.";
    modalPreviaCartola(datos,invalidas);
    return MODAL_REEMPLAZADO;
  },"Revisar movimientos");
}

function modalPreviaCartola(datos,invalidas){
  const existentes=new Set(S.movimientos.map(huellaMovimiento)),vistas=new Set();
  datos.forEach((m,i)=>{const h=huellaMovimiento(m);m._duplicado=existentes.has(h)||vistas.has(h);vistas.add(h);m._importar=!m._duplicado;m._i=i;});
  const duplicados=datos.filter(x=>x._duplicado).length,mostrar=datos.slice(0,300);
  modal("Revisar importación",`
    <p class="nota">${datos.length} movimientos válidos · ${duplicados} duplicados excluidos${invalidas.length?` · ${invalidas.length} filas omitidas`:""}.</p>
    <label class="check"><input type="checkbox" id="ic-recordar" checked><span>Recordar mis correcciones de categoría para futuras cartolas</span></label>
    ${datos.length>300?'<p class="aviso-credito">Se muestran los primeros 300 registros. Los restantes conservarán la categoría sugerida.</p>':""}
    <div class="detalle-lista">${mostrar.map(m=>`<div class="detalle-fila"><label class="check"><input type="checkbox" data-ic-check="${m._i}" ${m._importar?"checked":""} ${m._duplicado?"disabled":""}><span><b>${esc(m.nota)}</b><small>${esc(m.fecha)} · ${m.tipo==="gasto"?"−":"+"}${fmt(m.monto)}${m._duplicado?" · duplicado":""}</small></span></label>${m.tipo==="gasto"?`<select class="mini-select" data-ic-cat="${m._i}">${CATEGORIAS.map(c=>`<option value="${c.cod}" ${c.cod===m.categoria?"selected":""}>${esc(c.nombre)}</option>`).join("")}</select>`:""}</div>`).join("")}</div>
  `,async()=>{
    document.querySelectorAll("[data-ic-check]").forEach(x=>datos[Number(x.dataset.icCheck)]._importar=x.checked);
    document.querySelectorAll("[data-ic-cat]").forEach(x=>{const m=datos[Number(x.dataset.icCat)];m.categoria=x.value;m.esencial=CAT[x.value]?.esencial??false;});
    const elegidos=datos.filter(x=>x._importar&&!x._duplicado);
    if($("#ic-recordar").checked){
      const reglas={...(S.config.reglasCategoria||{})}; let cambios=0;
      elegidos.filter(x=>x.tipo==="gasto"&&x._clave&&x.categoria!==x._sugeridaInicial).forEach(x=>{
        if(reglas[x._clave]!==x.categoria&&(Object.prototype.hasOwnProperty.call(reglas,x._clave)||Object.keys(reglas).length<500)){
          reglas[x._clave]=x.categoria;cambios++;
        }
      });
      if(cambios) await DB.guardarHogar({config:{...S.config,reglasCategoria:reglas}});
    }
    const lista=elegidos.map(({_duplicado,_importar,_i,_clave,_sugeridaInicial,...m})=>m);
    if(!lista.length)return "No hay movimientos seleccionados.";
    await DB.importarMovimientos(lista);avisar(`${lista.length} movimientos importados`);
  },"Importar seleccionados");
}

function validarRespaldo(r){
  if(!r || r.esquema!=="presupuesto-familiar" || r.versionEsquema!==1)
    throw new Error("El archivo no es un respaldo compatible de Presupuesto familiar.");
  if(!r.hogar || typeof r.hogar.config!=="object" || typeof r.hogar.presupuestos!=="object" || !r.datos)
    throw new Error("Al respaldo le falta la configuración del hogar.");
  if(r.hogar.perfiles!==undefined && (typeof r.hogar.perfiles!=="object" || Array.isArray(r.hogar.perfiles)))
    throw new Error("Los perfiles del respaldo no son válidos.");
  // Compatibilidad con respaldos creados antes de existir las plantillas.
  if(r.datos.recurrentes===undefined) r.datos.recurrentes=[];
  let total=0;
  const entero=n=>Number.isInteger(n)&&n>=0&&n<=999999999999999;
  const txt=(v,n)=>typeof v==="string"&&v.length<=n;
  const fecha=v=>typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v);
  const mes=v=>typeof v==="string"&&/^\d{4}-\d{2}$/.test(v);
  for(const col of COLECCIONES_RESPALDO){
    if(!Array.isArray(r.datos[col])) throw new Error(`Falta la colección ${col}.`);
    const ids=new Set();
    for(const x of r.datos[col]){
      if(!x || typeof x!=="object" || Array.isArray(x)) throw new Error(`Hay un registro inválido en ${col}.`);
      if(typeof x.id!=="string" || !x.id || x.id.includes("/") || x.id.length>150)
        throw new Error(`Hay un identificador inválido en ${col}.`);
      if(ids.has(x.id)) throw new Error(`El respaldo repite un identificador en ${col}.`);
      ids.add(x.id);
      let valido=true;
      if(col==="movimientos") valido=["gasto","ingreso","ahorro","retiro","pago"].includes(x.tipo)
        && entero(x.monto)&&x.monto>0&&txt(x.categoria,12)&&fecha(x.fecha)
        && txt(x.metodo,40)&&txt(x.miembro,100)&&txt(x.nota,500)&&typeof x.esencial==="boolean";
      if(col==="deudas") valido=txt(x.nombre,120)&&x.nombre.length>0&&txt(x.tipo,60)
        && entero(x.saldo)&&entero(x.original)&&x.original>=x.saldo&&entero(x.pagoMensual)
        && typeof x.tasaAnual==="number"&&x.tasaAnual>=0&&x.tasaAnual<=1000;
      if(col==="metas") valido=txt(x.nombre,120)&&x.nombre.length>0&&entero(x.objetivo)
        && x.objetivo>0&&entero(x.ahorrado)&&mes(x.fechaLimite);
      if(col==="cuentas") valido=txt(x.nombre,120)&&x.nombre.length>0&&txt(x.banco,120)
        && txt(x.tipo,60)&&txt(x.titular,100)&&entero(x.saldoInicial)
        && typeof x.color==="string"&&/^#[0-9A-Fa-f]{6}$/.test(x.color);
      if(col==="cierres") valido=mes(x.mes)&&fecha(x.fecha)&&x.saldos&&typeof x.saldos==="object"
        && x.teoricos&&typeof x.teoricos==="object"&&x.diferencias&&typeof x.diferencias==="object"
        && x.iniciales&&typeof x.iniciales==="object"&&typeof x.soloRegistro==="boolean";
      if(col==="conciliaciones") valido=fecha(x.fecha)&&x.saldos&&typeof x.saldos==="object"
        && x.teoricos&&typeof x.teoricos==="object"&&x.diferencias&&typeof x.diferencias==="object";
      if(col==="recurrentes") valido=txt(x.nombre,120)&&x.nombre.length>0
        && ["gasto","ingreso"].includes(x.tipo)&&entero(x.monto)&&x.monto>0
        && txt(x.categoria,12)&&txt(x.metodo,40)&&txt(x.miembro,100)
        && Number.isInteger(x.dia)&&x.dia>=1&&x.dia<=28&&typeof x.activo==="boolean"
        && mes(x.desde)&&txt(x.nota,500)&&typeof x.esencial==="boolean";
      if(!valido) throw new Error(`Hay datos incompatibles en ${col}. No se modificó el hogar.`);
    }
    total+=r.datos[col].length;
  }
  if(total>100000) throw new Error("El respaldo supera el máximo de 100.000 registros.");
  return r;
}

function elegirRespaldoJSON(){
  if(!esAdmin()){ avisar("Solo el administrador puede restaurar respaldos"); return; }
  const input=document.createElement("input"); input.type="file"; input.accept="application/json,.json";
  input.onchange=async()=>{
    const f=input.files?.[0]; if(!f) return;
    if(f.size>25*1024*1024){ avisar("El respaldo supera los 25 MB"); return; }
    try{
      const respaldo=validarRespaldo(JSON.parse(await f.text()));
      modalRestaurarJSON(respaldo,f.name);
    }catch(err){ console.error(err); avisar(err.message||"No se pudo leer el respaldo"); }
  };
  input.click();
}

const guardarLocal=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const leerLocal=k=>{try{return localStorage.getItem(k)}catch{return null}};

const TEMAS = ["papel","claro","calido","oscuro","fiori","femenino"];

const NOMBRE_TEMA = {papel:"papel", claro:"claro", calido:"cálido", oscuro:"oscuro", fiori:"fiori", femenino:"femenino"};

/* ================= marca de agua personal ========================= 
   La foto es de cada persona, no del hogar: se guarda en su perfil
   (usuarios/{uid}) y en este dispositivo, para que aparezca al instante
   y le siga si entra desde otro teléfono. */
const claveFondo = ()=>`pf-fondo:${S.uid||"local"}`;

async function comprimirImagen(file,maxLado=900,calidad=.72){
  const dibujar = (ancho,alto,fuente)=>{
    const c=document.createElement("canvas"); c.width=ancho; c.height=alto;
    c.getContext("2d").drawImage(fuente,0,0,ancho,alto);
    return c.toDataURL("image/jpeg",calidad);
  };
  const medidas = (w,h)=>{ const e=Math.min(1,maxLado/Math.max(w,h)); return [Math.round(w*e),Math.round(h*e)]; };
  if(window.createImageBitmap){
    const bmp = await createImageBitmap(file);
    return dibujar(...medidas(bmp.width,bmp.height),bmp);
  }
  return new Promise((ok,fallo)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const r=dibujar(...medidas(img.width,img.height),img); URL.revokeObjectURL(url); ok(r); };
    img.onerror=()=>{ URL.revokeObjectURL(url); fallo(new Error("imagen ilegible")); };
    img.src=url;
  });
}

function pintarFondo(){

  const input=$("#fondo-archivo");

const alertadas = new Set((leerLocal("pf-alertas-vistas")||"").split(",").filter(Boolean));
function recordarAlerta(clave){
  alertadas.add(clave);
  const arr=[...alertadas].slice(-200);

}
async function notificar(titulo,cuerpo,vista="panel"){
  if(!("Notification" in window) || Notification.permission!=="granted") return false;
  const opciones={ body:cuerpo, icon:"./iconos/icono-192.png", badge:"./iconos/icono-192.png",
    tag:"pf-sobre", lang:"es", data:{vista} };
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(titulo,opciones); return true;
    }
    new Notification(titulo,opciones); return true;
  }catch{ return false; }
}
function revisarAlertas(R){
  if(S.config.alertas===false) return;
  if(!R.esMesActual) return;
  const base = `${S.hogarId||"local"}:${R.mes}`;
  R.porCat.filter(c=>c.pres>0).forEach(c=>{
    const nivel = c.uso>=1 ? 100 : c.uso>=0.9 ? 90 : 0;
    if(!nivel) return;
    const clave = `${base}:${c.cod}:${nivel}`;
    if(alertadas.has(clave)) return;
    recordarAlerta(clave);
    if(nivel===100)
      notificar(`${c.nombre}: sobre agotado`,
        `Excedido en ${fmt(c.total-c.pres)}. Llevas ${fmt(c.total)} de ${fmt(c.pres)}.`,"panel");
    else
      notificar(`${c.nombre} al ${Math.round(c.uso*100)}%`,
        `Quedan ${fmt(c.pres-c.total)} del sobre y faltan ${R.restantes} días de mes.`,"panel");
  });
  // aviso global de ritmo, una vez por mes
  if(R.presupuestoTotal>0 && R.proyectado>R.presupuestoTotal*1.15){
    const clave=`${base}:RITMO`;
    if(!alertadas.has(clave)){
      recordarAlerta(clave);
      notificar("Vas por encima del presupuesto",
        `Al ritmo actual cerrarías el mes en ${fmt(R.proyectado)}, ${fmt(R.proyectado-R.presupuestoTotal)} de más.`,"ahorro");
    }
  }
}
async function pedirPermisoAlertas(){
  if(!("Notification" in window)) { avisar("Este navegador no admite alertas"); return; }
  const p = await Notification.requestPermission();
  if(p==="granted"){
    DB.guardarHogar({config:{...S.config,alertas:true}});
    notificar("Alertas activadas","Te avisaré cuando un sobre llegue al 90% de su presupuesto.");
    avisar("Alertas activadas");
  }else{
    avisar(p==="denied"?"Alertas bloqueadas en el navegador":"Permiso no concedido");
  }
  render();
}
const estadoAlertas = ()=>{
  if(!("Notification" in window)) return "no disponibles en este navegador";
  if(Notification.permission==="denied") return "bloqueadas · actívalas en los ajustes del navegador";
  if(Notification.permission!=="granted") return "sin activar";
  return S.config.alertas===false? "activas en el navegador, apagadas en la app" : "activas";
};

/* ==================== service worker / instalación ================ */
let promptInstalar = null;
let actualizacionPendiente = false;
let comprobandoVersion = false;

const partesVersion = v=>String(v||"0").split(".").map(x=>parseInt(x,10)||0);
function compararVersion(a,b){
  const x=partesVersion(a), y=partesVersion(b), n=Math.max(x.length,y.length);
  for(let i=0;i<n;i++) if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0);
  return 0;
}

function mostrarActualizacionObligatoria(version){
  if(actualizacionPendiente) return;
  actualizacionPendiente=true;
  cerrarMenu();
  const h=$("#modal-host");
  h.innerHTML=`<div class="modal"><div class="hoja" role="alertdialog" aria-modal="true" aria-labelledby="act-titulo">
    <div class="hoja-cab"><div><span class="cod">Nueva versión ${esc(version)}</span>
      <h2 id="act-titulo">Actualización necesaria</h2></div></div>
    <p class="nota">Hay una versión nueva de Presupuesto familiar. Debes instalarla para continuar y mantener los datos compatibles y protegidos.</p>
    <p class="error oculto" id="act-error"></p>
    <div class="fila-btns pie-modal"><span class="empuje"></span>
      <button class="btn primario" id="act-instalar">Actualizar ahora</button></div>
  </div></div>`;
  $("#act-instalar").onclick=instalarActualizacion;
}

async function instalarActualizacion(){
  const b=$("#act-instalar"), error=$("#act-error");
  b.disabled=true; b.textContent="Actualizando…";
  try{
    if(!("serviceWorker" in navigator)){ location.reload(); return; }
    const reg=await navigator.serviceWorker.getRegistration();
    if(!reg){ location.reload(); return; }
    await reg.update();
    const activar=w=>w?.postMessage("actualizar");
    if(reg.waiting) activar(reg.waiting);
    else if(reg.installing){
      reg.installing.addEventListener("statechange",()=>{
        if(reg.installing?.state==="installed") activar(reg.waiting||reg.installing);
      });
    }else location.reload();
    setTimeout(()=>location.reload(),6000);
  }catch(err){
    console.error(err); b.disabled=false; b.textContent="Reintentar actualización";
    error.textContent=navigator.onLine
      ? "No se pudo instalar la actualización. Inténtalo nuevamente."
      : "Conéctate a internet para instalar la actualización.";
    error.classList.remove("oculto");
  }
}

async function verificarActualizacion(){
  if(comprobandoVersion || !navigator.onLine) return;
  comprobandoVersion=true;
  try{
    const r=await fetch(`./version.json?t=${Date.now()}`,{cache:"no-store"});
    if(!r.ok) return;
    const v=await r.json();
    const publicada=String(v.version||"");
    const minima=String(v.minVersion||publicada);
    if(publicada && publicada!==APP_VERSION &&
       (v.force===true || compararVersion(APP_VERSION,minima)<0))
      mostrarActualizacionObligatoria(publicada);
  }catch(err){ console.warn("Versión:",err); }
  finally{ comprobandoVersion=false; }
}

function registrarSW(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol!=="https:" && location.hostname!=="localhost") return;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(actualizacionPendiente) location.reload();
  });
  navigator.serviceWorker.register("./sw.js").then(reg=>{
    reg.update().catch(()=>{});
  }).catch(e=>console.warn("SW:",e));
  navigator.serviceWorker.addEventListener("message",e=>{
    if(e.data?.tipo==="abrir-vista"){ S.vista=e.data.vista; render(); }
  });
}
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); promptInstalar=e; render(); });
window.addEventListener("appinstalled",()=>{ promptInstalar=null; avisar("App instalada"); render(); });
async function instalarApp(){
  if(!promptInstalar){
    avisar("Usa el menú del navegador → Añadir a pantalla de inicio");
    return;
  }
  promptInstalar.prompt();
  await promptInstalar.userChoice;
  promptInstalar=null; render();
}

/* ============================== arranque ========================== */
iniciarHistorial();
aplicarTema(leerLocal("pf-tema")||"papel");
aplicarTipo(leerLocal("pf-tipo")||"inter");
cargarFondoLocal();
registrarSW();
verificarActualizacion();
setInterval(verificarActualizacion,15*60*1000);
addEventListener("online",verificarActualizacion);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible") verificarActualizacion();
});
$("#btn-tema").onclick=alternarTema;
$("#btn-menu").onclick=()=>menuAbierto()? cerrarMenu() : abrirMenu();
$("#btn-clima").onclick=modalClima;
$("#sub-hogar").onclick=modalNombreHogar;
$("#btn-resumen").onclick=()=>irAVista("resumen");
pintarClima();
setInterval(pintarClima, CLIMA_TTL);
$("#velo").onclick=cerrarMenu;
addEventListener("resize",()=>{ ajustarCabecera(); if(enEscritorio() && menuAbierto()) cerrarMenu(); });
$("#mes-ant").onclick=()=>{S.mes=sumaMes(S.mes,-1);render()};
$("#mes-sig").onclick=()=>{S.mes=sumaMes(S.mes,1);render()};
$("#fab").onclick=()=>modalMovimiento();
/* El botón flotante se aparta mientras se desplaza la pantalla, para no tapar
   cifras, y vuelve al detenerse. */
if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
  let tFab;
  addEventListener("scroll",()=>{
    const f=$("#fab"); if(!f) return;
    f.classList.add("recogido");
    clearTimeout(tFab);
    tFab=setTimeout(()=>f.classList.remove("recogido"),520);
  },{passive:true});
}
document.addEventListener("keydown",e=>{ if(e.key!=="Escape" || actualizacionPendiente) return;
  if($("#modal-host").innerHTML) cerrarModal(); else cerrarMenu(); });

/* Accesos directos del icono: ?vista=estadisticas o ?accion=nuevo */
const params = new URLSearchParams(location.search);
if(params.get("vista")) S.vista = params.get("vista");
if(params.get("accion")==="nuevo") setTimeout(()=>{ if(!$("#app").classList.contains("oculto")) modalMovimiento(); },600);

if(HAY_FIREBASE){
  iniciarFirebase().catch(e=>{
    console.error(e);
    S.modo="local"; mostrarApp(); avisar("Firebase no disponible: modo local");
  });
}else{
  mostrarApp();
}
